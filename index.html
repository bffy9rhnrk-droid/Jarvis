<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>JARVIS - KARAHAN INC</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{

    background:#05080d;

    color:#f1f7fa;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


/* BACKGROUND */

body:before{

    content:"";

    position:fixed;

    inset:0;

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(0,210,255,.10),
            transparent 30%
        ),

        radial-gradient(
            circle at 15% 80%,
            rgba(0,110,180,.07),
            transparent 30%
        );

    pointer-events:none;
}


/* APP */

.app{

    position:relative;

    width:100%;
    height:100%;

}


/* TOP BAR */

.topbar{

    position:absolute;

    top:0;
    left:0;

    width:100%;

    height:75px;

    padding:14px 16px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    z-index:20;
}


/* MENU */

.menu-button{

    width:45px;
    height:45px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.08);

    background:rgba(10,17,25,.75);

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:5px;
}

.menu-button span{

    width:19px;

    height:2px;

    background:#39d9ff;

    border-radius:5px;

    box-shadow:0 0 8px rgba(57,217,255,.5);
}


/* BRAND */

.brand{

    text-align:right;
}

.brand-main{

    font-size:16px;

    font-weight:700;

    letter-spacing:3px;
}

.brand-sub{

    margin-top:4px;

    font-size:8px;

    letter-spacing:4px;

    color:#39d9ff;
}


/* STATUS */

.status{

    position:absolute;

    top:84px;

    left:50%;

    transform:translateX(-50%);

    font-size:8px;

    letter-spacing:2px;

    color:#607784;

    display:flex;

    align-items:center;

    gap:7px;
}

.status-dot{

    width:5px;
    height:5px;

    border-radius:50%;

    background:#39d9ff;

    box-shadow:0 0 10px #39d9ff;
}


/* CORE AREA */

.core-area{

    position:absolute;

    width:min(82vw,350px);

    height:min(82vw,350px);

    left:50%;

    top:40%;

    transform:translate(-50%,-50%);
}


/* HUD */

.hud{

    position:absolute;

    width:105px;

    padding:9px;

    border-radius:11px;

    background:rgba(7,14,21,.65);

    border:1px solid rgba(57,217,255,.12);

    backdrop-filter:blur(12px);

    z-index:5;
}

.hud-title{

    font-size:6px;

    letter-spacing:2px;

    color:#617681;

}

.hud-value{

    margin-top:4px;

    font-size:12px;

    color:#dffaff;

    font-weight:600;

}

.hud-sub{

    margin-top:3px;

    font-size:5px;

    letter-spacing:1px;

    color:#52636e;
}


.hud-1{
    left:-15px;
    top:20px;
}

.hud-2{
    right:-15px;
    top:20px;
}

.hud-3{
    left:-15px;
    bottom:20px;
}

.hud-4{
    right:-15px;
    bottom:20px;
}


/* ORBITS */

.orbit{

    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;

    transform:translate(-50%,-50%);

    border:1px solid rgba(57,217,255,.16);
}

.orbit-1{

    width:100%;
    height:100%;

    animation:rotate 24s linear infinite;
}

.orbit-2{

    width:87%;
    height:87%;

    border-style:dashed;

    animation:rotateReverse 18s linear infinite;
}

.orbit-3{

    width:73%;
    height:73%;

    animation:rotate 13s linear infinite;
}

.orbit-4{

    width:60%;
    height:60%;

    border-style:dashed;

    animation:rotateReverse 9s linear infinite;
}


/* DOTS */

.dot{

    position:absolute;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#39d9ff;

    box-shadow:
        0 0 8px #39d9ff,
        0 0 18px #39d9ff;
}

.dot-top{
    top:-3px;
    left:50%;
}

.dot-right{
    right:-3px;
    top:50%;
}

.dot-bottom{
    bottom:-3px;
    left:50%;
}

.dot-left{
    left:-3px;
    top:50%;
}


/* CORE */

.core{

    position:absolute;

    width:44%;
    height:44%;

    left:28%;
    top:28%;

    border-radius:50%;

    display:flex;

    justify-content:center;
    align-items:center;

    background:

        radial-gradient(
            circle,
            rgba(0,220,255,.22),
            rgba(3,24,35,.96) 68%
        );

    border:1px solid rgba(75,220,255,.7);

    box-shadow:

        0 0 25px rgba(57,217,255,.15),

        inset 0 0 30px rgba(57,217,255,.12);

    animation:pulse 4s ease-in-out infinite;
}

.core:before{

    content:"";

    position:absolute;

    inset:10%;

    border-radius:50%;

    border:1px solid rgba(57,217,255,.25);

    animation:rotate 7s linear infinite;
}

.core-letter{

    position:relative;

    z-index:2;

    font-size:60px;

    font-weight:300;

    color:#e2fbff;

    text-shadow:

        0 0 10px rgba(57,217,255,.9),

        0 0 30px rgba(57,217,255,.5);
}


/* CORE NAME */

.core-info{

    position:absolute;

    top:106%;

    left:50%;

    transform:translateX(-50%);

    text-align:center;

    white-space:nowrap;
}

.core-name{

    font-size:13px;

    letter-spacing:4px;

    font-weight:600;
}

.core-desc{

    margin-top:5px;

    font-size:7px;

    letter-spacing:3px;

    color:#5f747e;
}


/* CHAT */

.chat{

    position:absolute;

    left:50%;

    bottom:105px;

    transform:translateX(-50%);

    width:90%;

    max-width:580px;

    max-height:140px;

    overflow-y:auto;
}

.message{

    margin:7px 0;

    padding:10px 13px;

    border-radius:13px;

    background:rgba(8,15,22,.55);

    border:1px solid rgba(255,255,255,.05);

    font-size:12px;

    line-height:1.5;
}

.message.user{

    text-align:right;

    color:#dffaff;
}


/* COMMAND */

.command{

    position:absolute;

    left:50%;

    bottom:20px;

    transform:translateX(-50%);

    width:94%;

    max-width:600px;

    height:55px;

    padding:6px;

    display:flex;

    gap:7px;

    align-items:center;

    border-radius:18px;

    background:rgba(8,14,21,.85);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(20px);
}

#messageInput{

    flex:1;

    min-width:0;

    height:42px;

    border:0;

    outline:0;

    background:transparent;

    color:#fff;

    font-size:16px;

    padding:0 10px;
}

#messageInput::placeholder{

    color:#52616a;
}

.action{

    width:42px;
    height:42px;

    border-radius:13px;

    border:1px solid rgba(57,217,255,.12);

    background:rgba(57,217,255,.06);

    color:#39d9ff;
}


/* SIDEBAR */

.overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.55);

    opacity:0;

    visibility:hidden;

    transition:.3s;

    z-index:90;
}

.overlay.active{

    opacity:1;

    visibility:visible;
}

.sidebar{

    position:fixed;

    left:0;
    top:0;

    width:290px;

    max-width:82vw;

    height:100%;

    padding:25px 18px;

    background:rgba(7,12,18,.98);

    border-right:1px solid rgba(255,255,255,.08);

    transform:translateX(-105%);

    transition:.35s;

    z-index:100;
}

.sidebar.active{

    transform:translateX(0);
}

.sidebar-head{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:30px;
}

.sidebar-title{

    letter-spacing:3px;

    font-size:14px;

    font-weight:600;
}

.close{

    width:38px;
    height:38px;

    border-radius:11px;

    border:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.04);

    color:#9aaab2;
}

.nav{

    width:100%;

    padding:13px;

    margin-bottom:7px;

    border-radius:12px;

    border:1px solid transparent;

    background:transparent;

    color:#8c9ba3;

    text-align:left;
}

.nav.active{

    color:#dffaff;

    background:rgba(57,217,255,.07);

    border-color:rgba(57,217,255,.1);
}

.line{

    height:1px;

    background:rgba(255,255,255,.06);

    margin:20px 0;
}

.settings-title{

    color:#60717a;

    font-size:8px;

    letter-spacing:2px;

    margin-bottom:15px;
}

.setting{

    margin-bottom:18px;
}

.setting label{

    display:block;

    font-size:9px;

    color:#91a2aa;

    margin-bottom:7px;
}

.setting select{

    width:100%;

    height:40px;

    border-radius:10px;

    border:1px solid rgba(255,255,255,.07);

    background:#0b1118;

    color:#dffaff;

    padding:0 10px;
}


/* ANIMATION */

@keyframes rotate{

    from{
        transform:translate(-50%,-50%) rotate(0);
    }

    to{
        transform:translate(-50%,-50%) rotate(360deg);
    }
}

@keyframes rotateReverse{

    from{
        transform:translate(-50%,-50%) rotate(360deg);
    }

    to{
        transform:translate(-50%,-50%) rotate(0);
    }
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.025);
    }
}


/* MOBILE */

@media(max-width:480px){

    .hud{

        width:91px;

    }

    .hud-1,
    .hud-3{

        left:-5px;

    }

    .hud-2,
    .hud-4{

        right:-5px;

    }

    .hud-value{

        font-size:10px;

    }

    .chat{

        bottom:98px;

        max-height:100px;

    }

}

</style>

</head>


<body>

<div class="app">


<header class="topbar">

    <button class="menu-button" id="menuButton">

        <span></span>
        <span></span>
        <span></span>

    </button>


    <div class="brand">

        <div class="brand-main">
            J.A.R.V.I.S.
        </div>

        <div class="brand-sub">
            KARAHAN INC.
        </div>

    </div>

</header>


<div class="status">

    <span class="status-dot"></span>

    <span id="statusText">
        SYSTEM ONLINE
    </span>

</div>


<main>


<section class="core-area">


    <div class="hud hud-1">

        <div class="hud-title">
            ATMOSPHERE
        </div>

        <div class="hud-value" id="weather">
            -- C
        </div>

        <div class="hud-sub">
            DENIZLI
        </div>

    </div>


    <div class="hud hud-2">

        <div class="hud-title">
            NETWORK
        </div>

        <div class="hud-value" id="network">
            100%
        </div>

        <div class="hud-sub" id="networkText">
            ONLINE
        </div>

    </div>


    <div class="hud hud-3">

        <div class="hud-title">
            K-CORE
        </div>

        <div class="hud-value" id="coreLoad">
            18%
        </div>

        <div class="hud-sub">
            NEURAL LOAD
        </div>

    </div>


    <div class="hud hud-4">

        <div class="hud-title">
            LOCAL TIME
        </div>

        <div class="hud-value" id="clock">
            --:--
        </div>

        <div class="hud-sub" id="date">
            --.--.----
        </div>

    </div>


    <div class="orbit orbit-1">

        <div class="dot dot-top"></div>
        <div class="dot dot-bottom"></div>

    </div>


    <div class="orbit orbit-2">

        <div class="dot dot-right"></div>

    </div>


    <div class="orbit orbit-3"></div>


    <div class="orbit orbit-4">

        <div class="dot dot-left"></div>

    </div>


    <div class="core">

        <div class="core-letter">
            K
        </div>

    </div>


    <div class="core-info">

        <div class="core-name">
            J.A.R.V.I.S.
        </div>

        <div class="core-desc">
            PERSONAL AI SYSTEM
        </div>

    </div>


</section>


<section class="chat" id="chat">

    <div class="message">

        Merhaba Efendim, nasil yardimci olabilirim?

    </div>

</section>


<div class="command">

    <input
        id="messageInput"
        type="text"
        autocomplete="off"
        placeholder="JARVIS'e bir sey sorun..."
    >

    <button class="action" id="voiceButton">
        MIC
    </button>

    <button class="action" id="sendButton">
        >
    </button>

</div>


</main>


</div>


<div class="overlay" id="overlay"></div>


<aside class="sidebar" id="sidebar">


    <div class="sidebar-head">

        <div class="sidebar-title">
            J.A.R.V.I.S.
        </div>

        <button class="close" id="closeButton">
            X
        </button>

    </div>


    <button class="nav active">
        Ana Ekran
    </button>

    <button class="nav" id="chatButton">
        JARVIS Chat
    </button>

    <button class="nav">
        Ayarlar
    </button>


    <div class="line"></div>


    <div class="settings-title">
        SISTEM AYARLARI
    </div>


    <div class="setting">

        <label>
            Hitap Sekli
        </label>

        <select id="address">

            <option value="Efendim">
                Efendim
            </option>

            <option value="Komutanim">
                Komutanim
            </option>

            <option value="Patron">
                Patron
            </option>

            <option value="Ozel">
                Ozel
            </option>

        </select>

    </div>


    <div class="setting">

        <label>
            Eglence Modu
        </label>

        <select id="funMode">

            <option value="false">
                Kapali
            </option>

            <option value="true">
                Acik
            </option>

        </select>

    </div>


    <div class="setting">

        <label>
            Tema
        </label>

        <select id="theme">

            <option value="dark">
                Gece
            </option>

            <option value="light">
                Gunduz
            </option>

        </select>

    </div>


</aside>


<script>


/* ELEMENTS */

const menuButton =
    document.getElementById("menuButton");

const closeButton =
    document.getElementById("closeButton");

const sidebar =
    document.getElementById("sidebar");

const overlay =
    document.getElementById("overlay");

const sendButton =
    document.getElementById("sendButton");

const voiceButton =
    document.getElementById("voiceButton");

const messageInput =
    document.getElementById("messageInput");

const chat =
    document.getElementById("chat");

const address =
    document.getElementById("address");

const funMode =
    document.getElementById("funMode");

const theme =
    document.getElementById("theme");


/* MENU */

function openMenu(){

    sidebar.classList.add("active");

    overlay.classList.add("active");

}

function closeMenu(){

    sidebar.classList.remove("active");

    overlay.classList.remove("active");

}

menuButton.onclick = openMenu;

closeButton.onclick = closeMenu;

overlay.onclick = closeMenu;


/* CLOCK */

function updateClock(){

    const now = new Date();

    const h =
        String(now.getHours()).padStart(2,"0");

    const m =
        String(now.getMinutes()).padStart(2,"0");

    document.getElementById("clock")
        .textContent = h + ":" + m;

    const d =
        String(now.getDate()).padStart(2,"0");

    const mo =
        String(now.getMonth()+1).padStart(2,"0");

    document.getElementById("date")
        .textContent =
        d + "." + mo + "." + now.getFullYear();

}

updateClock();

setInterval(updateClock,1000);


/* NETWORK */

function updateNetwork(){

    const online = navigator.onLine;

    document.getElementById("network")
        .textContent = online ? "100%" : "0%";

    document.getElementById("networkText")
        .textContent = online ? "ONLINE" : "OFFLINE";

}

updateNetwork();

window.addEventListener(
    "online",
    updateNetwork
);

window.addEventListener(
    "offline",
    updateNetwork
);


/* WEATHER */

async function getWeather(){

    try{

        const response =
            await fetch(
                "https://api.open-meteo.com/v1/forecast?latitude=37.7765&longitude=29.0864&current=temperature_2m&timezone=Europe%2FIstanbul"
            );

        const data =
            await response.json();

        const temp =
            Math.round(
                data.current.temperature_2m
            );

        document.getElementById("weather")
            .textContent = temp + " C";

    }catch(error){

        document.getElementById("weather")
            .textContent = "-- C";

    }

}

getWeather();


/* CORE LOAD */

setInterval(function(){

    const value =
        Math.floor(
            12 + Math.random() * 18
        );

    document.getElementById("coreLoad")
        .textContent = value + "%";

},5000);


/* MESSAGE */

function addMessage(text,type){

    const element =
        document.createElement("div");

    element.className =
        "message " + (type || "");

    element.textContent = text;

    chat.appendChild(element);

    chat.scrollTop =
        chat.scrollHeight;

}


async function sendMessage(){

    const text =
        messageInput.value.trim();

    if(!text){
        return;
    }

    addMessage(text,"user");

    messageInput.value = "";

    document.getElementById("statusText")
        .textContent = "PROCESSING";

    document.getElementById("coreLoad")
        .textContent = "86%";


    const loading =
        document.createElement("div");

    loading.className =
        "message";

    loading.textContent =
        "JARVIS dusunuyor...";

    chat.appendChild(loading);


    try{

        const response =
            await fetch("/chat",{

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    message:text,

                    address:
                        address.value,

                    fun_mode:
                        funMode.value === "true"

                })

            });


        const data =
            await response.json();

        loading.remove();

        addMessage(
            data.response ||
            "Efendim, cevap alinamadi."
        );


    }catch(error){

        loading.remove();

        addMessage(
            "Efendim, sunucuya baglanamiyorum."
        );

    }


    document.getElementById("statusText")
        .textContent = "SYSTEM ONLINE";

}


sendButton.onclick =
    sendMessage;


messageInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* VOICE */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if(SpeechRecognition){

    const recognition =
        new SpeechRecognition();

    recognition.lang =
        "tr-TR";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    voiceButton.onclick =
        function(){

            recognition.start();

            voiceButton.textContent =
                "...";

            document.getElementById(
                "statusText"
            ).textContent =
                "LISTENING";

        };


    recognition.onresult =
        function(event){

            messageInput.value =
                event.results[0][0].transcript;

            voiceButton.textContent =
                "MIC";

            sendMessage();

        };


    recognition.onend =
        function(){

            voiceButton.textContent =
                "MIC";

            document.getElementById(
                "statusText"
            ).textContent =
                "SYSTEM ONLINE";

        };

}


/* SETTINGS */

address.onchange =
    function(){

        localStorage.setItem(
            "jarvis_address",
            address.value
        );

    };


funMode.onchange =
    function(){

        localStorage.setItem(
            "jarvis_fun",
            funMode.value
        );

    };


theme.onchange =
    function(){

        localStorage.setItem(
            "jarvis_theme",
            theme.value
        );

    };


/* LOAD SETTINGS */

const savedAddress =
    localStorage.getItem(
        "jarvis_address"
    );

const savedFun =
    localStorage.getItem(
        "jarvis_fun"
    );

const savedTheme =
    localStorage.getItem(
        "jarvis_theme"
    );


if(savedAddress){
    address.value =
        savedAddress;
}

if(savedFun){
    funMode.value =
        savedFun;
}

if(savedTheme){
    theme.value =
        savedTheme;
}


/* CHAT BUTTON */

document.getElementById(
    "chatButton"
).onclick =
    function(){

        closeMenu();

        setTimeout(
            function(){
                messageInput.focus();
            },
            300
        );

    };


</script>

</body>

</html>
