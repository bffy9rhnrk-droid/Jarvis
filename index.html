<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#02070a">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="K.A.R.V.I.S.">

<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" type="image/png" href="/icon.png">

<title>K.A.R.V.I.S. - KARAHAN INC.</title>


<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #02070a;
    color: #eaffff;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    overflow: hidden;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}


/* =====================================================
   APP
===================================================== */

.app {
    width: 100%;
    height: 100vh;
    height: 100dvh;

    display: flex;
    flex-direction: column;

    background:
        radial-gradient(
            circle at 50% 18%,
            rgba(0,255,255,.10),
            transparent 27%
        ),
        radial-gradient(
            circle at 50% 65%,
            rgba(0,170,190,.045),
            transparent 40%
        ),
        linear-gradient(
            180deg,
            #02070a,
            #02080b 45%,
            #010506
        );
}


/* =====================================================
   HEADER
===================================================== */

.header {
    height: 72px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background:
        linear-gradient(
            180deg,
            rgba(2,9,12,.98),
            rgba(2,7,9,.92)
        );

    border-bottom:
        1px solid rgba(0,255,255,.16);

    z-index: 10;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-mini {
    width: 43px;
    height: 43px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border:
        1px solid rgba(0,255,255,.9);

    color: #00ffff;

    font-size: 18px;
    font-weight: 900;

    text-shadow:
        0 0 8px rgba(0,255,255,.8);

    box-shadow:
        0 0 12px rgba(0,255,255,.35),
        0 0 30px rgba(0,255,255,.08),
        inset 0 0 16px rgba(0,255,255,.12);
}

.brand-title {
    font-size: 16px;
    font-weight: 850;
    letter-spacing: 3px;
}

.brand-subtitle {
    margin-top: 3px;

    font-size: 8px;
    letter-spacing: 4px;

    color: #64898d;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.status {
    font-size: 9px;
    letter-spacing: 2px;
    color: #58ffb5;
}

.status::before {
    content: "";

    display: inline-block;

    width: 6px;
    height: 6px;

    margin-right: 5px;

    border-radius: 50%;

    background: #58ffb5;

    box-shadow:
        0 0 8px #58ffb5;
}

.menu-button {
    width: 43px;
    height: 43px;

    border:
        1px solid rgba(0,255,255,.25);

    border-radius: 13px;

    background:
        rgba(0,255,255,.035);

    color: #00ffff;

    font-size: 20px;
}


/* =====================================================
   MAIN
===================================================== */

.main {
    position: relative;

    flex: 1;

    overflow: hidden;
}

.hero {
    position: absolute;

    inset: 0;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding-top: 48px;
    padding-bottom: 145px;

    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: none;
}

.hero::-webkit-scrollbar {
    display: none;
}


/* =====================================================
   CORE
===================================================== */

.jarvis-orb {
    position: relative;

    width: 205px;
    height: 205px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 25px;
}

.jarvis-orb::before {
    content: "";

    position: absolute;

    width: 204px;
    height: 204px;

    border-radius: 50%;

    border:
        1px solid rgba(0,255,255,.11);

    box-shadow:
        0 0 45px rgba(0,255,255,.06),
        inset 0 0 35px rgba(0,255,255,.04);
}

.jarvis-orb::after {
    content: "";

    position: absolute;

    width: 218px;
    height: 218px;

    border-radius: 50%;

    border:
        1px dashed rgba(0,255,255,.09);

    animation:
        spin 28s linear infinite;
}

.ring {
    position: absolute;

    border-radius: 50%;

    border:
        1px solid rgba(0,255,255,.45);
}

.ring.one {
    width: 190px;
    height: 190px;

    border-top-color: rgba(0,255,255,.9);
    border-bottom-color: rgba(0,255,255,.18);

    animation:
        spin 15s linear infinite;
}

.ring.two {
    width: 160px;
    height: 160px;

    border-style: dashed;

    border-color:
        rgba(0,255,255,.34);

    animation:
        spinReverse 11s linear infinite;
}

.ring.three {
    width: 126px;
    height: 126px;

    border-color:
        rgba(0,255,255,.6);

    box-shadow:
        0 0 25px rgba(0,255,255,.22),
        inset 0 0 25px rgba(0,255,255,.12);
}

.core {
    position: relative;

    width: 76px;
    height: 76px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
        2px solid #00ffff;

    color: #00ffff;

    font-size: 29px;
    font-weight: 950;

    text-shadow:
        0 0 12px rgba(0,255,255,.95);

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.12),
            rgba(0,20,23,.65) 65%,
            rgba(0,0,0,.4)
        );

    box-shadow:
        0 0 18px rgba(0,255,255,.5),
        0 0 45px rgba(0,255,255,.16),
        inset 0 0 25px rgba(0,255,255,.14);

    animation:
        pulse 2.5s infinite;
}


/* =====================================================
   TITLE
===================================================== */

.hero-title {
    font-size: 27px;

    font-weight: 850;

    letter-spacing: 6px;

    margin-bottom: 6px;
}

.hero-subtitle {
    font-size: 8px;

    letter-spacing: 5px;

    color: #668d91;
}


/* =====================================================
   MODE
===================================================== */

.active-mode {
    display: none;

    margin-top: 12px;

    padding: 7px 13px;

    border:
        1px solid rgba(0,255,255,.18);

    border-radius: 20px;

    background:
        rgba(0,255,255,.035);

    color: #78ffff;

    font-size: 9px;

    letter-spacing: 1.5px;
}

.active-mode.show {
    display: block;
}


/* =====================================================
   CHAT
===================================================== */

.chat {
    width: min(720px,92%);

    margin-top: 27px;

    display: flex;
    flex-direction: column;

    gap: 12px;
}

.message {
    padding: 14px 16px;

    border-radius: 15px;

    max-width: 92%;

    line-height: 1.58;

    font-size: 14px;

    white-space: pre-wrap;
}

.message.jarvis {
    align-self: flex-start;

    border:
        1px solid rgba(0,255,255,.15);

    background:
        linear-gradient(
            135deg,
            rgba(0,255,255,.055),
            rgba(0,20,23,.38)
        );

    color: #d9ffff;
}

.message.user {
    align-self: flex-end;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(255,255,255,.10);

    color: white;
}


/* =====================================================
   PDF BUTTON
===================================================== */

.file-button {
    display: inline-block;

    margin-top: 12px;

    padding: 11px 15px;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            #00ffff,
            #00bfc8
        );

    color: #001010;

    text-decoration: none;

    font-size: 12px;

    font-weight: 900;

    letter-spacing: .5px;
}


/* =====================================================
   INPUT
===================================================== */

.input-area {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 12px;

    background:
        linear-gradient(
            to top,
            rgba(2,7,10,1) 55%,
            rgba(2,7,10,.85) 72%,
            transparent
        );

    z-index: 5;
}

.input-box {
    width: min(720px,100%);

    margin: auto;

    display: flex;

    gap: 8px;

    padding: 8px;

    border:
        1px solid rgba(0,255,255,.25);

    border-radius: 18px;

    background:
        rgba(3,13,16,.94);

    box-shadow:
        0 0 25px rgba(0,255,255,.055);

    backdrop-filter: blur(15px);
}

.input-box input {
    flex: 1;

    min-width: 0;

    border: none;
    outline: none;

    background: transparent;

    color: white;

    padding: 12px;

    font-size: 16px;
}

.input-box input::placeholder {
    color: #5c7d81;
}

.send-button {
    width: 48px;
    height: 48px;

    flex-shrink: 0;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #00ffff,
            #00caca
        );

    color: #001010;

    font-weight: 900;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
    position: fixed;

    top: 0;
    left: -295px;

    width: 285px;
    height: 100vh;

    padding: 22px;

    background:
        linear-gradient(
            180deg,
            #030b0e,
            #02080a
        );

    border-right:
        1px solid rgba(0,255,255,.20);

    box-shadow:
        15px 0 40px rgba(0,0,0,.35);

    z-index: 100;

    transition:
        left .25s ease;

    overflow-y: auto;
}

.sidebar.open {
    left: 0;
}

.sidebar-title {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 25px;
}

.sidebar-title strong {
    letter-spacing: 3px;
}

.close-sidebar {
    border: none;

    background: transparent;

    color: #00ffff;

    font-size: 24px;
}

.sidebar-profile {
    display: none;

    margin-bottom: 17px;

    padding: 10px 12px;

    border:
        1px solid rgba(0,255,255,.12);

    border-radius: 10px;

    background:
        rgba(0,255,255,.025);

    color: #7fa9ad;

    font-size: 10px;
}

.sidebar-profile.show {
    display: block;
}

.sidebar-profile strong {
    display: block;

    color: #00ffff;

    font-size: 12px;

    margin-bottom: 3px;
}

.menu-section-title {
    display: none;

    margin: 18px 4px 9px;

    color: #4f858a;

    font-size: 8px;

    letter-spacing: 2px;
}

.menu-section-title.show {
    display: block;
}

.menu-item {
    width: 100%;

    padding: 14px;

    margin-bottom: 9px;

    text-align: left;

    border:
        1px solid rgba(0,255,255,.11);

    border-radius: 12px;

    background:
        rgba(0,255,255,.025);

    color: #d9ffff;

    font-size: 13px;
}

.academic-menu {
    display: none;
}

.academic-menu.show {
    display: block;
}

.academic-menu .menu-item.active {
    border-color:
        rgba(0,255,255,.60);

    background:
        rgba(0,255,255,.08);

    box-shadow:
        inset 0 0 15px rgba(0,255,255,.035);
}


/* =====================================================
   MODAL
===================================================== */

.modal {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 18px;

    background:
        rgba(0,0,0,.76);

    backdrop-filter: blur(7px);

    z-index: 200;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(600px,100%);

    max-height: 85vh;

    overflow-y: auto;

    padding: 20px;

    border:
        1px solid rgba(0,255,255,.22);

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            #061417,
            #02090b
        );
}

.modal-title {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 18px;
}

.modal-title h2 {
    margin: 0;

    font-size: 17px;

    letter-spacing: 2px;
}

.modal-close {
    border: none;

    background: transparent;

    color: #00ffff;

    font-size: 23px;
}

.modal input {
    width: 100%;

    padding: 13px;

    margin-bottom: 10px;

    border:
        1px solid rgba(0,255,255,.18);

    border-radius: 10px;

    background:
        #020708;

    color: white;

    outline: none;
}

.modal-action {
    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #00ffff,
            #00caca
        );

    color: #001010;

    font-weight: 800;
}


/* =====================================================
   TEMALAR
===================================================== */

body.sinem-mode .core,
body.sinem-mode .ring {
    border-color: #ff6fae;
}

body.sinem-mode .core {
    color: #ff6fae;
}

body.teacher-mode .core,
body.teacher-mode .ring {
    border-color: #36dfff;
}

body.teacher-mode .core {
    color: #36dfff;
}

body.fun-mode .core,
body.fun-mode .ring {
    border-color: #ff3030;
}

body.fun-mode .core {
    color: #ff3030;
}


/* =====================================================
   ANIMASYON
===================================================== */

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes spinReverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes pulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.055);
    }
}

</style>

</head>

<script>

const API = "";

let currentUser = "karahan";

let currentMode = "normal";

let funMode = false;

let sending = false;


/* =====================================================
   SIDEBAR
===================================================== */

function openSidebar() {

    document
        .getElementById("sidebar")
        .classList
        .add("open");
}


function closeSidebar() {

    document
        .getElementById("sidebar")
        .classList
        .remove("open");
}


/* =====================================================
   MESAJ
===================================================== */

function addMessage(
    text,
    type
) {

    const chat =
        document.getElementById(
            "chat"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message " + type;


    div.textContent =
        text;


    chat.appendChild(div);


    const hero =
        document.querySelector(
            ".hero"
        );


    hero.scrollTop =
        hero.scrollHeight;


    return div;
}


/* =====================================================
   PDF MESAJI
===================================================== */

function addPresentationMessage(
    text,
    fileUrl,
    fileName
) {

    const chat =
        document.getElementById(
            "chat"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message jarvis";


    div.textContent =
        text;


    const link =
        document.createElement(
            "a"
        );


    link.className =
        "file-button";


    link.href =
        fileUrl;


    link.target =
        "_blank";


    link.rel =
        "noopener";


    link.textContent =
        "📄 PDF SUNUMU AÇ";


    div.appendChild(
        document.createElement(
            "br"
        )
    );


    div.appendChild(
        link
    );


    chat.appendChild(
        div
    );


    const hero =
        document.querySelector(
            ".hero"
        );


    hero.scrollTop =
        hero.scrollHeight;
}


/* =====================================================
   MOD GÖSTERGESİ
===================================================== */

function updateModeIndicator() {

    const indicator =
        document.getElementById(
            "activeMode"
        );


    const names = {

        research:
            "🔬 ARAŞTIRMA MODU",

        academic:
            "📚 AKADEMİK MOD",

        article:
            "📝 MAKALE ASİSTANI",

        lesson:
            "🎓 DERS ASİSTANI",

        quiz:
            "🧪 SINAV / QUIZ",

        presentation:
            "🎞️ SUNUM ASİSTANI"

    };


    if (
        currentUser === "ilknur"
        &&
        names[currentMode]
    ) {

        indicator.textContent =
            names[currentMode];

        indicator.classList.add(
            "show"
        );

    } else {

        indicator.classList.remove(
            "show"
        );
    }
}


/* =====================================================
   MOD SEÇ
===================================================== */

function selectAcademicMode(
    mode
) {

    if (
        currentUser !== "ilknur"
    ) {

        return;
    }


    currentMode =
        mode;


    document
        .querySelectorAll(
            ".academic-menu .menu-item[data-mode]"
        )
        .forEach(
            button => {

                button.classList.toggle(

                    "active",

                    button.dataset.mode ===
                    mode

                );

            }
        );


    updateModeIndicator();

    closeSidebar();


    const messages = {

        research:
            "🔬 Araştırma Modu aktif. Güncel internet kaynaklarını araştırabilirim.",

        academic:
            "📚 Akademik Mod aktif. Akademik analiz ve araştırmalarda hazırım.",

        article:
            "📝 Makale Asistanı aktif. Akademik metin ve makale çalışmalarında hazırım.",

        lesson:
            "🎓 Ders Asistanı aktif. Ders planı ve konu anlatımı hazırlamaya hazırım.",

        quiz:
            "🧪 Sınav / Quiz modu aktif. Öğrenciler için soru ve test hazırlayabilirim.",

        presentation:
            "🎞️ Sunum Asistanı aktif. Profesyonel, görselli PDF sunumları hazırlayabilirim."

    };


    addMessage(
        messages[mode],
        "jarvis"
    );
}


/* =====================================================
   MESAJ GÖNDER
===================================================== */

async function sendMessage() {

    if (sending) {
        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    sending = true;

    button.disabled = true;

    input.value = "";


    addMessage(
        message,
        "user"
    );


    let waitingMessages = [

        "Bir saniye efendim...",

        "Tamam, bir bakıyorum...",

        "Dur, bunu birlikte çözelim...",

        "Bir dakika, düşünüyorum...",

        "Tamam, hemen ilgileniyorum..."

    ];


    if (
        currentUser === "ilknur"
    ) {

        waitingMessages = [

            "Elbette Hocam, hemen bakıyorum...",

            "Tabii Hocam, konuyu inceliyorum...",

            "Hocam, bilgileri değerlendiriyorum...",

            "Bir dakika Hocam, kaynakları kontrol ediyorum..."

        ];


        if (
            currentMode === "research"
        ) {

            waitingMessages = [

                "Elbette Hocam, güncel kaynakları araştırıyorum...",

                "Hocam, internet kaynaklarını inceliyorum...",

                "Kaynakları kontrol ediyorum Hocam..."

            ];

        }


        if (
            currentMode === "presentation"
        ) {

            waitingMessages = [

                "Hocam, profesyonel sunumu hazırlıyorum...",

                "Görselleri ve ders içeriğini düzenliyorum...",

                "PDF sunumunuzu oluşturuyorum Hocam..."

            ];

        }

    }


    const waiting =
        addMessage(

            waitingMessages[
                Math.floor(
                    Math.random() *
                    waitingMessages.length
                )
            ],

            "jarvis"

        );


    try {

        const response =
            await fetch(

                API + "/chat",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            username:
                                currentUser,

                            mode:
                                currentMode

                        })

                }

            );


        const data =
            await response.json();


        waiting.remove();


        if (
            !response.ok
        ) {

            const detail =
                data.detail || {};


            addMessage(

                "⚠️ K.A.R.V.I.S. HATA\n\n" +

                (
                    detail.message ||
                    "Beklenmeyen bir hata oluştu."
                ) +

                "\n\nHata kaydı Hatalar bölümüne kaydedildi.",

                "jarvis"

            );


            return;
        }


        if (
            data.presentation &&
            data.file_url
        ) {

            addPresentationMessage(

                data.answer,

                data.file_url,

                data.file_name

            );

        } else {

            addMessage(

                data.answer,

                "jarvis"

            );

        }


    } catch (error) {

        waiting.remove();


        addMessage(

            "⚠️ K.A.R.V.I.S.\n\n" +

            "Sunucuya bağlanırken bir sorun oluştu.\n\n" +

            error.message,

            "jarvis"

        );

    } finally {

        sending = false;

        button.disabled = false;

        input.focus();

    }
}


/* =====================================================
   ENTER
===================================================== */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
                &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );

        currentUser === "betul"

    }


    if (
        currentUser === "sinem"
    ) {

            "Hoş geldiniz prenses. 💗 K.A.R.V.I.S. hazır.";

    }


    if (
        currentUser === "ilknur"

/* =====================================================
   HATALAR
===================================================== */

async function openErrors() {

    closeSidebar();


    document
        .getElementById(
            "errorModal"
        )
        .classList
        .add("show");


    await loadErrors();
}


function closeErrors() {

    document
        .getElementById(
            "errorModal"
        )
        .classList
        .remove("show");
}


async function loadErrors() {

    const list =
        document.getElementById(
            "errorList"
        );


    list.innerHTML =
        "Yükleniyor...";


    try {

        const response =
            await fetch(
                API + "/errors"
            );


        const data =
            await response.json();


        const errors =
            data.errors || [];


        if (
            errors.length === 0
        ) {

            list.innerHTML =
                "Henüz hata kaydı yok.";

            return;
        }


        list.innerHTML = "";


        [...errors]
            .reverse()
            .forEach(
                error => {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.style.cssText =
                        "padding:13px;margin-bottom:10px;border-radius:12px;background:rgba(255,70,70,.045);border:1px solid rgba(255,80,80,.17);";


                    card.innerHTML =

                        "<b>" +
                        escapeHtml(
                            error.provider
                        ) +
                        "</b><br>" +

                        "<span style='color:#ffbd6b'>" +
                        escapeHtml(
                            error.type
                        ) +
                        "</span><br><br>" +

                        escapeHtml(
                            error.message
                        ) +

                        "<br><small>" +

                        escapeHtml(
                            error.error || ""
                        ) +

                        "</small>";


                    list.appendChild(
                        card
                    );

                }
            );


    } catch (error) {

        list.innerHTML =
            "Hatalar yüklenemedi.";
    }
}


async function clearErrors() {

    try {

        await fetch(

            API + "/errors",

            {
                method: "DELETE"
            }

        );


        await loadErrors();


    } catch (error) {

        alert(
            "Hatalar temizlenemedi."
        );
    }
}


/* =====================================================
   PROFİL
===================================================== */

function openProfile() {

    closeSidebar();


    document
        .getElementById(
            "profileModal"
        )
        .classList
        .add("show");
}


function closeProfile() {

    document
        .getElementById(
            "profileModal"
        )

}


async function loginProfile() {

    const usernameInput =
        document.getElementById(
            "profileUsername"
        );


    const passwordInput =
        document.getElementById(
            "profilePassword"
        );


    const errorBox =
        document.getElementById(
            "profileError"
        );


    let username =
        usernameInput.value
            .trim()
            .toLowerCase();


    if (
        username === "betül"
    ) {

        username =
            "betul";
    }


    const password =
        passwordInput.value;


    errorBox.textContent =
        "";


    try {

        const response =
            await fetch(

                API +
                "/profile-login",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            password:
                                password

                        })

                }

            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            errorBox.textContent =
                data.detail ||
                "Giriş başarısız.";

            return;
        }


        currentUser =
            data.username;


        localStorage.setItem(
            "karvis_user",
            currentUser
        );


        if (
            currentUser === "ilknur"
        ) {

            currentMode =
                "lesson";

        } else {

            currentMode =
                "normal";
        }


        applyUserTheme();

        updateSidebar();

        updateModeIndicator();


        document
            .getElementById(
                "chat"
            )
            .innerHTML = "";


        closeProfile();


        showGreeting();


    } catch (error) {

        errorBox.textContent =
            "Sunucu bağlantı hatası.";
    }
}


/* =====================================================
   TEMA
===================================================== */

function applyUserTheme() {

    document.body
        .classList
        .remove(
            "sinem-mode",
            "teacher-mode"
        );


    if (
        currentUser === "sinem"
    ) {

        document.body
            .classList
            .add(
                "sinem-mode"
            );
    }


    if (
        currentUser === "ilknur"
    ) {

        document.body
            .classList
            .add(
                "teacher-mode"
            );
    }
}


/* =====================================================
   SIDEBAR KULLANICI
===================================================== */

function updateSidebar() {

    const normalMenu =
        document.getElementById(
            "normalMenu"
        );


    const academicMenu =
        document.getElementById(
            "academicMenu"
        );


    const academicTitle =
        document.getElementById(
            "academicTitle"
        );


    const profile =
        document.getElementById(
            "sidebarProfile"
        );


    const profileName =
        document.getElementById(
            "sidebarProfileName"
        );


    const profileRole =
        document.getElementById(
            "sidebarProfileRole"
        );


    if (
        currentUser === "ilknur"
    ) {

        normalMenu.style.display =
            "none";


        academicMenu.classList.add(
            "show"
        );


        academicTitle.classList.add(
            "show"
        );


        profile.classList.add(
            "show"
        );


        profileName.textContent =
            "İlknur Hocam";


        profileRole.textContent =
            "Öğretmen / Akademik Kullanıcı";


    } else {

        normalMenu.style.display =
            "block";


        academicMenu.classList.remove(
            "show"
        );


        academicTitle.classList.remove(
            "show"
        );


        profile.classList.remove(
            "show"
        );
    }


    document
        .querySelectorAll(
            ".academic-menu .menu-item[data-mode]"
        )
        .forEach(
            button => {

                button.classList.toggle(

                    "active",

                    currentUser === "ilknur"
                    &&
                    button.dataset.mode ===
                    currentMode

                );

            }
        );
}


/* =====================================================
   EĞLENCE
===================================================== */

function toggleFunMode() {

    closeSidebar();


    funMode =
        !funMode;


    document.body
        .classList
        .toggle(
            "fun-mode",
            funMode
        );


    addMessage(

        funMode

            ? "Eğlence modu aktif. 😈"

            : "Eğlence modu kapatıldı.",

    );
}


/* =====================================================
   GÜVENLİK
===================================================== */

function escapeHtml(
    text
) {

    return String(
        text || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );
}


/* =====================================================
   BAŞLANGIÇ
===================================================== */

function initialize() {

    const savedUser =
        localStorage.getItem(
            "karvis_user"
        );


    if (

        savedUser === "karahan" ||

        savedUser === "betul" ||

        savedUser === "sinem" ||

        savedUser === "ilknur"

    ) {

        currentUser =
            savedUser;

    }


    if (
        currentUser === "ilknur"
    ) {

        currentMode =
            "lesson";

    } else {

        currentMode =
            "normal";
    }


    applyUserTheme();

    updateSidebar();

    updateModeIndicator();

    showGreeting();
}


initialize();
