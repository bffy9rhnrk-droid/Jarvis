<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    name="theme-color"
    content="#050b12"
>

<title>J.A.R.V.I.S. - KARAHAN INC.</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #050b12;
    color: #e9fbff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    overflow-x: hidden;
    transition:
        background 0.4s ease,
        color 0.4s ease;
}


/* =========================================================
   ANA ALAN
   ========================================================= */

.app {
    min-height: 100vh;
    position: relative;
    overflow: hidden;
}


/* =========================================================
   ARKA PLAN
   ========================================================= */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.grid {
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(0, 229, 255, 0.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0, 229, 255, 0.025) 1px,
            transparent 1px
        );

    background-size: 42px 42px;
}

.glow {
    position: absolute;

    width: 320px;
    height: 320px;

    left: 50%;
    top: 40%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0, 229, 255, 0.08),
            transparent 70%
        );

    filter: blur(10px);
}


/* =========================================================
   HEADER
   ========================================================= */

.header {
    height: 70px;

    display: flex;
    align-items: center;

    padding:
        0 16px;

    position: relative;
    z-index: 10;

    border-bottom:
        1px solid rgba(0, 229, 255, 0.12);

    background:
        rgba(3, 10, 17, 0.76);

    backdrop-filter: blur(20px);
}

.menu-button {
    width: 44px;
    height: 44px;

    border: 1px solid rgba(0, 229, 255, 0.22);

    border-radius: 12px;

    background:
        rgba(0, 229, 255, 0.04);

    color: #8fefff;

    font-size: 23px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.brand {
    margin-left: 12px;
}

.brand-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 2px;
}

.brand-subtitle {
    margin-top: 2px;

    font-size: 9px;

    color: #5acfe1;

    letter-spacing: 3px;
}

.current-user {
    margin-left: auto;

    display: flex;
    flex-direction: column;

    align-items: flex-end;
}

.current-user-name {
    font-size: 12px;
    font-weight: 700;
}

.current-user-role {
    font-size: 9px;
    color: #63808a;
}


/* =========================================================
   ANA İÇERİK
   ========================================================= */

.main {
    position: relative;
    z-index: 2;

    width: 100%;
    min-height:
        calc(100vh - 70px);

    display: flex;
    flex-direction: column;
    align-items: center;

    padding:
        35px 16px 110px;
}


/* =========================================================
   LOGO
   ========================================================= */

.logo-area {
    margin-top: 15px;

    display: flex;
    flex-direction: column;

    align-items: center;
}

.logo {
    width: 145px;
    height: 145px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-ring {
    position: absolute;

    inset: 0;

    border:
        1px solid rgba(0, 229, 255, 0.34);

    border-radius: 50%;

    animation:
        rotate 12s linear infinite;
}

.logo-ring:nth-child(2) {
    inset: 13px;

    border-color:
        rgba(0, 229, 255, 0.20);

    animation-direction: reverse;
    animation-duration: 8s;
}

.logo-ring:nth-child(3) {
    inset: 27px;

    border-color:
        rgba(0, 229, 255, 0.14);

    animation-duration: 5s;
}

.logo-core {
    width: 76px;
    height: 76px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
        1px solid rgba(0, 229, 255, 0.55);

    background:
        radial-gradient(
            circle,
            rgba(0, 229, 255, 0.16),
            rgba(0, 229, 255, 0.02)
        );

    box-shadow:
        0 0 30px rgba(0, 229, 255, 0.12);

    color: #8fefff;

    font-size: 35px;
    font-weight: 900;

    text-shadow:
        0 0 18px rgba(0, 229, 255, 0.7);
}

.logo-status {
    margin-top: 15px;

    font-size: 10px;

    color: #56cbdc;

    letter-spacing: 3px;

    text-transform: uppercase;
}


/* =========================================================
   KARŞILAMA
   ========================================================= */

.greeting {
    margin-top: 35px;

    text-align: center;
}

.greeting h1 {
    margin: 0;

    font-size:
        clamp(25px, 7vw, 38px);

    font-weight: 700;

    letter-spacing: -0.5px;
}

.greeting p {
    margin:
        9px 0 0;

    color: #63808a;

    font-size: 13px;
}


/* =========================================================
   CHAT
   ========================================================= */

.chat {
    width: 100%;
    max-width: 760px;

    margin-top: 35px;
}

.messages {
    display: flex;
    flex-direction: column;

    gap: 14px;

    width: 100%;
}

.message {
    max-width: 90%;

    padding:
        13px 15px;

    border-radius: 17px;

    line-height: 1.55;

    font-size: 14px;

    animation:
        messageIn 0.25s ease;
}

.message.jarvis {
    align-self: flex-start;

    background:
        rgba(0, 229, 255, 0.045);

    border:
        1px solid rgba(0, 229, 255, 0.12);

    color: #d9f8fc;
}

.message.user {
    align-self: flex-end;

    background:
        rgba(0, 229, 255, 0.10);

    border:
        1px solid rgba(0, 229, 255, 0.16);
}


/* =========================================================
   INPUT
   ========================================================= */

.input-area {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 20;

    padding:
        10px 12px
        calc(10px + env(safe-area-inset-bottom));

    background:
        linear-gradient(
            transparent,
            rgba(3, 10, 17, 0.96) 35%
        );
}

.input-box {
    width: 100%;
    max-width: 760px;

    margin: auto;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 7px;

    border:
        1px solid rgba(0, 229, 255, 0.17);

    border-radius: 17px;

    background:
        rgba(5, 14, 22, 0.94);

    backdrop-filter: blur(20px);
}

.input-box input {
    flex: 1;

    min-width: 0;

    height: 44px;

    border: 0;
    outline: 0;

    background: transparent;

    color: #fff;

    font-size: 16px;
}

.input-box input::placeholder {
    color: #506a73;
}

.send {
    width: 44px;
    height: 44px;

    border: 0;

    border-radius: 13px;

    background:
        rgba(0, 229, 255, 0.12);

    color: #8fefff;

    font-size: 20px;

    cursor: pointer;
}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {
    position: fixed;

    top: 0;
    bottom: 0;
    left: 0;

    width: 300px;

    z-index: 100;

    padding:
        80px 18px 20px;

    background:
        rgba(3, 10, 17, 0.98);

    border-right:
        1px solid rgba(0, 229, 255, 0.14);

    transform:
        translateX(-105%);

    transition:
        transform 0.3s ease;
}

.sidebar.open {
    transform:
        translateX(0);
}

.sidebar-title {
    color: #5fd7e7;

    font-size: 10px;

    letter-spacing: 3px;

    margin-bottom: 14px;
}

.profile-card {
    padding: 15px;

    border:
        1px solid rgba(0, 229, 255, 0.12);

    border-radius: 15px;

    background:
        rgba(0, 229, 255, 0.035);

    margin-bottom: 16px;
}

.profile-name {
    font-weight: 700;
}

.profile-role {
    margin-top: 4px;

    color: #607981;

    font-size: 11px;
}

.menu-item {
    width: 100%;

    padding: 14px;

    margin-bottom: 8px;

    display: flex;
    align-items: center;

    gap: 12px;

    border:
        1px solid rgba(0, 229, 255, 0.08);

    border-radius: 13px;

    background:
        rgba(255,255,255,0.015);

    color: #d9f8fc;

    cursor: pointer;

    text-align: left;
}

.menu-icon {
    font-size: 20px;
}

.menu-text {
    display: flex;
    flex-direction: column;
}

.menu-main {
    font-size: 13px;
    font-weight: 700;
}

.menu-sub {
    margin-top: 3px;

    font-size: 10px;

    color: #607981;
}


/* =========================================================
   OVERLAY
   ========================================================= */

.overlay {
    position: fixed;

    inset: 0;

    z-index: 90;

    background:
        rgba(0,0,0,0.55);

    opacity: 0;
    pointer-events: none;

    transition:
        opacity 0.3s ease;
}

.overlay.show {
    opacity: 1;
    pointer-events: auto;
}


/* =========================================================
   MODAL
   ========================================================= */

.modal {
    position: fixed;

    inset: 0;

    z-index: 200;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,0.72);

    backdrop-filter: blur(10px);
}

.modal.show {
    display: flex;
}

.modal-card {
    width: 100%;
    max-width: 390px;

    padding: 25px;

    border:
        1px solid rgba(0, 229, 255, 0.20);

    border-radius: 23px;

    background:
        #07131c;

    box-shadow:
        0 20px 80px rgba(0,0,0,0.5);
}

.modal-title {
    font-size: 20px;
    font-weight: 800;
}

.modal-subtitle {
    margin-top: 6px;

    color: #66808a;

    font-size: 12px;
}

.modal-input {
    width: 100%;

    height: 48px;

    margin-top: 12px;

    padding: 0 14px;

    border:
        1px solid rgba(0,229,255,0.14);

    border-radius: 13px;

    outline: none;

    background:
        rgba(0,229,255,0.035);

    color: #fff;

    font-size: 16px;
}

.modal-actions {
    display: flex;

    gap: 8px;

    margin-top: 15px;
}

.modal-button {
    flex: 1;

    height: 45px;

    border: 0;

    border-radius: 12px;

    background:
        rgba(0,229,255,0.10);

    color: #9beefa;

    font-weight: 700;
}

.modal-button.cancel {
    background:
        rgba(255,255,255,0.04);

    color: #70848b;
}

.login-error {
    margin-top: 10px;

    color: #ff7373;

    font-size: 12px;

    min-height: 16px;
}


/* =========================================================
   BEKLEME
   ========================================================= */

.typing {
    display: inline-flex;

    gap: 4px;
}

.typing span {
    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #63dceb;

    animation:
        typing 1s infinite;
}

.typing span:nth-child(2) {
    animation-delay: 0.15s;
}

.typing span:nth-child(3) {
    animation-delay: 0.3s;
}


/* =========================================================
   SİNEM TEMASI
   ========================================================= */

body.sinem-theme {
    background:
        #160b14;
}

body.sinem-theme .grid {
    background-image:
        linear-gradient(
            rgba(255, 105, 180, 0.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255, 105, 180, 0.035) 1px,
            transparent 1px
        );
}

body.sinem-theme .glow {
    background:
        radial-gradient(
            circle,
            rgba(255, 72, 160, 0.13),
            transparent 70%
        );
}

body.sinem-theme .header {
    background:
        rgba(20, 7, 17, 0.82);

    border-bottom-color:
        rgba(255, 105, 180, 0.18);
}

body.sinem-theme .menu-button {
    border-color:
        rgba(255, 105, 180, 0.28);

    background:
        rgba(255, 105, 180, 0.06);

    color: #ff9fd0;
}

body.sinem-theme .brand-subtitle {
    color: #ff7fbb;
}

body.sinem-theme .logo-ring {
    border-color:
        rgba(255, 105, 180, 0.38);
}

body.sinem-theme .logo-ring:nth-child(2) {
    border-color:
        rgba(255, 105, 180, 0.23);
}

body.sinem-theme .logo-ring:nth-child(3) {
    border-color:
        rgba(255, 105, 180, 0.16);
}

body.sinem-theme .logo-core {
    border-color:
        rgba(255, 105, 180, 0.58);

    background:
        radial-gradient(
            circle,
            rgba(255, 105, 180, 0.18),
            rgba(255, 105, 180, 0.025)
        );

    color: #ffacd5;

    box-shadow:
        0 0 35px rgba(255, 105, 180, 0.16);

    text-shadow:
        0 0 18px rgba(255, 105, 180, 0.75);
}

body.sinem-theme .logo-status {
    color: #ff83be;
}

body.sinem-theme .message.jarvis {
    background:
        rgba(255, 105, 180, 0.055);

    border-color:
        rgba(255, 105, 180, 0.15);
}

body.sinem-theme .message.user {
    background:
        rgba(255, 105, 180, 0.12);

    border-color:
        rgba(255, 105, 180, 0.18);
}

body.sinem-theme .input-box {
    border-color:
        rgba(255, 105, 180, 0.22);

    background:
        rgba(24, 8, 19, 0.95);
}

body.sinem-theme .send {
    background:
        rgba(255, 105, 180, 0.13);

    color: #ffacd5;
}

body.sinem-theme .sidebar {
    background:
        rgba(19, 6, 15, 0.99);

    border-right-color:
        rgba(255, 105, 180, 0.17);
}

body.sinem-theme .sidebar-title {
    color: #ff83be;
}

body.sinem-theme .profile-card {
    border-color:
        rgba(255, 105, 180, 0.15);

    background:
        rgba(255, 105, 180, 0.045);
}

body.sinem-theme .menu-item {
    border-color:
        rgba(255, 105, 180, 0.10);
}

body.sinem-theme .modal-card {
    border-color:
        rgba(255, 105, 180, 0.22);

    background:
        #190b16;
}


/* =========================================================
   EĞLENCE MODU
   ========================================================= */

body.fun-mode .logo-ring {
    animation-duration: 3s;
}

body.fun-mode .logo-core {
    transform:
        rotate(-3deg) scale(1.04);
}


/* =========================================================
   GÜNDÜZ MODU
   ========================================================= */

body.day-mode {
    background:
        #eef8fb;

    color: #09202a;
}

body.day-mode .header {
    background:
        rgba(238,248,251,0.88);

    border-bottom-color:
        rgba(0,100,120,0.14);
}

body.day-mode .brand-title,
body.day-mode .greeting h1,
body.day-mode .current-user-name {
    color: #09202a;
}

body.day-mode .greeting p,
body.day-mode .current-user-role {
    color: #54727b;
}

body.day-mode .input-box {
    background:
        rgba(255,255,255,0.95);
}

body.day-mode .input-box input {
    color: #09202a;
}

body.day-mode .sidebar {
    background:
        #f3fbfd;
}


/* =========================================================
   ANİMASYONLAR
   ========================================================= */

@keyframes rotate {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform:
            translateY(8px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}

@keyframes typing {
    0%,
    100% {
        opacity: 0.25;
        transform: translateY(0);
    }

    50% {
        opacity: 1;
        transform: translateY(-3px);
    }
}


/* =========================================================
   MOBİL
   ========================================================= */

@media (max-width: 600px) {

    .current-user-role {
        display: none;
    }

    .brand-title {
        font-size: 16px;
    }

    .brand-subtitle {
        font-size: 8px;
    }

    .main {
        padding-top: 25px;
    }

    .logo {
        width: 125px;
        height: 125px;
    }

    .logo-core {
        width: 66px;
        height: 66px;
    }

    .greeting {
        margin-top: 27px;
    }

    .message {
        max-width: 94%;
    }
}

</style>

</head>


<body>

<div class="app">

    <div class="background">
        <div class="grid"></div>
        <div class="glow"></div>
    </div>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <button
            class="menu-button"
            onclick="toggleSidebar()"
        >
            ☰
        </button>

        <div class="brand">

            <div class="brand-title">
                J.A.R.V.I.S.
            </div>

            <div class="brand-subtitle">
                KARAHAN INC.
            </div>

        </div>


        <div class="current-user">

            <div
                id="currentUserName"
                class="current-user-name"
            >
                KARAHAN INC.
            </div>

            <div
                id="currentUserRole"
                class="current-user-role"
            >
                Ana Kullanıcı
            </div>

        </div>

    </header>


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside
        id="sidebar"
        class="sidebar"
    >

        <div class="sidebar-title">
            J.A.R.V.I.S. SYSTEM
        </div>


        <div class="profile-card">

            <div
                id="sidebarProfileName"
                class="profile-name"
            >
                KARAHAN INC.
            </div>

            <div
                id="sidebarProfileRole"
                class="profile-role"
            >
                Ana Kullanıcı
            </div>

        </div>


        <button
            class="menu-item"
            onclick="openProfileModal()"
        >

            <div class="menu-icon">
                👤
            </div>

            <div class="menu-text">

                <div class="menu-main">
                    Kullanıcı / Profil Değiştir
                </div>

                <div class="menu-sub">
                    Başka bir kullanıcıya geç
                </div>

            </div>

        </button>


        <button
            class="menu-item"
            onclick="toggleTheme()"
        >

            <div class="menu-icon">
                🌙
            </div>

            <div class="menu-text">

                <div class="menu-main">
                    Gece / Gündüz
                </div>

                <div class="menu-sub">
                    Arayüz temasını değiştir
                </div>

            </div>

        </button>


        <button
            class="menu-item"
            onclick="toggleFunMode()"
        >

            <div class="menu-icon">
                🎭
            </div>

            <div class="menu-text">

                <div class="menu-main">
                    Eğlence Modu
                </div>

                <div class="menu-sub">
                    JARVIS davranışını değiştir
                </div>

            </div>

        </button>

    </aside>


    <div
        id="overlay"
        class="overlay"
        onclick="closeSidebar()"
    ></div>


    <!-- =====================================================
         ANA İÇERİK
    ====================================================== -->

    <main class="main">


        <section class="logo-area">

            <div class="logo">

                <div class="logo-ring"></div>
                <div class="logo-ring"></div>
                <div class="logo-ring"></div>

                <div class="logo-core">
                    K
                </div>

            </div>


            <div
                id="logoStatus"
                class="logo-status"
            >
                SYSTEM ONLINE
            </div>

        </section>


        <section class="greeting">

            <h1 id="greetingTitle">
                Merhaba efendim
            </h1>

            <p id="greetingSubtitle">
                Size nasıl yardımcı olabilirim?
            </p>

        </section>


        <section class="chat">

            <div
                id="messages"
                class="messages"
            ></div>

        </section>

    </main>


    <!-- =====================================================
         INPUT
    ====================================================== -->

    <div class="input-area">

        <div class="input-box">

            <input
                id="messageInput"
                type="text"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="sentences"
                spellcheck="false"
                placeholder="JARVIS'e bir şey sorun..."
                onkeydown="handleInputKey(event)"
            >

            <button
                class="send"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

    </div>


    <!-- =====================================================
         PROFİL MODALI
    ====================================================== -->

    <div
        id="profileModal"
        class="modal"
    >

        <div class="modal-card">

            <div class="modal-title">
                Profil Değiştir
            </div>

            <div class="modal-subtitle">
                Kullanıcı adı ve şifrenizi girin.
            </div>


            <input
                id="profileUsername"
                class="modal-input"
                type="text"
                placeholder="Kullanıcı adı"
                autocomplete="off"
            >


            <input
                id="profilePassword"
                class="modal-input"
                type="password"
                placeholder="Şifre"
                autocomplete="off"
            >


            <div
                id="loginError"
                class="login-error"
            ></div>


            <div class="modal-actions">

                <button
                    class="modal-button cancel"
                    onclick="closeProfileModal()"
                >
                    Vazgeç
                </button>

                <button
                    class="modal-button"
                    onclick="loginProfile()"
                >
                    Giriş Yap
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   DURUM
========================================================= */

let currentUser = {
    username: "karahan",
    name: "KARAHAN INC.",
    role: "Ana Kullanıcı",
    personality: "professional"
};

let waitingTimer = null;


/* =========================================================
   ELEMENTLER
========================================================= */

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sidebar =
    document.getElementById("sidebar");

const overlay =
    document.getElementById("overlay");

const profileModal =
    document.getElementById("profileModal");


/* =========================================================
   LOCAL STORAGE
========================================================= */

function saveCurrentUser() {

    localStorage.setItem(
        "jarvis_current_user",
        JSON.stringify(currentUser)
    );
}


function loadCurrentUser() {

    try {

        const saved =
            localStorage.getItem(
                "jarvis_current_user"
            );

        if (!saved) {
            return;
        }

        const parsed =
            JSON.parse(saved);

        if (
            parsed &&
            parsed.username
        ) {

            currentUser = parsed;
        }

    } catch (error) {

        currentUser = {
            username: "karahan",
            name: "KARAHAN INC.",
            role: "Ana Kullanıcı",
            personality: "professional"
        };
    }
}


/* =========================================================
   TEMA
========================================================= */

function applyUserTheme() {

    document.body.classList.remove(
        "sinem-theme"
    );

    if (
        currentUser.username === "sinem"
    ) {

        document.body.classList.add(
            "sinem-theme"
        );

        document
            .getElementById("logoStatus")
            .textContent =
            "PRINCESS MODE ONLINE";

        document
            .getElementById("greetingTitle")
            .textContent =
            "Hoş geldiniz prenses";

        document
            .getElementById("greetingSubtitle")
            .textContent =
            "JARVIS sizin için hazır. ❤️";

    } else {

        document
            .getElementById("logoStatus")
            .textContent =
            "SYSTEM ONLINE";

        document
            .getElementById("greetingTitle")
            .textContent =
            "Merhaba efendim";

        document
            .getElementById("greetingSubtitle")
            .textContent =
            "Size nasıl yardımcı olabilirim?";
    }
}


/* =========================================================
   KULLANICI ARAYÜZÜ
========================================================= */

function updateUserUI() {

    document
        .getElementById("currentUserName")
        .textContent =
        currentUser.name;

    document
        .getElementById("currentUserRole")
        .textContent =
        currentUser.role;

    document
        .getElementById("sidebarProfileName")
        .textContent =
        currentUser.name;

    document
        .getElementById("sidebarProfileRole")
        .textContent =
        currentUser.role;

    applyUserTheme();
}


/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar() {

    sidebar.classList.toggle("open");
    overlay.classList.toggle("show");
}


function closeSidebar() {

    sidebar.classList.remove("open");
    overlay.classList.remove("show");
}


/* =========================================================
   PROFİL MODALI
========================================================= */

function openProfileModal() {

    closeSidebar();

    document
        .getElementById("profileUsername")
        .value = "";

    document
        .getElementById("profilePassword")
        .value = "";

    document
        .getElementById("loginError")
        .textContent = "";

    profileModal.classList.add("show");
}


function closeProfileModal() {

    profileModal.classList.remove("show");
}


async function loginProfile() {

    const username =
        document
            .getElementById("profileUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("profilePassword")
            .value;

    const error =
        document
            .getElementById("loginError");

    error.textContent = "";

    if (!username) {

        error.textContent =
            "Kullanıcı adı girin.";

        return;
    }


    try {

        const response =
            await fetch(
                "/profile-login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );


        const data =
            await response.json();


        if (!data.ok) {

            error.textContent =
                data.message ||
                "Giriş başarısız.";

            return;
        }


        currentUser = {
            username:
                data.username,

            name:
                data.name,

            role:
                data.role,

            personality:
                data.personality
        };


        saveCurrentUser();

        updateUserUI();

        clearChat();

        closeProfileModal();


        if (
            currentUser.username === "sinem"
        ) {

            addJarvisMessage(
                "Hoş geldiniz prenses. ❤️ JARVIS hazır. Bugün size nasıl yardımcı olabilirim?"
            );

        } else if (
            currentUser.username === "betul"
        ) {

            addJarvisMessage(
                "Hoş geldin Betül. Tamam kız, yine geldin. 😂"
            );

        } else {

            addJarvisMessage(
                "Tekrar hoş geldiniz efendim. JARVIS tüm sistemleri hazır durumda."
            );
        }


    } catch (error) {

        error.textContent =
            "Sunucuya bağlanılamadı.";
    }
}


/* =========================================================
   CHAT TEMİZLEME
========================================================= */

function clearChat() {

    messages.innerHTML = "";
}


/* =========================================================
   MESAJ EKLE
========================================================= */

function addMessage(
    text,
    type
) {

    const element =
        document.createElement("div");

    element.className =
        "message " + type;

    element.textContent =
        text;

    messages.appendChild(
        element
    );

    window.scrollTo(
        0,
        document.body.scrollHeight
    );
}


function addJarvisMessage(text) {

    addMessage(
        text,
        "jarvis"
    );
}


function addUserMessage(text) {

    addMessage(
        text,
        "user"
    );
}


/* =========================================================
   BEKLEME MESAJLARI
========================================================= */

const betulWaitingMessages = [

    "Aşko bir saniye, beynimi çalıştırıyorum... 🧠😂",

    "Dur kız, bunu da hemen bilmemi bekleme. 😂",

    "Bir dakika aşko, işlemcim dedikodu modundan çıkıyor...",

    "Tamam tamam, düşünüyorum kız. Sabırsızlanma. 😂",

    "Aşko bekle, J.A.R.V.I.S. şu an beyninin son kalan hücresini kullanıyor...",

    "Bir saniye canım, NASA'ya bağlanıp geliyorum. 😂",

    "Dur kız, her şeyi ben mi bileceğim? 😭",

    "Aşko bu soruyu beklemiyordum. Bir toparlanayım. 😂",

    "Düşünüyorum kız, üstüme gelme. 😂",

    "Tamam aşko, beynimin fanları şu an son hız dönüyor..."
];


const sinemWaitingMessages = [

    "Bir saniye prenses, sizin için düşünüyorum. ❤️",

    "Prenses bir dakika, JARVIS en güzel cevabı hazırlıyor. 🌸",

    "Hemen bakıyorum prenses. Biraz düşünmeme izin verin. ❤️",

    "Bir saniye Sinem, bunu öylesine cevaplayamam. 😌",

    "Prenses, işlem yapılıyor. Sabır lütfen. 🌸",

    "Durun prenses, JARVIS çalışıyor. ❤️",

    "Biraz bekleyin prenses, size düzgün bir cevap hazırlıyorum."
];


function startWaitingMessage() {

    stopWaitingMessage();

    if (
        currentUser.username !== "betul" &&
        currentUser.username !== "sinem"
    ) {

        return;
    }


    const message =
        document.createElement("div");

    message.className =
        "message jarvis";

    messages.appendChild(
        message
    );


    const list =
        currentUser.username === "sinem"
            ? sinemWaitingMessages
            : betulWaitingMessages;


    let index =
        Math.floor(
            Math.random() * list.length
        );


    message.textContent =
        list[index];


    waitingTimer =
        setInterval(
            () => {

                index =
                    (index + 1)
                    % list.length;

                message.textContent =
                    list[index];

            },
            2600
        );


    message.dataset.waiting =
        "true";
}


function stopWaitingMessage() {

    if (waitingTimer) {

        clearInterval(
            waitingTimer
        );

        waitingTimer = null;
    }


    const waitingMessages =
        messages.querySelectorAll(
            '[data-waiting="true"]'
        );

    waitingMessages.forEach(
        element => element.remove()
    );
}


/* =========================================================
   CHAT GÖNDER
========================================================= */

async function sendMessage() {

    const message =
        messageInput.value.trim();


    if (!message) {
        return;
    }


    addUserMessage(
        message
    );


    messageInput.value = "";


    startWaitingMessage();


    try {

        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message,

                        username:
                            currentUser.username
                    })
                }
            );


        const data =
            await response.json();


        stopWaitingMessage();


        if (!response.ok) {

            addJarvisMessage(
                "Şu anda yapay zeka servislerine erişemiyorum. Lütfen biraz sonra tekrar deneyin."
            );

            return;
        }


        addJarvisMessage(
            data.answer
        );


    } catch (error) {

        stopWaitingMessage();

        addJarvisMessage(
            "Bağlantıda bir sorun oluştu. Sunucuyu kontrol edelim efendim."
        );
    }
}


/* =========================================================
   ENTER
========================================================= */

function handleInputKey(event) {

    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        sendMessage();
    }
}


/* =========================================================
   TEMA DEĞİŞTİR
========================================================= */

function toggleTheme() {

    document.body.classList.toggle(
        "day-mode"
    );
}


/* =========================================================
   EĞLENCE MODU
========================================================= */

function toggleFunMode() {

    document.body.classList.toggle(
        "fun-mode"
    );


    if (
        currentUser.username === "karahan"
    ) {

        addJarvisMessage(
            "Eğlence modu görsel olarak etkinleştirildi efendim. Karakterimi değiştirmiyorum; profesyonel JARVIS olarak kalıyorum."
        );

        return;
    }


    if (
        currentUser.username === "sinem"
    ) {

        addJarvisMessage(
            "Prenses modu biraz daha eğlenceli hale getirildi. 🌸😄"
        );

        return;
    }


    if (
        currentUser.username === "betul"
    ) {

        addJarvisMessage(
            "Tamam kız, şimdi başımıza iş açılacak. 😂"
        );
    }
}


/* =========================================================
   BAŞLANGIÇ
========================================================= */

function initialize() {

    loadCurrentUser();

    /*
     * Güvenlik amacıyla localStorage'dan gelen
     * kullanıcı bilgisini sadece bilinen profillerle sınırla.
     */

    if (
        ![
            "karahan",
            "betul",
            "sinem"
        ].includes(
            currentUser.username
        )
    ) {

        currentUser = {
            username: "karahan",
            name: "KARAHAN INC.",
            role: "Ana Kullanıcı",
            personality: "professional"
        };
    }


    updateUserUI();


    /*
     * İlk açılışta profil seçme ekranı YOK.
     * Sistem doğrudan ana kullanıcı ile açılır.
     */

    if (
        currentUser.username === "sinem"
    ) {

        addJarvisMessage(
            "Tekrar hoş geldiniz prenses. ❤️ JARVIS burada."
        );

    } else if (
        currentUser.username === "betul"
    ) {

        addJarvisMessage(
            "Hoş geldin Betül. 😂"
        );

    } else {

        addJarvisMessage(
            "Merhaba efendim. JARVIS sistemleri hazır."
        );
    }
}


initialize();

</script>
