<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#02070a">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="K.A.R.V.I.S.">

<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" type="image/png" href="/icon.png">

<title>K.A.R.V.I.S. - KARAHAN INC.</title>

<style>

/* =========================================================
   TEMEL
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #02070a;
    color: #eaffff;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    overflow: hidden;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}


/* =========================================================
   ANA UYGULAMA
========================================================= */

.app {
    width: 100%;
    height: 100vh;
    height: 100dvh;

    display: flex;
    flex-direction: column;

    background:
        radial-gradient(
            circle at 50% 18%,
            rgba(0, 255, 255, 0.10),
            transparent 27%
        ),
        radial-gradient(
            circle at 50% 65%,
            rgba(0, 170, 190, 0.045),
            transparent 40%
        ),
        linear-gradient(
            180deg,
            #02070a 0%,
            #02080b 45%,
            #010506 100%
        );
}


/* =========================================================
   HEADER
========================================================= */

.header {
    height: 72px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background:
        linear-gradient(
            180deg,
            rgba(2, 9, 12, 0.98),
            rgba(2, 7, 9, 0.92)
        );

    border-bottom:
        1px solid rgba(0, 255, 255, 0.16);

    box-shadow:
        0 5px 25px rgba(0, 0, 0, 0.25);

    z-index: 10;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-mini {
    width: 43px;
    height: 43px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border: 1px solid rgba(0, 255, 255, 0.9);

    color: #00ffff;

    font-size: 18px;
    font-weight: 900;

    text-shadow:
        0 0 8px rgba(0,255,255,.8);

    box-shadow:
        0 0 12px rgba(0,255,255,.35),
        0 0 30px rgba(0,255,255,.08),
        inset 0 0 16px rgba(0,255,255,.12);

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.10),
            rgba(0,0,0,.05)
        );
}

.brand-title {
    font-size: 16px;
    font-weight: 850;
    letter-spacing: 3px;

    text-shadow:
        0 0 10px rgba(0,255,255,.12);
}

.brand-subtitle {
    margin-top: 3px;

    font-size: 8px;
    letter-spacing: 4px;

    color: #64898d;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.status {
    position: relative;

    font-size: 9px;
    letter-spacing: 2px;

    color: #58ffb5;

    text-shadow:
        0 0 8px rgba(88,255,181,.4);
}

.status::before {
    content: "";

    display: inline-block;

    width: 6px;
    height: 6px;

    margin-right: 5px;

    border-radius: 50%;

    background: #58ffb5;

    box-shadow:
        0 0 8px #58ffb5;
}

.menu-button {
    width: 43px;
    height: 43px;

    border:
        1px solid rgba(0,255,255,.25);

    border-radius: 13px;

    background:
        rgba(0,255,255,.035);

    color: #00ffff;

    font-size: 20px;

    box-shadow:
        inset 0 0 12px rgba(0,255,255,.035);

    transition: .2s;
}

.menu-button:active {
    transform: scale(.94);
    background: rgba(0,255,255,.09);
}


/* =========================================================
   ANA ALAN
========================================================= */

.main {
    position: relative;

    flex: 1;

    overflow: hidden;

    background: transparent;
}

.hero {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding-top: 48px;
    padding-bottom: 145px;

    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: none;
}

.hero::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   HUD K.A.R.V.I.S. CORE
========================================================= */

.jarvis-orb {
    position: relative;

    width: 205px;
    height: 205px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 25px;

    filter:
        drop-shadow(
            0 0 18px rgba(0,255,255,.12)
        );
}

.jarvis-orb::before {
    content: "";

    position: absolute;

    width: 204px;
    height: 204px;

    border-radius: 50%;

    border:
        1px solid rgba(0,255,255,.11);

    box-shadow:
        0 0 45px rgba(0,255,255,.06),
        inset 0 0 35px rgba(0,255,255,.04);
}

.jarvis-orb::after {
    content: "";

    position: absolute;

    width: 218px;
    height: 218px;

    border-radius: 50%;

    border:
        1px dashed rgba(0,255,255,.09);

    animation:
        spin 28s linear infinite;
}

.ring {
    position: absolute;

    border-radius: 50%;

    border:
        1px solid rgba(0,255,255,.45);
}

.ring.one {
    width: 190px;
    height: 190px;

    border-top-color: rgba(0,255,255,.9);
    border-bottom-color: rgba(0,255,255,.18);

    box-shadow:
        0 0 12px rgba(0,255,255,.12);

    animation:
        spin 15s linear infinite;
}

.ring.two {
    width: 160px;
    height: 160px;

    border-style: dashed;

    border-color:
        rgba(0,255,255,.34);

    animation:
        spinReverse 11s linear infinite;
}

.ring.three {
    width: 126px;
    height: 126px;

    border-color:
        rgba(0,255,255,.6);

    box-shadow:
        0 0 25px rgba(0,255,255,.22),
        0 0 50px rgba(0,255,255,.05),
        inset 0 0 25px rgba(0,255,255,.12);
}

.core {
    position: relative;

    width: 76px;
    height: 76px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
        2px solid #00ffff;

    color: #00ffff;

    font-size: 29px;
    font-weight: 950;

    text-shadow:
        0 0 12px rgba(0,255,255,.95);

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.12),
            rgba(0,20,23,.65) 65%,
            rgba(0,0,0,.4)
        );

    box-shadow:
        0 0 18px rgba(0,255,255,.5),
        0 0 45px rgba(0,255,255,.16),
        inset 0 0 25px rgba(0,255,255,.14);

    animation:
        pulse 2.5s infinite;
}

.core::before {
    content: "";

    position: absolute;

    width: 88px;
    height: 88px;

    border-radius: 50%;

    border:
        1px solid rgba(0,255,255,.15);
}

.core::after {
    content: "";

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #00ffff;

    box-shadow:
        0 0 12px #00ffff,
        0 0 25px #00ffff;
}


/* =========================================================
   BAŞLIK
========================================================= */

.hero-title {
    font-size: 27px;

    font-weight: 850;

    letter-spacing: 6px;

    margin-bottom: 6px;

    color: #eaffff;

    text-shadow:
        0 0 12px rgba(0,255,255,.14);
}

.hero-subtitle {
    font-size: 8px;

    letter-spacing: 5px;

    color: #668d91;
}


/* =========================================================
   AKTİF MOD GÖSTERGESİ
========================================================= */

.active-mode {
    display: none;

    margin-top: 12px;

    padding: 7px 13px;

    border:
        1px solid rgba(0,255,255,.18);

    border-radius: 20px;

    background:
        rgba(0,255,255,.035);

    color: #78ffff;

    font-size: 9px;

    letter-spacing: 1.5px;

    box-shadow:
        0 0 18px rgba(0,255,255,.045);
}

.active-mode.show {
    display: block;
}


/* =========================================================
   CHAT
========================================================= */

.chat {
    width: min(720px, 92%);

    margin-top: 27px;

    display: flex;
    flex-direction: column;

    gap: 12px;
}

.message {
    padding: 14px 16px;

    border-radius: 15px;

    max-width: 92%;

    line-height: 1.58;

    font-size: 14px;

    white-space: pre-wrap;

    backdrop-filter: blur(8px);
}

.message.jarvis {
    align-self: flex-start;

    border:
        1px solid rgba(0,255,255,.15);

    background:
        linear-gradient(
            135deg,
            rgba(0,255,255,.055),
            rgba(0,20,23,.38)
        );

    color: #d9ffff;

    box-shadow:
        0 5px 20px rgba(0,0,0,.16);
}

.message.user {
    align-self: flex-end;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(255,255,255,.10);

    color: white;
}


/* =========================================================
   ARAŞTIRMA SONUÇLARI
========================================================= */

.research-card {
    width: min(720px, 92%);

    margin-top: 12px;

    padding: 14px;

    border:
        1px solid rgba(0,255,255,.14);

    border-radius: 14px;

    background:
        rgba(0,255,255,.025);

    color: #9ddfe3;

    font-size: 11px;

    line-height: 1.6;
}

.research-card strong {
    color: #00ffff;
}


/* =========================================================
   INPUT
========================================================= */

.input-area {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 12px;

    background:
        linear-gradient(
            to top,
            rgba(2,7,10,1) 55%,
            rgba(2,7,10,.85) 72%,
            transparent 100%
        );

    z-index: 5;
}

.input-box {
    width: min(720px, 100%);

    margin: auto;

    display: flex;

    gap: 8px;

    padding: 8px;

    border:
        1px solid rgba(0,255,255,.25);

    border-radius: 18px;

    background:
        rgba(3,13,16,.94);

    box-shadow:
        0 0 25px rgba(0,255,255,.055),
        inset 0 0 15px rgba(0,255,255,.025);

    backdrop-filter: blur(15px);
}

.input-box input {
    flex: 1;

    min-width: 0;

    border: none;
    outline: none;

    background: transparent;

    color: white;

    padding: 12px;

    font-size: 16px;
}

.input-box input::placeholder {
    color: #5c7d81;
}

.send-button {
    width: 48px;
    height: 48px;

    flex-shrink: 0;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #00ffff,
            #00caca
        );

    color: #001010;

    font-weight: 900;

    box-shadow:
        0 0 15px rgba(0,255,255,.25);

    transition: .2s;
}

.send-button:active {
    transform: scale(.94);
}

.send-button:disabled {
    opacity: .35;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    position: fixed;

    top: 0;
    left: -295px;

    width: 285px;
    height: 100vh;

    padding: 22px;

    background:
        linear-gradient(
            180deg,
            #030b0e,
            #02080a
        );

    border-right:
        1px solid rgba(0,255,255,.20);

    box-shadow:
        15px 0 40px rgba(0,0,0,.35);

    z-index: 100;

    transition:
        left .25s ease;

    overflow-y: auto;
}

.sidebar.open {
    left: 0;
}

.sidebar-title {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 25px;
}

.sidebar-title strong {
    letter-spacing: 3px;

    color: #eaffff;
}

.close-sidebar {
    border: none;

    background: transparent;

    color: #00ffff;

    font-size: 24px;
}

.sidebar-profile {
    display: none;

    margin-top: -10px;
    margin-bottom: 17px;

    padding: 10px 12px;

    border:
        1px solid rgba(0,255,255,.12);

    border-radius: 10px;

    background:
        rgba(0,255,255,.025);

    color: #7fa9ad;

    font-size: 10px;

    letter-spacing: 1px;
}

.sidebar-profile.show {
    display: block;
}

.sidebar-profile strong {
    display: block;

    color: #00ffff;

    font-size: 12px;

    margin-bottom: 3px;
}

.menu-section-title {
    display: none;

    margin: 18px 4px 9px;

    color: #4f858a;

    font-size: 8px;

    letter-spacing: 2px;
}

.menu-section-title.show {
    display: block;
}

.menu-item {
    width: 100%;

    padding: 14px;

    margin-bottom: 9px;

    text-align: left;

    border:
        1px solid rgba(0,255,255,.11);

    border-radius: 12px;

    background:
        rgba(0,255,255,.025);

    color: #d9ffff;

    font-size: 13px;

    transition: .2s;
}

.menu-item:active,
.menu-item:hover {
    border-color:
        rgba(0,255,255,.38);

    background:
        rgba(0,255,255,.055);
}

.academic-menu {
    display: none;
}

.academic-menu.show {
    display: block;
}

.academic-menu .menu-item {
    border-color:
        rgba(0,220,255,.16);
}

.academic-menu .menu-item.active {
    border-color:
        rgba(0,255,255,.60);

    background:
        rgba(0,255,255,.08);

    box-shadow:
        inset 0 0 15px rgba(0,255,255,.035),
        0 0 15px rgba(0,255,255,.035);
}


/* =========================================================
   MODAL
========================================================= */

.modal {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 18px;

    background:
        rgba(0,0,0,.76);

    backdrop-filter: blur(7px);

    z-index: 200;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(600px, 100%);

    max-height: 85vh;

    overflow-y: auto;

    padding: 20px;

    border:
        1px solid rgba(0,255,255,.22);

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            #061417,
            #02090b
        );

    box-shadow:
        0 0 40px rgba(0,255,255,.07);
}

.modal-title {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 18px;
}

.modal-title h2 {
    margin: 0;

    font-size: 17px;

    letter-spacing: 2px;
}

.modal-close {
    border: none;

    background: transparent;

    color: #00ffff;

    font-size: 23px;
}

.modal input {
    width: 100%;

    padding: 13px;

    margin-bottom: 10px;

    border:
        1px solid rgba(0,255,255,.18);

    border-radius: 10px;

    background:
        #020708;

    color: white;

    outline: none;
}

.modal-action {
    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #00ffff,
            #00caca
        );

    color: #001010;

    font-weight: 800;
}


/* =========================================================
   HATALAR
========================================================= */

.error-card {
    padding: 13px;

    margin-bottom: 10px;

    border-radius: 12px;

    background:
        rgba(255,70,70,.045);

    border:
        1px solid rgba(255,80,80,.17);
}

.error-top {
    display: flex;

    justify-content: space-between;

    gap: 8px;

    font-size: 10px;

    margin-bottom: 7px;
}

.error-provider {
    color: #ff7373;
    font-weight: 800;
}

.error-type {
    color: #ffbd6b;
}

.error-time {
    color: #668487;
}

.error-message {
    color: #d7eeee;

    font-size: 12px;

    margin-bottom: 7px;
}

.error-detail {
    color: #80999b;

    font-size: 10px;

    word-break: break-word;
}

.clear-errors {
    width: 100%;

    padding: 12px;

    margin-top: 8px;

    border:
        1px solid rgba(255,70,70,.3);

    border-radius: 10px;

    background:
        rgba(255,70,70,.06);

    color:
        #ff8a8a;
}


/* =========================================================
   SINEM
========================================================= */

body.sinem-mode .core,
body.sinem-mode .ring {
    border-color: #ff6fae;
}

body.sinem-mode .core {
    color: #ff6fae;

    box-shadow:
        0 0 30px rgba(255,105,170,.45),
        0 0 55px rgba(255,105,170,.12);
}

body.sinem-mode .ring {
    border-color:
        rgba(255,105,170,.5);
}

body.sinem-mode .send-button {
    background:
        linear-gradient(
            135deg,
            #ff83bd,
            #ff5da4
        );
}


/* =========================================================
   ÖĞRETMEN MODU
========================================================= */

body.teacher-mode .core,
body.teacher-mode .ring {
    border-color: #36dfff;
}

body.teacher-mode .core {
    color: #36dfff;

    box-shadow:
        0 0 28px rgba(54,223,255,.42),
        0 0 55px rgba(54,223,255,.10);
}

body.teacher-mode .hero-title {
    text-shadow:
        0 0 16px rgba(54,223,255,.20);
}

body.teacher-mode .sidebar {
    border-right-color:
        rgba(54,223,255,.25);
}


/* =========================================================
   EĞLENCE MODU
========================================================= */

body.fun-mode .core,
body.fun-mode .ring {
    border-color: #ff3030;
}

body.fun-mode .core {
    color: #ff3030;

    text-shadow:
        0 0 12px rgba(255,40,40,.9);

    box-shadow:
        0 0 30px rgba(255,40,40,.5),
        0 0 55px rgba(255,40,40,.12);
}

body.fun-mode .ring {
    border-color:
        rgba(255,40,40,.55);
}


/* =========================================================
   ANIMASYONLAR
========================================================= */

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes spinReverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes pulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.055);
    }
}

</style>

</head>


<body>

<div class="app">

<header class="header">

<div class="brand">

<div class="logo-mini">
K
</div>

<div>

<div class="brand-title">
K.A.R.V.I.S.
</div>

<div class="brand-subtitle">
KARAHAN INC.
</div>

</div>

</div>


<div class="header-right">

<div
    class="status"
    id="statusText"
>
ONLINE
</div>

<button
    class="menu-button"
    onclick="openSidebar()"
>
☰
</button>

</div>

</header>


<main class="main">

<section class="hero">

<div class="jarvis-orb">

<div class="ring one"></div>
<div class="ring two"></div>
<div class="ring three"></div>

<div class="core">
K
</div>

</div>


<div class="hero-title">
K.A.R.V.I.S.
</div>

<div class="hero-subtitle">
KARAHAN INTELLIGENT SYSTEM
</div>


<div
    class="active-mode"
    id="activeMode"
>
</div>


<div
    class="chat"
    id="chat"
>
</div>

</section>


<div class="input-area">

<div class="input-box">

<input
    id="messageInput"
    type="text"
    placeholder="K.A.R.V.I.S.'e bir şey sorun..."
    autocomplete="off"
>

<button
    class="send-button"
    id="sendButton"
    onclick="sendMessage()"
>
➤
</button>

</div>

</div>

</main>

</div>


<!-- =====================================================
     SIDEBAR
====================================================== -->

<div
    class="sidebar"
    id="sidebar"
>

<div class="sidebar-title">

<strong>
K.A.R.V.I.S.
</strong>

<button
    class="close-sidebar"
    onclick="closeSidebar()"
>
×
</button>

</div>


<div
    class="sidebar-profile"
    id="sidebarProfile"
>
<strong id="sidebarProfileName"></strong>
<span id="sidebarProfileRole"></span>
</div>


<!-- NORMAL MENÜ -->

<div id="normalMenu">

<button
    class="menu-item"
    onclick="newChat()"
>
＋ Yeni Sohbet
</button>


<button
    class="menu-item"
    onclick="openErrors()"
>
⚠ Hatalar
</button>


<button
    class="menu-item"
    onclick="openProfile()"
>
◉ Profil Değiştir
</button>


<button
    class="menu-item"
    onclick="toggleFunMode()"
>
◈ Eğlence Modu
</button>

</div>


<!-- ÖĞRETMEN MENÜSÜ -->

<div
    class="menu-section-title"
    id="academicTitle"
>
AKADEMİK ASİSTAN
</div>


<div
    class="academic-menu"
    id="academicMenu"
>

<button
    class="menu-item"
    data-mode="research"
    onclick="selectAcademicMode('research')"
>
🔬 Araştırma Modu
</button>


<button
    class="menu-item"
    data-mode="academic"
    onclick="selectAcademicMode('academic')"
>
📚 Akademik Mod
</button>


<button
    class="menu-item"
    data-mode="article"
    onclick="selectAcademicMode('article')"
>
📝 Makale Asistanı
</button>


<button
    class="menu-item"
    data-mode="lesson"
    onclick="selectAcademicMode('lesson')"
>
🎓 Ders Asistanı
</button>


<button
    class="menu-item"
    data-mode="quiz"
    onclick="selectAcademicMode('quiz')"
>
🧪 Sınav / Quiz
</button>


<button
    class="menu-item"
    onclick="newChat()"
>
＋ Yeni Sohbet
</button>


<button
    class="menu-item"
    onclick="openProfile()"
>
◉ Profil Değiştir
</button>


<button
    class="menu-item"
    onclick="openErrors()"
>
⚠ Hatalar
</button>

</div>

</div>


<!-- =====================================================
     ERROR MODAL
====================================================== -->

<div
    class="modal"
    id="errorModal"
>

<div class="modal-box">

<div class="modal-title">

<h2>
HATA KAYITLARI
</h2>

<button
    class="modal-close"
    onclick="closeErrors()"
>
×
</button>

</div>

<div id="errorList">
Yükleniyor...
</div>

<button
    class="clear-errors"
    onclick="clearErrors()"
>
Tüm Hataları Temizle
</button>

</div>

</div>


<!-- =====================================================
     PROFILE MODAL
====================================================== -->

<div
    class="modal"
    id="profileModal"
>

<div class="modal-box">

<div class="modal-title">

<h2>
PROFİL DEĞİŞTİR
</h2>

<button
    class="modal-close"
    onclick="closeProfile()"
>
×
</button>

</div>


<input
    id="profileUsername"
    placeholder="Kullanıcı adı"
>

<input
    id="profilePassword"
    type="password"
    placeholder="Şifre"
>

<button
    class="modal-action"
    onclick="loginProfile()"
>
Giriş Yap
</button>


<div
    id="profileError"
    style="
        margin-top:12px;
        color:#ff7373;
        font-size:12px;
    "
>
</div>

</div>

</div>


<script>

const API = "";

let currentUser = "karahan";

let currentMode = "normal";

let funMode = false;

let sending = false;


/* =========================================================
   SIDEBAR
========================================================= */

function openSidebar() {

    document
        .getElementById("sidebar")
        .classList
        .add("open");
}


function closeSidebar() {

    document
        .getElementById("sidebar")
        .classList
        .remove("open");
}


/* =========================================================
   MESAJ
========================================================= */

function addMessage(text, type) {

    const chat =
        document.getElementById("chat");

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.textContent =
        text;

    chat.appendChild(div);

    const hero =
        document.querySelector(".hero");

    hero.scrollTop =
        hero.scrollHeight;
}


/* =========================================================
   MOD GÖSTERGESİ
========================================================= */

function updateModeIndicator() {

    const indicator =
        document.getElementById("activeMode");


    const names = {

        research:
            "🔬 ARAŞTIRMA MODU",

        academic:
            "📚 AKADEMİK MOD",

        article:
            "📝 MAKALE ASİSTANI",

        lesson:
            "🎓 DERS ASİSTANI",

        quiz:
            "🧪 SINAV / QUIZ"

    };


    if (
        currentUser === "ilknur" &&
        names[currentMode]
    ) {

        indicator.textContent =
            names[currentMode];

        indicator.classList.add("show");

    } else {

        indicator.classList.remove("show");
    }
}


/* =========================================================
   AKADEMİK MOD SEÇ
========================================================= */

function selectAcademicMode(mode) {

    if (currentUser !== "ilknur") {
        return;
    }


    currentMode = mode;


    document
        .querySelectorAll(
            ".academic-menu .menu-item[data-mode]"
        )
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.mode === mode
            );

        });


    updateModeIndicator();

    closeSidebar();


    const modeMessages = {

        research:
            "🔬 Araştırma Modu aktif. Güncel internet kaynaklarını kullanarak araştırma yapabilirim.",

        academic:
            "📚 Akademik Mod aktif. Akademik analiz, kavram, literatür ve araştırma konularında hazırım.",

        article:
            "📝 Makale Asistanı aktif. Makale hazırlama ve akademik metin çalışmalarında hazırım.",

        lesson:
            "🎓 Ders Asistanı aktif. Ders planı, konu anlatımı ve eğitim materyalleri hazırlayabilirim.",

        quiz:
            "🧪 Sınav / Quiz modu aktif. Soru, test ve cevap anahtarı hazırlayabilirim."

    };


    addMessage(
        modeMessages[mode],
        "jarvis"
    );
}


/* =========================================================
   MESAJ GONDER
========================================================= */

async function sendMessage() {

    if (sending) {
        return;
    }


    const input =
        document.getElementById("messageInput");

    const button =
        document.getElementById("sendButton");


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    sending = true;

    button.disabled = true;

    input.value = "";


    addMessage(
        message,
        "user"
    );


    let waitingMessages = [

        "Bir saniye efendim...",

        "Tamam, bir bakıyorum...",

        "Dur, bunu birlikte çözelim...",

        "Bir dakika, düşünüyorum...",

        "Tamam, hemen ilgileniyorum..."

    ];


    if (currentUser === "betul") {

        waitingMessages = [

            "Aşko bir saniye, beynimi çalıştırıyorum... 🧠😂",

            "Dur kız, düşünüyorum. 😂",

            "Tamam tamam, bakıyorum.",

            "Bir dakika aşko, işlemciyi çalıştırıyorum..."

        ];
    }


    if (currentUser === "sinem") {

        waitingMessages = [

            "Bir saniye prenses, hemen bakıyorum... 💗",

            "Tamam prenses, düşünüyorum...",

            "Bir dakika, hemen ilgileniyorum. 💗"

        ];
    }


    if (currentUser === "ilknur") {

        waitingMessages = [

            "Elbette Hocam, hemen araştırıyorum...",

            "Tabii Hocam, konuyu inceliyorum...",

            "Hocam, bilgileri değerlendiriyorum...",

            "Bir dakika Hocam, kaynakları kontrol ediyorum..."

        ];
    }


    const waiting =
        document.createElement("div");


    waiting.className =
        "message jarvis";


    waiting.textContent =
        waitingMessages[
            Math.floor(
                Math.random() *
                waitingMessages.length
            )
        ];


    document
        .getElementById("chat")
        .appendChild(waiting);


    try {

        const response =
            await fetch(
                API + "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message: message,

                        username: currentUser,

                        mode:
                            currentUser === "ilknur"
                                ? currentMode
                                : "normal"

                    })
                }
            );


        const data =
            await response.json();


        waiting.remove();


        if (!response.ok) {

            let errorText =
                "Bilinmeyen hata.";

            let errorType =
                "";


            if (
                data &&
                data.detail
            ) {

                if (
                    typeof data.detail === "string"
                ) {

                    errorText =
                        data.detail;

                } else {

                    errorText =
                        data.detail.error ||
                        data.detail.message ||
                        errorText;

                    errorType =
                        data.detail.type ||
                        "";
                }
            }


            addMessage(

                "⚠️ K.A.R.V.I.S. HATA\n\n" +

                errorText +

                (
                    errorType
                        ? "\n\nHata tipi: " +
                          errorType
                        : ""
                ) +

                "\n\nHata kaydı Hatalar bölümüne kaydedildi.",

                "jarvis"
            );

            return;
        }


        addMessage(
            data.answer,
            "jarvis"
        );


        document
            .getElementById("statusText")
            .textContent =
            "ONLINE";


    } catch (error) {

        waiting.remove();


        addMessage(

            "⚠️ K.A.R.V.I.S.\n\n" +

            "Sunucuya bağlanırken bir sorun oluştu.\n\n" +

            error.message,

            "jarvis"
        );


    } finally {

        sending = false;

        button.disabled = false;

        input.focus();
    }
}


/* =========================================================
   ENTER
========================================================= */

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );


/* =========================================================
   YENI SOHBET
========================================================= */

async function newChat() {

    closeSidebar();


    try {

        await fetch(

            API +
            "/new-chat?username=" +
            encodeURIComponent(currentUser),

            {
                method: "POST"
            }

        );

    } catch (error) {
    }


    document
        .getElementById("chat")
        .innerHTML = "";


    showGreeting();
}


/* =========================================================
   GREETING
========================================================= */

function showGreeting() {

    const chat =
        document.getElementById("chat");


    if (chat.children.length > 0) {
        return;
    }


    let greeting =
        "Merhaba efendim. K.A.R.V.I.S. hazır.";


    if (currentUser === "betul") {

        greeting =
            "Merhaba Betül. 😏 K.A.R.V.I.S. hazır.";
    }


    if (currentUser === "sinem") {

        greeting =
            "Hoş geldiniz prenses. 💗 K.A.R.V.I.S. hazır.";
    }


    if (currentUser === "ilknur") {

        greeting =
            "Merhaba Hocam. K.A.R.V.I.S. akademik asistanınız olarak hazır.";
    }


    addMessage(
        greeting,
        "jarvis"
    );
}


/* =========================================================
   HATALAR
========================================================= */

async function openErrors() {

    closeSidebar();


    document
        .getElementById("errorModal")
        .classList
        .add("show");


    await loadErrors();
}


function closeErrors() {

    document
        .getElementById("errorModal")
        .classList
        .remove("show");
}


async function loadErrors() {

    const list =
        document.getElementById("errorList");


    list.innerHTML =
        "Yükleniyor...";


    try {

        const response =
            await fetch(
                API + "/errors"
            );


        const data =
            await response.json();


        const errors =
            data.errors || [];


        if (errors.length === 0) {

            list.innerHTML =
                "<div style='color:#6d8b8e;font-size:13px;'>Henüz hata kaydı yok.</div>";

            return;
        }


        list.innerHTML = "";


        [...errors]
            .reverse()
            .forEach(error => {

                const card =
                    document.createElement("div");


                card.className =
                    "error-card";


                card.innerHTML = `

                    <div class="error-top">

                        <span class="error-provider">
                            ${escapeHtml(error.provider)}
                        </span>

                        <span class="error-type">
                            ${escapeHtml(error.type)}
                        </span>

                        <span class="error-time">
                            ${escapeHtml(error.time)}
                        </span>

                    </div>

                    <div class="error-message">
                        ${escapeHtml(error.message || "")}
                    </div>

                    <div class="error-detail">
                        ${escapeHtml(error.error || "")}
                    </div>

                `;


                list.appendChild(card);

            });


    } catch (error) {

        list.innerHTML =
            "Hatalar yüklenemedi.";
    }
}


async function clearErrors() {

    if (
        !confirm(
            "Tüm hata kayıtları silinsin mi?"
        )
    ) {

        return;
    }


    try {

        await fetch(

            API + "/errors",

            {
                method: "DELETE"
            }

        );


        await loadErrors();


    } catch (error) {

        alert(
            "Hatalar temizlenemedi."
        );
    }
}


/* =========================================================
   PROFIL
========================================================= */

function openProfile() {

    closeSidebar();


    document
        .getElementById("profileModal")
        .classList
        .add("show");
}


function closeProfile() {

    document
        .getElementById("profileModal")
        .classList
        .remove("show");
}


async function loginProfile() {

    const usernameInput =
        document.getElementById(
            "profileUsername"
        );


    const passwordInput =
        document.getElementById(
            "profilePassword"
        );


    const errorBox =
        document.getElementById(
            "profileError"
        );


    let username =
        usernameInput.value
            .trim()
            .toLowerCase();


    if (username === "betül") {
        username = "betul";
    }


    const password =
        passwordInput.value;


    errorBox.textContent = "";


    try {

        const response =
            await fetch(

                API +
                "/profile-login",

                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        username:
                            username,

                        password:
                            password

                    })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            errorBox.textContent =
                data.detail ||
                "Giriş başarısız.";

            return;
        }


        currentUser =
            data.username;


        localStorage.setItem(
            "karvis_user",
            currentUser
        );


        if (currentUser === "ilknur") {

            currentMode =
                "research";

        } else {

            currentMode =
                "normal";
        }


        applyUserTheme();

        updateSidebar();

        updateModeIndicator();


        document
            .getElementById("chat")
            .innerHTML = "";


        closeProfile();


        showGreeting();


    } catch (error) {

        errorBox.textContent =
            "Sunucu bağlantı hatası.";
    }
}


/* =========================================================
   TEMA
========================================================= */

function applyUserTheme() {

    document.body
        .classList
        .remove(
            "sinem-mode",
            "teacher-mode"
        );


    if (currentUser === "sinem") {

        document.body
            .classList
            .add("sinem-mode");
    }


    if (currentUser === "ilknur") {

        document.body
            .classList
            .add("teacher-mode");
    }
}


/* =========================================================
   SIDEBAR KULLANICI GÖRÜNÜMÜ
========================================================= */

function updateSidebar() {

    const normalMenu =
        document.getElementById(
            "normalMenu"
        );


    const academicMenu =
        document.getElementById(
            "academicMenu"
        );


    const academicTitle =
        document.getElementById(
            "academicTitle"
        );


    const profile =
        document.getElementById(
            "sidebarProfile"
        );


    const profileName =
        document.getElementById(
            "sidebarProfileName"
        );


    const profileRole =
        document.getElementById(
            "sidebarProfileRole"
        );


    if (currentUser === "ilknur") {

        normalMenu.style.display =
            "none";


        academicMenu.classList.add(
            "show"
        );


        academicTitle.classList.add(
            "show"
        );


        profile.classList.add(
            "show"
        );


        profileName.textContent =
            "İlknur Hocam";


        profileRole.textContent =
            "Öğretmen / Akademik Kullanıcı";


    } else {

        normalMenu.style.display =
            "block";


        academicMenu.classList.remove(
            "show"
        );


        academicTitle.classList.remove(
            "show"
        );


        profile.classList.remove(
            "show"
        );
    }


    document
        .querySelectorAll(
            ".academic-menu .menu-item[data-mode]"
        )
        .forEach(button => {

            button.classList.toggle(

                "active",

                currentUser === "ilknur" &&
                button.dataset.mode === currentMode

            );

        });
}


/* =========================================================
   EGLENCE
========================================================= */

function toggleFunMode() {

    closeSidebar();


    funMode =
        !funMode;


    document.body
        .classList
        .toggle(
            "fun-mode",
            funMode
        );


    if (funMode) {

        addMessage(

            "Eğlence modu aktif. K.A.R.V.I.S. biraz daha rahat takılabilir. 😈",

            "jarvis"
        );


    } else {

        addMessage(

            "Eğlence modu kapatıldı. Standart K.A.R.V.I.S. sistemine dönüldü.",

            "jarvis"
        );
    }
}


/* =========================================================
   GUVENLIK
========================================================= */

function escapeHtml(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   BASLANGIC
========================================================= */

function initialize() {

    const savedUser =
        localStorage.getItem(
            "karvis_user"
        );


    if (

        savedUser &&

        (

            savedUser === "karahan" ||

            savedUser === "betul" ||

            savedUser === "sinem" ||

            savedUser === "ilknur"

        )

    ) {

        currentUser =
            savedUser;
    }


    if (currentUser === "ilknur") {

        currentMode =
            "research";

    } else {

        currentMode =
            "normal";
    }


    applyUserTheme();

    updateSidebar();

    updateModeIndicator();

    showGreeting();
}


initialize();

</script>

</body>
</html>
