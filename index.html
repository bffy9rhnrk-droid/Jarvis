<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>J.A.R.V.I.S.</title>

<style>

/* =========================
   TEMEL
========================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #01050b;
    color: #00d9ff;
}

body {

    position: relative;

    background:

        radial-gradient(
            circle at 50% 42%,
            rgba(0, 105, 170, .20) 0%,
            rgba(0, 45, 75, .12) 22%,
            transparent 48%
        ),

        radial-gradient(
            circle at 50% 50%,
            #06121d 0%,
            #02070d 48%,
            #010308 100%
        );
}


/* =========================
   ARKA PLAN GRID
========================= */

body::before {

    content: "";

    position: absolute;

    inset: 0;

    opacity: .20;

    background-image:

        linear-gradient(
            rgba(0, 170, 255, .07) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0, 170, 255, .07) 1px,
            transparent 1px
        );

    background-size:
        35px 35px;

    mask-image:
        radial-gradient(
            circle,
            black 20%,
            transparent 75%
        );

    pointer-events: none;
}


/* =========================
   KÖŞE ÇİZGİLERİ
========================= */

.corner {

    position: absolute;

    width: 75px;
    height: 75px;

    border-color:
        rgba(0, 200, 255, .35);

    pointer-events: none;
}

.corner.tl {

    top: 12px;
    left: 12px;

    border-top: 1px solid;
    border-left: 1px solid;
}

.corner.tr {

    top: 12px;
    right: 12px;

    border-top: 1px solid;
    border-right: 1px solid;
}

.corner.bl {

    bottom: 12px;
    left: 12px;

    border-bottom: 1px solid;
    border-left: 1px solid;
}

.corner.br {

    bottom: 12px;
    right: 12px;

    border-bottom: 1px solid;
    border-right: 1px solid;
}


/* =========================
   ÜST BAR
========================= */

.top {

    position: absolute;

    top: 22px;
    left: 20px;
    right: 20px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    z-index: 50;
}


/* =========================
   MENÜ
========================= */

.menu-button {

    width: 56px;
    height: 56px;

    border-radius: 50%;

    border:
        1px solid #00cfff;

    background:
        rgba(0, 18, 30, .82);

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    gap: 5px;

    box-shadow:

        0 0 12px
        rgba(0, 210, 255, .35),

        inset 0 0 15px
        rgba(0, 150, 255, .15);

    cursor: pointer;
}

.menu-button span {

    width: 25px;
    height: 2px;

    border-radius: 4px;

    background: #00d9ff;

    box-shadow:
        0 0 8px #00cfff;
}


/* =========================
   ONLINE DURUMU
========================= */

.status {

    display: flex;

    align-items: center;

    gap: 8px;

    padding:
        8px 13px;

    border:
        1px solid
        rgba(0, 200, 255, .25);

    border-radius: 20px;

    background:
        rgba(0, 20, 32, .55);

    font-size: 9px;

    letter-spacing: 2px;

    color:
        rgba(180, 240, 255, .8);
}

.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #00eaff;

    box-shadow:
        0 0 10px #00eaff;

    animation:
        onlinePulse 1.5s infinite;
}


/* =========================
   ANA HUD
========================= */

.hud {

    position: absolute;

    top: 50%;
    left: 50%;

    width:
        min(88vw, 390px);

    height:
        min(88vw, 390px);

    transform:
        translate(-50%, -54%);

    display: flex;

    justify-content: center;
    align-items: center;
}


/* =========================
   DIŞ HALKA
========================= */

.outer-ring {

    position: absolute;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    border:
        1px solid
        rgba(0, 170, 255, .25);

    box-shadow:
        0 0 35px
        rgba(0, 150, 255, .12);

    animation:
        slowRotate 20s linear infinite;
}


/* =========================
   DIŞ SEGMENTLER
========================= */

.segment-ring {

    position: absolute;

    width: 92%;
    height: 92%;

    border-radius: 50%;

    border:
        3px dashed
        rgba(0, 200, 255, .48);

    animation:
        reverseRotate 14s linear infinite;
}


/* =========================
   TEKNİK HALKA
========================= */

.tech-ring {

    position: absolute;

    width: 78%;
    height: 78%;

    border-radius: 50%;

    border:

        5px solid
        transparent;

    border-top-color:
        #00d9ff;

    border-right-color:
        #008cff;

    border-bottom-color:
        rgba(0, 190, 255, .25);

    box-shadow:

        0 0 15px
        rgba(0, 200, 255, .55),

        inset 0 0 18px
        rgba(0, 180, 255, .2);

    animation:
        rotate 5s linear infinite;
}


/* =========================
   İÇ HALKA
========================= */

.inner-ring {

    position: absolute;

    width: 67%;
    height: 67%;

    border-radius: 50%;

    border:
        1px solid
        rgba(0, 210, 255, .8);

    box-shadow:

        0 0 25px
        rgba(0, 200, 255, .35),

        inset 0 0 25px
        rgba(0, 150, 255, .25);

    animation:
        innerPulse 2.5s ease-in-out infinite;
}


/* =========================
   TARAMA ÇİZGİSİ
========================= */

.scan {

    position: absolute;

    width: 50%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00eaff,
            transparent
        );

    filter:
        drop-shadow(
            0 0 8px #00eaff
        );

    animation:
        scanRotate 4s linear infinite;

    transform-origin:
        left center;
}


/* =========================
   K LOGOSU
========================= */

.logo {

    position: relative;

    width: 148px;
    height: 148px;

    border-radius: 50%;

    display: flex;

    justify-content: center;
    align-items: center;

    background:

        radial-gradient(
            circle at 40% 35%,
            #123c58,
            #041521 58%,
            #01070c 100%
        );

    border:
        2px solid
        #00d9ff;

    box-shadow:

        0 0 25px
        #00bfff,

        0 0 65px
        rgba(0, 180, 255, .45),

        inset 0 0 35px
        rgba(0, 190, 255, .35);

    z-index: 5;

    animation:
        logoPulse 2.4s ease-in-out infinite;
}

.logo::before {

    content: "";

    position: absolute;

    inset: -9px;

    border-radius: 50%;

    border:
        1px solid
        rgba(0, 220, 255, .45);

    animation:
        reverseRotate 7s linear infinite;
}

.logo::after {

    content: "";

    position: absolute;

    inset: 13px;

    border-radius: 50%;

    border:
        1px solid
        rgba(0, 200, 255, .25);
}

.logo span {

    font-size: 92px;

    font-weight: 700;

    color: #00ddff;

    line-height: 1;

    text-shadow:

        0 0 8px #00eaff,
        0 0 25px #008cff,
        0 0 55px #008cff;

    z-index: 2;
}


/* =========================
   TEKNİK NOKTALAR
========================= */

.node {

    position: absolute;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #00d9ff;

    box-shadow:
        0 0 12px #00d9ff;

    animation:
        nodePulse 2s infinite;
}

.node.one {
    top: 18%;
    left: 30%;
}

.node.two {
    top: 25%;
    right: 20%;
    animation-delay: .5s;
}

.node.three {
    bottom: 22%;
    left: 22%;
    animation-delay: 1s;
}

.node.four {
    bottom: 18%;
    right: 28%;
    animation-delay: 1.5s;
}


/* =========================
   MARKA
========================= */

.brand {

    position: absolute;

    top:
        calc(50% + 205px);

    left: 50%;

    transform:
        translateX(-50%);

    text-align: center;

    white-space: nowrap;

    z-index: 10;
}

.brand-title {

    font-size: 27px;

    font-weight: 500;

    letter-spacing: 8px;

    color: #00d9ff;

    text-shadow:

        0 0 10px #00d9ff,
        0 0 25px
        rgba(0, 200, 255, .65);
}

.brand-subtitle {

    margin-top: 7px;

    font-size: 10px;

    letter-spacing: 5px;

    color:
        rgba(135, 220, 255, .65);
}


/* =========================
   ALT DURUM
========================= */

.system-info {

    position: absolute;

    top:
        calc(50% + 258px);

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 8px;

    letter-spacing: 3px;

    color:
        rgba(0, 210, 255, .45);

    white-space: nowrap;
}


/* =========================
   CHAT
========================= */

.chat {

    position: absolute;

    left: 15px;
    right: 15px;

    bottom: 18px;

    height: 59px;

    display: flex;

    gap: 8px;

    z-index: 40;
}

.chat input {

    flex: 1;

    min-width: 0;

    height: 59px;

    border-radius: 30px;

    border:
        1px solid
        rgba(0, 210, 255, .65);

    outline: none;

    padding:
        0 20px;

    font-size: 16px;

    color: white;

    background:
        rgba(2, 18, 30, .92);

    box-shadow:

        0 0 18px
        rgba(0, 180, 255, .16),

        inset 0 0 15px
        rgba(0, 150, 255, .08);
}

.chat input:focus {

    border-color:
        #00eaff;

    box-shadow:

        0 0 22px
        rgba(0, 210, 255, .3);
}

.chat input::placeholder {

    color:
        rgba(180, 230, 255, .45);
}


/* =========================
   GÖNDER
========================= */

.send {

    width: 59px;
    height: 59px;

    flex-shrink: 0;

    border-radius: 50%;

    border:
        1px solid
        #00d9ff;

    background:
        radial-gradient(
            circle,
            #00bfe8,
            #007da5
        );

    color: white;

    font-size: 23px;

    box-shadow:

        0 0 18px
        rgba(0, 210, 255, .55);

    cursor: pointer;

    transition:
        transform .15s;
}

.send:active {

    transform:
        scale(.9);
}


/* =========================
   MESAJLAR
========================= */

.messages {

    position: absolute;

    top: 90px;

    left: 15px;
    right: 15px;

    bottom: 92px;

    overflow-y: auto;

    padding: 10px;

    z-index: 20;

    pointer-events: none;
}

.message {

    max-width: 84%;

    margin: 8px 0;

    padding:
        11px 14px;

    border-radius: 14px;

    white-space: pre-wrap;

    pointer-events: auto;

    font-size: 14px;

    line-height: 1.4;
}

.user {

    margin-left: auto;

    background:
        rgba(0, 120, 175, .35);

    border:
        1px solid
        rgba(0, 200, 255, .35);

    color: white;
}

.jarvis {

    margin-right: auto;

    background:
        rgba(3, 19, 30, .94);

    border:
        1px solid
        rgba(0, 190, 255, .3);

    color:
        #c3f3ff;
}


/* =========================
   MENÜ
========================= */

.menu {

    position: fixed;

    top: 0;
    left: 0;

    width: 290px;
    height: 100%;

    padding: 25px;

    background:
        linear-gradient(
            180deg,
            rgba(3, 20, 35, .98),
            rgba(1, 7, 15, .99)
        );

    border-right:
        1px solid
        #00bfff;

    box-shadow:
        8px 0 35px
        rgba(0, 160, 255, .2);

    transform:
        translateX(-105%);

    transition:
        transform .35s ease;

    z-index: 100;
}

.menu.active {

    transform:
        translateX(0);
}

.menu-header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 35px;
}

.menu-header h2 {

    margin: 0;

    font-size: 21px;

    letter-spacing: 4px;
}

.close-menu {

    border: 0;

    background: transparent;

    color: #00d9ff;

    font-size: 30px;
}

.menu-item {

    width: 100%;

    padding: 17px;

    margin-bottom: 12px;

    border-radius: 12px;

    border:
        1px solid
        rgba(0, 200, 255, .3);

    background:
        rgba(0, 100, 150, .08);

    color: #d9faff;

    text-align: left;

    font-size: 16px;
}

.overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.6);

    opacity: 0;

    pointer-events: none;

    transition: .3s;

    z-index: 90;
}

.overlay.active {

    opacity: 1;

    pointer-events: auto;
}


/* =========================
   ANİMASYONLAR
========================= */

@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes slowRotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes reverseRotate {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes scanRotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes innerPulse {

    0%, 100% {
        transform: scale(.97);
        opacity: .55;
    }

    50% {
        transform: scale(1.03);
        opacity: 1;
    }
}

@keyframes logoPulse {

    0%, 100% {

        box-shadow:

            0 0 25px #00bfff,
            0 0 55px
            rgba(0,180,255,.35),
            inset 0 0 30px
            rgba(0,180,255,.25);
    }

    50% {

        box-shadow:

            0 0 40px #00eaff,
            0 0 90px
            rgba(0,180,255,.65),
            inset 0 0 45px
            rgba(0,180,255,.4);
    }
}

@keyframes onlinePulse {

    0%, 100% {
        opacity: .45;
    }

    50% {
        opacity: 1;
    }
}

@keyframes nodePulse {

    0%, 100% {
        transform: scale(.7);
        opacity: .4;
    }

    50% {
        transform: scale(1.5);
        opacity: 1;
    }
}


/* =========================
   KÜÇÜK EKRAN
========================= */

@media (max-height: 720px) {

    .hud {

        width: 290px;
        height: 290px;

        transform:
            translate(-50%, -54%);
    }

    .logo {

        width: 112px;
        height: 112px;
    }

    .logo span {

        font-size: 70px;
    }

    .brand {

        top:
            calc(50% + 158px);
    }

    .brand-title {

        font-size: 22px;
    }

    .system-info {

        top:
            calc(50% + 205px);
    }
}

</style>

</head>


<body>


<!-- KÖŞELER -->

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>


<!-- MENÜ -->

<div
class="menu"
id="menu">

    <div class="menu-header">

        <h2>JARVIS</h2>

        <button
        class="close-menu"
        onclick="closeMenu()">

            ×

        </button>

    </div>


    <button class="menu-item">

        ⚙️ &nbsp; Ayarlar

    </button>

</div>


<div
class="overlay"
id="overlay"
onclick="closeMenu()">
</div>


<!-- ÜST BAR -->

<div class="top">

    <button
    class="menu-button"
    onclick="openMenu()">

        <span></span>
        <span></span>
        <span></span>

    </button>


    <div class="status">

        <div class="status-dot"></div>

        SYSTEM ONLINE

    </div>

</div>


<!-- ANA HUD -->

<div class="hud">

    <div class="outer-ring"></div>

    <div class="segment-ring"></div>

    <div class="tech-ring"></div>

    <div class="inner-ring"></div>

    <div class="scan"></div>


    <div class="node one"></div>
    <div class="node two"></div>
    <div class="node three"></div>
    <div class="node four"></div>


    <div class="logo">

        <span>K</span>

    </div>

</div>


<!-- MARKA -->

<div class="brand">

    <div class="brand-title">
        J.A.R.V.I.S.
    </div>

    <div class="brand-subtitle">
        KARAHAN INC.
    </div>

</div>


<div class="system-info">

    NEURAL CORE • ONLINE • READY

</div>


<!-- MESAJLAR -->

<div
class="messages"
id="messages">
</div>


<!-- CHAT -->

<div class="chat">

    <input
    id="input"
    type="text"
    placeholder="JARVIS'e yaz..."
    autocomplete="off">


    <button
    class="send"
    onclick="sendMessage()">

        ➤

    </button>

</div>


<script>


/* =========================
   MENÜ
========================= */

function openMenu() {

    document
    .getElementById("menu")
    .classList.add("active");

    document
    .getElementById("overlay")
    .classList.add("active");
}


function closeMenu() {

    document
    .getElementById("menu")
    .classList.remove("active");

    document
    .getElementById("overlay")
    .classList.remove("active");
}


/* =========================
   JARVIS
========================= */

async function sendMessage() {

    const input =
        document.getElementById("input");

    const messages =
        document.getElementById("messages");

    const message =
        input.value.trim();


    if (!message)
        return;


    /* Kullanıcı */

    const userMessage =
        document.createElement("div");

    userMessage.className =
        "message user";

    userMessage.textContent =
        message;

    messages.appendChild(
        userMessage
    );


    input.value = "";


    messages.scrollTop =
        messages.scrollHeight;


    /* Bekleme */

    const loading =
        document.createElement("div");

    loading.className =
        "message jarvis";

    loading.textContent =
        "JARVIS düşünüyor...";

    messages.appendChild(
        loading
    );


    try {

        const response =
            await fetch(
                "/chat",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                message
                        })

                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        loading.textContent =
            data.response ||
            "Cevap alınamadı.";


    }
    catch(error) {

        console.error(error);

        loading.textContent =
            "Sunucuya bağlanılamadı.";

    }


    messages.scrollTop =
        messages.scrollHeight;
}


/* ENTER */

document
.getElementById("input")
.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            sendMessage();

        }

    }
);

</script>


</body>

</html>
