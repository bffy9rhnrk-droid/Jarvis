<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>K.A.R.V.I.S. - KARAHAN INC.</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #02070a;
    color: white;
}

body {
    background:
        radial-gradient(
            circle at center,
            rgba(0, 229, 255, 0.08),
            transparent 38%
        ),
        #02070a;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.header {
    height: 72px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid rgba(0, 229, 255, 0.15);
    background: rgba(2, 7, 10, 0.92);
    position: relative;
    z-index: 10;
}

.logo-small {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid #00e5ff;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #00e5ff;
    font-size: 21px;
    font-weight: 800;
    box-shadow:
        0 0 12px rgba(0, 229, 255, 0.5),
        inset 0 0 12px rgba(0, 229, 255, 0.12);
}

.brand {
    margin-left: 12px;
}

.brand-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 2px;
}

.brand-subtitle {
    color: rgba(255,255,255,0.5);
    font-size: 9px;
    letter-spacing: 3px;
    margin-top: 2px;
}

.online {
    margin-left: 10px;
    font-size: 9px;
    color: #00e5ff;
}

.menu-button {
    margin-left: auto;
    width: 44px;
    height: 44px;
    border: 1px solid rgba(0,229,255,0.25);
    border-radius: 14px;
    background: rgba(0,229,255,0.05);
    color: #00e5ff;
    font-size: 22px;
}

.main {
    height: calc(100vh - 72px);
    display: flex;
    flex-direction: column;
    position: relative;
}

.hud {
    flex: 1;
    position: relative;
    overflow: hidden;
}

.hud-core {
    position: absolute;
    left: 50%;
    top: 38%;
    transform: translate(-50%, -50%);
    width: 210px;
    height: 210px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(0,229,255,0.35);
    animation: spin 9s linear infinite;
}

.ring.one {
    width: 210px;
    height: 210px;
}

.ring.two {
    width: 170px;
    height: 170px;
    border-style: dashed;
    animation-duration: 6s;
    animation-direction: reverse;
}

.ring.three {
    width: 130px;
    height: 130px;
    border-color: rgba(0,229,255,0.7);
    animation-duration: 4s;
}

.core {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    border: 2px solid #00e5ff;
    color: #00e5ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    font-weight: 900;
    box-shadow:
        0 0 25px rgba(0,229,255,0.7),
        inset 0 0 20px rgba(0,229,255,0.2);
    z-index: 2;
}

.status {
    position: absolute;
    top: calc(38% + 120px);
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 10px;
    letter-spacing: 2px;
    white-space: nowrap;
}

.chat {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 100px;
    max-height: 38%;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.message {
    max-width: 86%;
    padding: 11px 14px;
    border-radius: 15px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
}

.message.ai {
    align-self: flex-start;
    background: rgba(0,229,255,0.08);
    border: 1px solid rgba(0,229,255,0.16);
}

.message.user {
    align-self: flex-end;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
}

.message a {
    color: #00e5ff;
}

.input-area {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 15px;
    height: 58px;
    display: flex;
    gap: 8px;
}

.input {
    min-width: 0;
    flex: 1;
    border: 1px solid rgba(0,229,255,0.22);
    border-radius: 18px;
    background: rgba(5,15,20,0.95);
    color: white;
    padding: 0 17px;
    outline: none;
    font-size: 16px;
}

.input:focus {
    border-color: rgba(0,229,255,0.65);
}

.send {
    width: 58px;
    border: 0;
    border-radius: 18px;
    background: #00e5ff;
    color: #001014;
    font-size: 22px;
    font-weight: 900;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: min(330px, 88vw);
    background: rgba(2,7,10,0.98);
    border-right: 1px solid rgba(0,229,255,0.2);
    z-index: 100;
    transform: translateX(-105%);
    transition: transform 0.25s ease;
    padding: 22px 15px;
    overflow-y: auto;
}

.sidebar.open {
    transform: translateX(0);
}

.sidebar-title {
    color: #00e5ff;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 20px;
}

.menu-item {
    width: 100%;
    min-height: 48px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    background: rgba(255,255,255,0.035);
    color: white;
    text-align: left;
    padding: 12px 14px;
    margin-bottom: 8px;
}

.menu-item:hover,
.menu-item.active {
    border-color: rgba(0,229,255,0.45);
    background: rgba(0,229,255,0.08);
    color: #00e5ff;
}

.academic-title {
    margin: 22px 5px 10px;
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.4);
}

.close-sidebar {
    position: absolute;
    right: 14px;
    top: 15px;
    border: 0;
    background: transparent;
    color: #00e5ff;
    font-size: 24px;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 90;
    display: none;
}

.overlay.show {
    display: block;
}

.modal {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(92vw, 440px);
    max-height: 85vh;
    overflow-y: auto;
    background: #071116;
    border: 1px solid rgba(0,229,255,0.25);
    border-radius: 22px;
    z-index: 200;
    padding: 22px;
    display: none;
}

.modal.show {
    display: block;
}

.modal h2 {
    margin-top: 0;
    color: #00e5ff;
}

.modal input {
    width: 100%;
    height: 48px;
    margin-bottom: 10px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: white;
    padding: 0 12px;
    font-size: 16px;
    outline: none;
}

.modal-button {
    width: 100%;
    height: 46px;
    border: 0;
    border-radius: 12px;
    background: #00e5ff;
    color: #001014;
    font-weight: 800;
}

.secondary-button {
    margin-top: 8px;
    background: rgba(255,255,255,0.08);
    color: white;
}

.presentation-result {
    margin-top: 12px;
    padding: 12px;
    border: 1px solid rgba(0,229,255,0.2);
    border-radius: 12px;
}

.presentation-result a {
    color: #00e5ff;
    font-weight: 700;
}

body.sinem-mode .ring {
    border-color: rgba(255,80,180,0.45);
}

body.sinem-mode .core {
    color: #ff5ab4;
    border-color: #ff5ab4;
}

body.fun-mode .ring {
    border-color: rgba(255,50,50,0.6);
}

body.fun-mode .core {
    color: #ff4444;
    border-color: #ff4444;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

</style>
</head>

<body>

<div class="header">

    <div class="logo-small">
        K
    </div>

    <div class="brand">
        <div class="brand-title">
            K.A.R.V.I.S.
        </div>

        <div class="brand-subtitle">
            KARAHAN INC.
        </div>
    </div>

    <div class="online">
        ● ONLINE
    </div>

    <button
        class="menu-button"
        onclick="openSidebar()"
    >
        ☰
    </button>

</div>


<div
    id="overlay"
    class="overlay"
    onclick="closeSidebar()"
></div>


<div
    id="sidebar"
    class="sidebar"
>

    <button
        class="close-sidebar"
        onclick="closeSidebar()"
    >
        ×
    </button>

    <div class="sidebar-title">
        K.A.R.V.I.S.
    </div>

    <button
        class="menu-item"
        onclick="newChat()"
    >
        ＋ Yeni Sohbet
    </button>

    <button
        class="menu-item"
        onclick="openErrors()"
    >
        ⚠ Hatalar
    </button>

    <button
        class="menu-item"
        onclick="openProfile()"
    >
        ◉ Profil Değiştir
    </button>

    <button
        id="funButton"
        class="menu-item"
        onclick="toggleFunMode()"
    >
        ◈ Eğlence Modu
    </button>

    <div
        id="teacherMenu"
        style="display:none;"
    >

        <div class="academic-title">
            AKADEMİK ASİSTAN
        </div>

        <button
            class="menu-item academic-menu-item"
            data-mode="research"
            onclick="selectAcademicMode('research')"
        >
            🔬 Araştırma Modu
        </button>

        <button
            class="menu-item academic-menu-item"
            data-mode="academic"
            onclick="selectAcademicMode('academic')"
        >
            📚 Akademik Mod
        </button>

        <button
            class="menu-item academic-menu-item"
            data-mode="article"
            onclick="selectAcademicMode('article')"
        >
            📝 Makale Asistanı
        </button>

        <button
            class="menu-item academic-menu-item"
            data-mode="lesson"
            onclick="selectAcademicMode('lesson')"
        >
            🎓 Ders Asistanı
        </button>

        <button
            class="menu-item academic-menu-item"
            data-mode="quiz"
            onclick="selectAcademicMode('quiz')"
        >
            🧪 Sınav / Quiz
        </button>

        <button
            class="menu-item academic-menu-item"
            data-mode="presentation"
            onclick="selectAcademicMode('presentation')"
        >
            📊 Sunum Hazırlama
        </button>

    </div>

</div>


<div
    id="profileModal"
    class="modal"
>

    <h2>
        Profil Değiştir
    </h2>

    <input
        id="usernameInput"
        placeholder="Kullanıcı adı"
    >

    <input
        id="passwordInput"
        type="password"
        placeholder="Şifre"
    >

    <button
        class="modal-button"
        onclick="login()"
    >
        Giriş Yap
    </button>

    <button
        class="modal-button secondary-button"
        onclick="closeModals()"
    >
        Vazgeç
    </button>

</div>


<div
    id="errorModal"
    class="modal"
>

    <h2>
        Hatalar
    </h2>

    <div id="errorContent">
        Yükleniyor...
    </div>

    <button
        class="modal-button secondary-button"
        onclick="closeModals()"
    >
        Kapat
    </button>

</div>


<div class="main">

    <div class="hud">

        <div class="hud-core">

            <div class="ring one"></div>
            <div class="ring two"></div>
            <div class="ring three"></div>

            <div class="core">
                K
            </div>

        </div>

        <div
            id="status"
            class="status"
        >
            K.A.R.V.I.S. HAZIR
        </div>

        <div
            id="chat"
            class="chat"
        ></div>

        <div class="input-area">

            <input
                id="messageInput"
                class="input"
                autocomplete="off"
                placeholder="Mesajınızı yazın..."
                onkeydown="handleKey(event)"
            >

            <button
                class="send"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<script>

const API = "";

let currentUser = "karahan";
let currentMode = "normal";
let funMode = false;
let sending = false;


const waitMessages = [
    "Bir saniye efendim...",
    "Tamam, bir bakıyorum...",
    "Dur, bunu birlikte çözelim...",
    "Bir dakika, düşünüyorum...",
    "Tamam, hemen ilgileniyorum..."
];


function $(id) {
    return document.getElementById(id);
}


function addMessage(text, type = "ai") {

    const chat = $("chat");

    const div = document.createElement("div");

    div.className =
        "message " + type;

    div.innerHTML = formatText(text);

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}


function formatText(text) {

    let safe = String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

    safe = safe.replace(
        /(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank">$1</a>'
    );

    return safe;
}


function openSidebar() {

    $("sidebar").classList.add("open");
    $("overlay").classList.add("show");
}


function closeSidebar() {

    $("sidebar").classList.remove("open");
    $("overlay").classList.remove("show");
}


function closeModals() {

    document
        .querySelectorAll(".modal")
        .forEach(function(modal) {
            modal.classList.remove("show");
        });
}


function openProfile() {

    closeSidebar();

    $("profileModal")
        .classList.add("show");
}


async function login() {

    const username =
        $("usernameInput").value
            .trim()
            .toLowerCase();

    const password =
        $("passwordInput").value;

    if (!username) {
        alert("Kullanıcı adı girin.");
        return;
    }

    try {

        const response = await fetch(
            API + "/profile-login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            alert(
                data.detail ||
                "Giriş başarısız."
            );
            return;
        }

        currentUser = data.username;

        currentMode =
            data.default_mode ||
            "normal";

        localStorage.setItem(
            "karvis_user",
            currentUser
        );

        localStorage.setItem(
            "karvis_mode",
            currentMode
        );

        closeModals();

        applyUserTheme();
        updateSidebar();
        showGreeting();

    } catch (error) {

        alert(
            "Sunucuya bağlanılamadı."
        );
    }
}


function applyUserTheme() {

    document.body.classList.remove(
        "sinem-mode"
    );

    if (currentUser === "sinem") {
        document.body.classList.add(
            "sinem-mode"
        );
    }
}


function updateSidebar() {

    const teacherMenu =
        $("teacherMenu");

    const funButton =
        $("funButton");

    if (currentUser === "ilknur") {

        teacherMenu.style.display =
            "block";

        funButton.style.display =
            "none";

    } else {

        teacherMenu.style.display =
            "none";

        funButton.style.display =
            "block";
    }

    document
        .querySelectorAll(
            ".academic-menu-item"
        )
        .forEach(function(button) {

            button.classList.toggle(
                "active",
                button.dataset.mode ===
                currentMode
            );

        });
}


function selectAcademicMode(mode) {

    if (currentUser !== "ilknur") {
        return;
    }

    currentMode = mode;

    localStorage.setItem(
        "karvis_mode",
        currentMode
    );

    updateSidebar();
    closeSidebar();

    const names = {
        research:
            "🔬 Araştırma Modu aktif. Hocam, güncel araştırmalara hazırım.",

        academic:
            "📚 Akademik Mod aktif. Hocam, akademik çalışmalarınıza hazırım.",

        article:
            "📝 Makale Asistanı aktif. Hocam, makalenizi birlikte hazırlayabiliriz.",

        lesson:
            "🎓 Ders Asistanı aktif. Hocam, ders materyalinizi hazırlamaya hazırım.",

        quiz:
            "🧪 Sınav / Quiz modu aktif. Hocam, soru ve sınav hazırlayabilirim.",

        presentation:
            "📊 Sunum Hazırlama aktif. Hocam, konu yazmanız yeterli."
    };

    addMessage(
        names[mode] ||
        "Akademik mod aktif.",
        "ai"
    );
}


function showGreeting() {

    $("chat").innerHTML = "";

    if (currentUser === "karahan") {

        addMessage(
            "Merhaba efendim. K.A.R.V.I.S. hazır.",
            "ai"
        );

    } else if (currentUser === "betul") {

        addMessage(
            "Merhaba Betül. 😏 K.A.R.V.I.S. hazır.",
            "ai"
        );

    } else if (currentUser === "sinem") {

        addMessage(
            "Hoş geldiniz prenses. 💗 K.A.R.V.I.S. hazır.",
            "ai"
        );

    } else if (currentUser === "ilknur") {

        addMessage(
            "Merhaba Hocam. K.A.R.V.I.S. akademik asistanınız olarak hazır. 🎓",
            "ai"
        );

        addMessage(
            "Varsayılan olarak Ders Asistanı aktif.",
            "ai"
        );
    }
}


function getWaitingMessage() {

    if (currentUser === "ilknur") {

        const messages = {
            research:
                "Hocam, güncel araştırmaları inceliyorum...",

            academic:
                "Hocam, akademik açıdan değerlendiriyorum...",

            article:
                "Hocam, makalenin yapısını hazırlıyorum...",

            lesson:
                "Hocam, ders içeriğini hazırlıyorum...",

            quiz:
                "Hocam, soruları hazırlıyorum...",

            presentation:
                "Hocam, sunumu hazırlıyorum. Birkaç saniye sürebilir..."
        };

        return messages[currentMode] ||
            "Hocam, hemen ilgileniyorum...";
    }

    return waitMessages[
        Math.floor(
            Math.random() *
            waitMessages.length
        )
    ];
}


async function sendMessage() {

    if (sending) {
        return;
    }

    const input =
        $("messageInput");

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    sending = true;

    input.value = "";

    addMessage(
        message,
        "user"
    );

    const waiting = document.createElement(
        "div"
    );

    waiting.className =
        "message ai";

    waiting.textContent =
        getWaitingMessage();

    $("chat").appendChild(
        waiting
    );

    $("chat").scrollTop =
        $("chat").scrollHeight;

    try {

        if (
            currentUser === "ilknur" &&
            currentMode === "presentation"
        ) {

            await createPresentation(
                message,
                waiting
            );

        } else {

            const response =
                await fetch(
                    API + "/chat",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                message: message,
                                username:
                                    currentUser,
                                mode:
                                    currentMode
                            })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    data.detail ||
                    "Yanıt alınamadı."
                );
            }

            waiting.remove();

            addMessage(
                data.answer,
                "ai"
            );
        }

    } catch (error) {

        waiting.remove();

        addMessage(
            "Bir sorun oluştu: " +
            error.message,
            "ai"
        );

    } finally {

        sending = false;

        input.focus();
    }
}


async function createPresentation(
    topic,
    waiting
) {

    const response =
        await fetch(
            API + "/presentation",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify({
                        topic: topic,
                        username:
                            currentUser,
                        slide_count: 10,
                        include_visuals: true
                    })
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        throw new Error(
            data.detail ||
            "Sunum oluşturulamadı."
        );
    }

    waiting.remove();

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "message ai";

    div.innerHTML =
        "📊 <b>Sunum hazır Hocam.</b><br><br>" +
        "Konu: " +
        formatText(data.title) +
        "<br>" +
        "Slayt sayısı: " +
        data.slides +
        "<br><br>" +
        '<a href="' +
        API +
        data.file_url +
        '" target="_blank">' +
        "📥 Profesyonel PDF Sunumu Aç" +
        "</a>";

    $("chat").appendChild(
        div
    );

    $("chat").scrollTop =
        $("chat").scrollHeight;
}


function handleKey(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();
    }
}


async function newChat() {

    closeSidebar();

    try {

        await fetch(
            API + "/new-chat?username=" +
            encodeURIComponent(
                currentUser
            ),
            {
                method: "POST"
            }
        );

    } catch (error) {
    }

    showGreeting();
}


async function openErrors() {

    closeSidebar();

    $("errorModal")
        .classList.add("show");

    $("errorContent").textContent =
        "Yükleniyor...";

    try {

        const response =
            await fetch(
                API + "/errors"
            );

        const data =
            await response.json();

        const errors =
            data.errors || [];

        if (!errors.length) {

            $("errorContent").textContent =
                "Kayıtlı hata bulunmuyor.";

            return;
        }

        $("errorContent").textContent =
            errors
                .map(function(item) {
                    return item.message;
                })
                .join("\n\n");

    } catch (error) {

        $("errorContent").textContent =
            "Hatalar alınamadı.";
    }
}


function toggleFunMode() {

    funMode = !funMode;

    document.body.classList.toggle(
        "fun-mode",
        funMode
    );

    closeSidebar();

    if (funMode) {

        addMessage(
            "Eğlence Modu aktif. 😈",
            "ai"
        );

    } else {

        addMessage(
            "Profesyonel Moda geri döndüm.",
            "ai"
        );
    }
}


function initialize() {

    const savedUser =
        localStorage.getItem(
            "karvis_user"
        );

    if (
        savedUser === "karahan" ||
        savedUser === "betul" ||
        savedUser === "sinem" ||
        savedUser === "ilknur"
    ) {

        currentUser =
            savedUser;
    }

    if (currentUser === "ilknur") {

        currentMode = "lesson";

    } else {

        currentMode = "normal";
    }

    applyUserTheme();
    updateSidebar();
    showGreeting();

    $("messageInput").focus();
}


initialize();

</script>

</body>
</html>
