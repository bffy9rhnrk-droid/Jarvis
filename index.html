<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05080d">

<title>J.A.R.V.I.S. - KARAHAN INC.</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05080d;
    color:#f1f7fa;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

:root{
    --accent:#39d9ff;
    --accent-soft:rgba(57,217,255,.13);
    --accent-glow:rgba(57,217,255,.35);
    --bg:#05080d;
    --surface:rgba(13,18,26,.82);
    --surface2:rgba(18,25,35,.88);
    --text:#f1f7fa;
    --muted:#8796a5;
    --border:rgba(255,255,255,.09);
    --danger:#ff4058;
}

/* BACKGROUND */

body{
    position:relative;
    background:
        radial-gradient(circle at 50% 43%,rgba(0,190,255,.075),transparent 28%),
        radial-gradient(circle at 20% 80%,rgba(0,100,160,.07),transparent 30%),
        radial-gradient(circle at 85% 15%,rgba(0,220,255,.045),transparent 25%),
        #05080d;
}

body:before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
    background-size:40px 40px;
    mask-image:linear-gradient(to bottom,transparent,#000 25%,#000 75%,transparent);
}

body:after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.55) 100%);
}

/* APP */

.app{
    position:relative;
    width:100%;
    height:100%;
    z-index:2;
}

/* TOP BAR */

.topbar{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:78px;
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:50;
}

/* MENU LEFT */

.menu-btn{
    width:46px;
    height:46px;
    border-radius:15px;
    border:1px solid var(--border);
    background:rgba(8,13,20,.75);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:5px;
    cursor:pointer;
    box-shadow:0 10px 35px rgba(0,0,0,.25);
    transition:.25s ease;
}

.menu-btn span{
    width:19px;
    height:2px;
    border-radius:10px;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent-glow);
}

.menu-btn:active{
    transform:scale(.92);
}

/* BRAND RIGHT */

.brand{
    text-align:right;
    user-select:none;
}

.brand-main{
    font-size:17px;
    font-weight:700;
    letter-spacing:3px;
    color:#f4fbff;
    text-shadow:0 0 16px rgba(57,217,255,.22);
}

.brand-sub{
    margin-top:3px;
    font-size:8px;
    letter-spacing:4px;
    color:var(--accent);
    opacity:.75;
}

/* SYSTEM STATUS */

.system-status{
    position:absolute;
    top:86px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:7px;
    padding:6px 11px;
    border:1px solid rgba(57,217,255,.13);
    border-radius:30px;
    background:rgba(5,12,18,.55);
    backdrop-filter:blur(10px);
    font-size:8px;
    letter-spacing:2px;
    color:#7893a2;
    white-space:nowrap;
}

.status-dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent);
    animation:pulse 1.8s infinite;
}

/* MAIN */

.main{
    position:absolute;
    inset:0;
}

/* CORE AREA */

.core-area{
    position:absolute;
    width:min(82vw,360px);
    height:min(82vw,360px);
    left:50%;
    top:42%;
    transform:translate(-50%,-50%);
}

/* HUD */

.hud{
    position:absolute;
    z-index:10;
    width:112px;
    padding:9px 10px;
    border:1px solid rgba(57,217,255,.13);
    border-radius:11px;
    background:rgba(5,12,18,.58);
    backdrop-filter:blur(13px);
    -webkit-backdrop-filter:blur(13px);
    box-shadow:
        0 8px 25px rgba(0,0,0,.18),
        inset 0 0 20px rgba(57,217,255,.018);
}

.hud:before{
    content:"";
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
}

.hud-title{
    font-size:7px;
    letter-spacing:1.8px;
    color:#657783;
    margin-bottom:4px;
}

.hud-value{
    font-size:13px;
    font-weight:600;
    letter-spacing:1px;
    color:#dff9ff;
}

.hud-sub{
    margin-top:3px;
    font-size:6px;
    letter-spacing:1px;
    color:#51616d;
}

.hud-left-top{
    left:-28px;
    top:26px;
}

.hud-left-top:before{
    right:-3px;
    top:50%;
}

.hud-right-top{
    right:-28px;
    top:26px;
}

.hud-right-top:before{
    left:-3px;
    top:50%;
}

.hud-left-bottom{
    left:-28px;
    bottom:26px;
}

.hud-left-bottom:before{
    right:-3px;
    top:50%;
}

.hud-right-bottom{
    right:-28px;
    bottom:26px;
}

.hud-right-bottom:before{
    left:-3px;
    top:50%;
}

/* HUD CONNECTORS */

.connector{
    position:absolute;
    height:1px;
    width:32px;
    background:linear-gradient(90deg,transparent,var(--accent));
    opacity:.25;
    z-index:2;
}

.connector-1{
    left:75px;
    top:69px;
}

.connector-2{
    right:75px;
    top:69px;
    transform:rotate(180deg);
}

.connector-3{
    left:75px;
    bottom:69px;
}

.connector-4{
    right:75px;
    bottom:69px;
    transform:rotate(180deg);
}

/* CORE GLOW */

.core-glow{
    position:absolute;
    width:68%;
    height:68%;
    left:16%;
    top:16%;
    border-radius:50%;
    background:rgba(0,210,255,.09);
    filter:blur(28px);
    animation:coreGlow 4s ease-in-out infinite;
}

/* ORBITS */

.orbit{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border:1px solid rgba(57,217,255,.13);
    border-radius:50%;
    pointer-events:none;
}

.orbit-outer{
    width:100%;
    height:100%;
    animation:rotate 24s linear infinite;
}

.orbit-second{
    width:88%;
    height:88%;
    border-color:rgba(57,217,255,.19);
    border-style:dashed;
    animation:rotateReverse 19s linear infinite;
}

.orbit-third{
    width:75%;
    height:75%;
    border-color:rgba(57,217,255,.11);
    animation:rotate 14s linear infinite;
}

.orbit-inner{
    width:63%;
    height:63%;
    border-color:rgba(57,217,255,.24);
    border-style:dashed;
    animation:rotateReverse 10s linear infinite;
}

/* ORBIT DOTS */

.orbit-dot{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:
        0 0 8px var(--accent),
        0 0 18px var(--accent);
}

.dot-1{
    top:-3px;
    left:50%;
}

.dot-2{
    right:-3px;
    top:50%;
}

.dot-3{
    bottom:-3px;
    left:50%;
}

.dot-4{
    left:-3px;
    top:50%;
}

/* CORE */

.core{
    position:absolute;
    width:45%;
    height:45%;
    left:27.5%;
    top:27.5%;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),transparent 17%),
        radial-gradient(circle,rgba(0,210,255,.22),rgba(2,23,34,.96) 67%);
    border:1px solid rgba(91,226,255,.65);
    box-shadow:
        inset 0 0 30px rgba(57,217,255,.14),
        0 0 20px rgba(57,217,255,.16),
        0 0 65px rgba(57,217,255,.08);
    overflow:hidden;
    animation:corePulse 3.5s ease-in-out infinite;
}

.core:before{
    content:"";
    position:absolute;
    inset:9%;
    border:1px solid rgba(57,217,255,.22);
    border-radius:50%;
    animation:rotate 7s linear infinite;
}

.core:after{
    content:"";
    position:absolute;
    width:120%;
    height:1px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    opacity:.35;
    animation:scan 3s ease-in-out infinite;
}

.core-letter{
    position:relative;
    z-index:4;
    font-size:clamp(43px,12vw,62px);
    font-weight:300;
    letter-spacing:4px;
    color:#dffaff;
    text-shadow:
        0 0 8px rgba(57,217,255,.8),
        0 0 28px rgba(57,217,255,.5);
}

/* CORE INFO */

.core-info{
    position:absolute;
    top:105%;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    white-space:nowrap;
}

.core-name{
    font-size:13px;
    font-weight:600;
    letter-spacing:4px;
    color:#dcecf1;
}

.core-desc{
    margin-top:6px;
    font-size:7px;
    letter-spacing:3px;
    color:#62747e;
}

/* CHAT */

.chat-area{
    position:absolute;
    left:50%;
    bottom:108px;
    transform:translateX(-50%);
    width:min(88%,560px);
    max-height:150px;
    overflow-y:auto;
    padding:8px 3px;
    scrollbar-width:none;
}

.chat-area::-webkit-scrollbar{
    display:none;
}

.message{
    width:100%;
    margin:7px 0;
    padding:11px 14px;
    border:1px solid rgba(255,255,255,.055);
    border-radius:14px;
    background:rgba(8,14,21,.48);
    backdrop-filter:blur(10px);
    color:#b8c7ce;
    font-size:12px;
    line-height:1.5;
}

.message.user{
    text-align:right;
    color:#dffaff;
    border-color:rgba(57,217,255,.09);
}

.message.ai{
    text-align:left;
}

/* COMMAND */

.command-wrap{
    position:absolute;
    left:50%;
    bottom:28px;
    transform:translateX(-50%);
    width:min(92%,600px);
}

.command-bar{
    height:55px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:18px;
    background:rgba(9,14,21,.78);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:
        0 15px 45px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.025);
}

#messageInput{
    flex:1;
    min-width:0;
    height:43px;
    border:0;
    outline:0;
    background:transparent;
    color:#edfaff;
    padding:0 12px;
    font-size:16px;
}

#messageInput::placeholder{
    color:#52616c;
}

.voice-btn,
.send-btn{
    width:42px;
    height:42px;
    flex-shrink:0;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.035);
    color:var(--accent);
    font-size:17px;
    cursor:pointer;
    transition:.2s ease;
}

.voice-btn:active,
.send-btn:active{
    transform:scale(.9);
}

.send-btn{
    background:rgba(57,217,255,.08);
    border-color:rgba(57,217,255,.16);
}

/* TYPING */

.typing{
    display:flex;
    gap:4px;
    align-items:center;
}

.typing span{
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--accent);
    animation:typing 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

/* SIDEBAR */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    backdrop-filter:blur(3px);
    z-index:80;
    opacity:0;
    visibility:hidden;
    transition:.3s ease;
}

.overlay.active{
    opacity:1;
    visibility:visible;
}

.sidebar{
    position:fixed;
    top:0;
    left:0;
    width:min(82vw,310px);
    height:100%;
    z-index:90;
    padding:25px 18px;
    background:rgba(7,12,18,.96);
    border-right:1px solid rgba(255,255,255,.07);
    box-shadow:20px 0 60px rgba(0,0,0,.35);
    transform:translateX(-105%);
    transition:.35s cubic-bezier(.22,.61,.36,1);
    backdrop-filter:blur(25px);
}

.sidebar.active{
    transform:translateX(0);
}

.sidebar-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.sidebar-title{
    font-size:15px;
    font-weight:600;
    letter-spacing:2px;
}

.close-btn{
    width:38px;
    height:38px;
    border-radius:12px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.035);
    color:#91a2ac;
    font-size:18px;
}

.nav-item{
    width:100%;
    padding:14px 13px;
    margin-bottom:7px;
    display:flex;
    align-items:center;
    gap:12px;
    border:1px solid transparent;
    border-radius:13px;
    background:transparent;
    color:#8c9ca5;
    font-size:12px;
    text-align:left;
}

.nav-item.active,
.nav-item:active{
    background:rgba(57,217,255,.07);
    border-color:rgba(57,217,255,.1);
    color:#dffaff;
}

.nav-icon{
    width:20px;
    text-align:center;
    color:var(--accent);
}

.sidebar-line{
    height:1px;
    background:rgba(255,255,255,.06);
    margin:22px 0;
}

.settings-title{
    margin-bottom:14px;
    color:#60717c;
    font-size:8px;
    letter-spacing:2px;
}

.setting{
    margin-bottom:18px;
}

.setting-label{
    display:block;
    margin-bottom:8px;
    font-size:10px;
    color:#9aabb4;
}

.setting select{
    width:100%;
    height:40px;
    padding:0 10px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,.07);
    outline:0;
    background:#0b1118;
    color:#d9e9ee;
}

.switch-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.switch{
    position:relative;
    width:43px;
    height:24px;
}

.switch input{
    opacity:0;
    width:0;
    height:0;
}

.slider{
    position:absolute;
    inset:0;
    border-radius:30px;
    background:#17212a;
    border:1px solid rgba(255,255,255,.08);
}

.slider:before{
    content:"";
    position:absolute;
    width:17px;
    height:17px;
    left:3px;
    top:2px;
    border-radius:50%;
    background:#7a8992;
    transition:.25s ease;
}

.switch input:checked + .slider{
    background:rgba(57,217,255,.15);
    border-color:rgba(57,217,255,.3);
}

.switch input:checked + .slider:before{
    transform:translateX(18px);
    background:var(--accent);
    box-shadow:0 0 10px var(--accent);
}

/* FUN MODE */

body.fun-mode{
    --accent:#ff4058;
    --accent-soft:rgba(255,64,88,.13);
    --accent-glow:rgba(255,64,88,.35);
}

body.fun-mode .core{
    background:
        radial-gradient(circle at 35% 30%,rgba(255,255,255,.16),transparent 17%),
        radial-gradient(circle,rgba(255,64,88,.22),rgba(34,5,10,.96) 67%);
}

/* LIGHT */

body.light{
    --bg:#edf3f5;
    --text:#142027;
    --muted:#65757d;
    --border:rgba(0,0,0,.09);
    background:
        radial-gradient(circle at 50% 40%,rgba(0,180,220,.1),transparent 30%),
        #edf3f5;
    color:#142027;
}

body.light:before{
    opacity:.5;
}

body.light .message,
body.light .command-bar,
body.light .menu-btn,
body.light .system-status{
    background:rgba(255,255,255,.72);
}

body.light .brand-main{
    color:#142027;
}

body.light .sidebar{
    background:rgba(244,248,249,.96);
}

/* ANIMATIONS */

@keyframes rotate{
    from{transform:translate(-50%,-50%) rotate(0deg)}
    to{transform:translate(-50%,-50%) rotate(360deg)}
}

@keyframes rotateReverse{
    from{transform:translate(-50%,-50%) rotate(360deg)}
    to{transform:translate(-50%,-50%) rotate(0deg)}
}

@keyframes corePulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.025);
    }
}

@keyframes coreGlow{
    0%,100%{
        opacity:.55;
        transform:scale(.95);
    }
    50%{
        opacity:.9;
        transform:scale(1.05);
    }
}

@keyframes pulse{
    0%,100%{opacity:.4}
    50%{opacity:1}
}

@keyframes scan{
    0%,100%{transform:translateY(-50px);opacity:0}
    45%{opacity:.4}
    50%{transform:translateY(50px);opacity:0}
}

@keyframes typing{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.4;
    }
    30%{
        transform:translateY(-4px);
        opacity:1;
    }
}

/* MOBILE */

@media(max-width:480px){

    .topbar{
        height:70px;
        padding:13px 15px;
    }

    .menu-btn{
        width:43px;
        height:43px;
    }

    .brand-main{
        font-size:15px;
        letter-spacing:2.5px;
    }

    .brand-sub{
        font-size:7px;
        letter-spacing:3px;
    }

    .system-status{
        top:75px;
    }

    .core-area{
        width:82vw;
        height:82vw;
        top:40%;
    }

    .hud{
        width:94px;
        padding:8px;
    }

    .hud-left-top,
    .hud-left-bottom{
        left:-12px;
    }

    .hud-right-top,
    .hud-right-bottom{
        right:-12px;
    }

    .hud-value{
        font-size:11px;
    }

    .hud-title{
        font-size:6px;
    }

    .hud-sub{
        font-size:5px;
    }

    .connector{
        display:none;
    }

    .chat-area{
        bottom:101px;
        max-height:105px;
        width:90%;
    }

    .message{
        font-size:11px;
        padding:9px 11px;
    }

    .command-wrap{
        bottom:18px;
        width:94%;
    }

    .command-bar{
        height:53px;
        border-radius:17px;
    }

    .voice-btn,
    .send-btn{
        width:40px;
        height:40px;
    }
}

@media(max-width:360px){

    .hud{
        width:84px;
    }

    .hud-left-top,
    .hud-left-bottom{
        left:-7px;
    }

    .hud-right-top,
    .hud-right-bottom{
        right:-7px;
    }

    .hud-sub{
        display:none;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- TOP -->

    <header class="topbar">

        <!-- MENU LEFT -->
        <button class="menu-btn" id="menuBtn" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- BRAND RIGHT -->
        <div class="brand">
            <div class="brand-main">J.A.R.V.I.S.</div>
            <div class="brand-sub">KARAHAN INC.</div>
        </div>

    </header>

    <div class="system-status">
        <span class="status-dot"></span>
        <span id="systemStatus">SYSTEM ONLINE</span>
    </div>

    <!-- MAIN -->

    <main class="main">

        <section class="core-area">

            <!-- HUD DATA -->

            <div class="hud hud-left-top">
                <div class="hud-title">ATMOSPHERE</div>
                <div class="hud-value" id="weatherValue">-- C</div>
                <div class="hud-sub" id="weatherSub">DENIZLI</div>
            </div>

            <div class="hud hud-right-top">
                <div class="hud-title">NETWORK</div>
                <div class="hud-value" id="networkValue">100%</div>
                <div class="hud-sub" id="networkSub">ONLINE</div>
            </div>

            <div class="hud hud-left-bottom">
                <div class="hud-title">K-CORE</div>
                <div class="hud-value" id="coreLoad">18%</div>
                <div class="hud-sub">NEURAL LOAD</div>
            </div>

            <div class="hud hud-right-bottom">
                <div class="hud-title">LOCAL TIME</div>
                <div class="hud-value" id="clockValue">--:--</div>
                <div class="hud-sub" id="dateValue">--</div>
            </div>

            <!-- CONNECTORS -->

            <div class="connector connector-1"></div>
            <div class="connector connector-2"></div>
            <div class="connector connector-3"></div>
            <div class="connector connector-4"></div>

            <!-- GLOW -->

            <div class="core-glow"></div>

            <!-- ORBITS -->

            <div class="orbit orbit-outer">
                <div class="orbit-dot dot-1"></div>
                <div class="orbit-dot dot-3"></div>
            </div>

            <div class="orbit orbit-second">
                <div class="orbit-dot dot-2"></div>
            </div>

            <div class="orbit orbit-third"></div>

            <div class="orbit orbit-inner">
                <div class="orbit-dot dot-4"></div>
            </div>

            <!-- CORE -->

            <div class="core">
                <div class="core-letter">K</div>
            </div>

            <!-- CORE INFO -->

            <div class="core-info">
                <div class="core-name">J.A.R.V.I.S.</div>
                <div class="core-desc">PERSONAL AI SYSTEM</div>
            </div>

        </section>

        <!-- CHAT -->

        <section class="chat-area" id="chatArea">

            <div class="message ai">
                Merhaba Efendim, nasil yardimci olabilirim?
            </div>

        </section>

        <!-- COMMAND -->

        <div class="command-wrap">

            <div class="command-bar">

                <input
                    id="messageInput"
                    type="text"
                    autocomplete="off"
                    placeholder="JARVIS'e bir sey sorun..."
                >

                <button class="voice-btn" id="voiceBtn" aria-label="Sesli komut">
                    MIC
                </button>

                <button class="send-btn" id="sendBtn" aria-label="Gonder">
                    >
                </button>

            </div>

        </div>

    </main>

</div>


<!-- SIDEBAR -->

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">

    <div class="sidebar-head">

        <div class="sidebar-title">
            J.A.R.V.I.S.
        </div>

        <button class="close-btn" id="closeBtn">
            X
        </button>

    </div>

    <button class="nav-item active" id="homeBtn">
        <span class="nav-icon">H</span>
        Ana Ekran
    </button>

    <button class="nav-item" id="chatNavBtn">
        <span class="nav-icon">C</span>
        JARVIS Chat
    </button>

    <button class="nav-item" id="settingsNavBtn">
        <span class="nav-icon">S</span>
        Ayarlar
    </button>

    <div class="sidebar-line"></div>

    <div class="settings-title">
        SISTEM AYARLARI
    </div>

    <!-- ADDRESS -->

    <div class="setting">

        <label class="setting-label">
            Hitap Sekli
        </label>

        <select id="addressSelect">
            <option value="Efendim">Efendim</option>
            <option value="Komutanım">Komutanım</option>
            <option value="Patron">Patron</option>
            <option value="Özel">Özel</option>
        </select>

    </div>

    <!-- FUN -->

    <div class="setting">

        <div class="switch-row">

            <span class="setting-label" style="margin:0">
                Eglence Modu
            </span>

            <label class="switch">
                <input type="checkbox" id="funMode">
                <span class="slider"></span>
            </label>

        </div>

    </div>

    <!-- THEME -->

    <div class="setting">

        <label class="setting-label">
            Tema
        </label>

        <select id="themeSelect">
            <option value="dark">Gece</option>
            <option value="light">Gunduz</option>
        </select>

    </div>

</aside>


<script>

/* ==============================
   ELEMENTS
============================== */

const menuBtn = document.getElementById("menuBtn");
const closeBtn = document.getElementById("closeBtn");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const voiceBtn = document.getElementById("voiceBtn");

const chatArea = document.getElementById("chatArea");

const addressSelect = document.getElementById("addressSelect");
const funMode = document.getElementById("funMode");
const themeSelect = document.getElementById("themeSelect");

const weatherValue = document.getElementById("weatherValue");
const weatherSub = document.getElementById("weatherSub");

const networkValue = document.getElementById("networkValue");
const networkSub = document.getElementById("networkSub");

const coreLoad = document.getElementById("coreLoad");

const clockValue = document.getElementById("clockValue");
const dateValue = document.getElementById("dateValue");

const systemStatus = document.getElementById("systemStatus");


/* ==============================
   SIDEBAR
============================== */

function openSidebar(){
    sidebar.classList.add("active");
    overlay.classList.add("active");
}

function closeSidebar(){
    sidebar.classList.remove("active");
    overlay.classList.remove("active");
}

menuBtn.addEventListener("click",openSidebar);
closeBtn.addEventListener("click",closeSidebar);
overlay.addEventListener("click",closeSidebar);


/* ==============================
   LOCAL STORAGE
============================== */

const savedAddress = localStorage.getItem("jarvis_address");
const savedFun = localStorage.getItem("jarvis_fun");
const savedTheme = localStorage.getItem("jarvis_theme");

if(savedAddress){
    addressSelect.value = savedAddress;
}

if(savedFun === "true"){
    funMode.checked = true;
    document.body.classList.add("fun-mode");
}

if(savedTheme === "light"){
    themeSelect.value = "light";
    document.body.classList.add("light");
}


/* ==============================
   SETTINGS
============================== */

addressSelect.addEventListener("change",function(){

    localStorage.setItem(
        "jarvis_address",
        addressSelect.value
    );

});

funMode.addEventListener("change",function(){

    document.body.classList.toggle(
        "fun-mode",
        funMode.checked
    );

    localStorage.setItem(
        "jarvis_fun",
        funMode.checked
    );

});

themeSelect.addEventListener("change",function(){

    document.body.classList.toggle(
        "light",
        themeSelect.value === "light"
    );

    localStorage.setItem(
        "jarvis_theme",
        themeSelect.value
    );

});


/* ==============================
   CHAT
============================== */

function addMessage(text,type){

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    chatArea.appendChild(message);

    chatArea.scrollTop = chatArea.scrollHeight;

    return message;
}


function addTyping(){

    const message = document.createElement("div");

    message.className = "message ai";

    message.innerHTML =
        '<div class="typing">' +
        '<span></span>' +
        '<span></span>' +
        '<span></span>' +
        '</div>';

    chatArea.appendChild(message);

    chatArea.scrollTop = chatArea.scrollHeight;

    return message;
}


/* ==============================
   SEND MESSAGE
============================== */

async function sendMessage(){

    const text = messageInput.value.trim();

    if(!text){
        return;
    }

    addMessage(text,"user");

    messageInput.value = "";

    const typing = addTyping();

    systemStatus.textContent = "PROCESSING";

    coreLoad.textContent = "86%";

    try{

        const response = await fetch("/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                message:text,

                address:addressSelect.value,

                fun_mode:funMode.checked

            })

        });

        if(!response.ok){
            throw new Error("Server error");
        }

        const data = await response.json();

        typing.remove();

        addMessage(
            data.response || "Efendim, su anda yanit olusturamiyorum.",
            "ai"
        );

        systemStatus.textContent = "SYSTEM ONLINE";

    }catch(error){

        typing.remove();

        addMessage(
            "Efendim, sunucuya baglanirken bir sorun olustu.",
            "ai"
        );

        systemStatus.textContent = "CONNECTION ERROR";

    }

    coreLoad.textContent =
        Math.floor(12 + Math.random() * 18) + "%";
}


sendBtn.addEventListener("click",sendMessage);


messageInput.addEventListener("keydown",function(event){

    if(event.key === "Enter"){
        event.preventDefault();
        sendMessage();
    }

});


/* ==============================
   CLOCK
============================== */

function updateClock(){

    const now = new Date();

    const hours =
        String(now.getHours()).padStart(2,"0");

    const minutes =
        String(now.getMinutes()).padStart(2,"0");

    clockValue.textContent =
        hours + ":" + minutes;

    const day =
        String(now.getDate()).padStart(2,"0");

    const month =
        String(now.getMonth() + 1).padStart(2,"0");

    dateValue.textContent =
        day + "." + month + "." + now.getFullYear();
}

updateClock();

setInterval(updateClock,1000);


/* ==============================
   NETWORK
============================== */

function updateNetwork(){

    if(!navigator.onLine){

        networkValue.textContent = "0%";
        networkSub.textContent = "OFFLINE";

        return;
    }

    let percentage = 100;

    if(navigator.connection){

        const type =
            navigator.connection.effectiveType;

        if(type === "slow-2g"){
            percentage = 25;
        }else if(type === "2g"){
            percentage = 45;
        }else if(type === "3g"){
            percentage = 70;
        }else{
            percentage = 100;
        }
    }

    networkValue.textContent =
        percentage + "%";

    networkSub.textContent =
        navigator.onLine ? "ONLINE" : "OFFLINE";
}

updateNetwork();

window.addEventListener(
    "online",
    updateNetwork
);

window.addEventListener(
    "offline",
    updateNetwork
);

if(navigator.connection){

    navigator.connection.addEventListener(
        "change",
        updateNetwork
    );

}


/* ==============================
   WEATHER
============================== */

async function loadWeather(){

    try{

        const url =
            "https://api.open-meteo.com/v1/forecast" +
            "?latitude=37.7765" +
            "&longitude=29.0864" +
            "&current=temperature_2m,weather_code" +
            "&timezone=Europe%2FIstanbul";

        const response =
            await fetch(url);

        if(!response.ok){
            throw new Error("Weather error");
        }

        const data =
            await response.json();

        const temperature =
            Math.round(data.current.temperature_2m);

        weatherValue.textContent =
            temperature + " C";

        weatherSub.textContent =
            "DENIZLI";

    }catch(error){

        weatherValue.textContent =
            "-- C";

        weatherSub.textContent =
            "WEATHER N/A";

    }
}

loadWeather();


/* ==============================
   CORE LOAD
============================== */

function idleCore(){

    const value =
        Math.floor(12 + Math.random() * 17);

    coreLoad.textContent =
        value + "%";
}

setInterval(idleCore,5000);


/* ==============================
   VOICE RECOGNITION
============================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if(SpeechRecognition){

    const recognition =
        new SpeechRecognition();

    recognition.lang = "tr-TR";

    recognition.continuous = false;

    recognition.interimResults = false;

    voiceBtn.addEventListener("click",function(){

        try{

            recognition.start();

            voiceBtn.textContent = "...";

            systemStatus.textContent =
                "LISTENING";

        }catch(error){}

    });

    recognition.onresult = function(event){

        const result =
            event.results[0][0].transcript;

        messageInput.value = result;

        voiceBtn.textContent = "MIC";

        systemStatus.textContent =
            "SYSTEM ONLINE";

        sendMessage();

    };

    recognition.onerror = function(){

        voiceBtn.textContent = "MIC";

        systemStatus.textContent =
            "SYSTEM ONLINE";

    };

    recognition.onend = function(){

        voiceBtn.textContent = "MIC";

    };

}else{

    voiceBtn.style.opacity = ".4";

}


/* ==============================
   NAVIGATION
============================== */

document.getElementById("homeBtn")
.addEventListener("click",function(){

    closeSidebar();

});

document.getElementById("chatNavBtn")
.addEventListener("click",function(){

    closeSidebar();

    setTimeout(function(){
        messageInput.focus();
    },350);

});

document.getElementById("settingsNavBtn")
.addEventListener("click",function(){

    document.querySelector(".sidebar-line")
        .scrollIntoView({
            behavior:"smooth"
        });

});


/* ==============================
   STARTUP
============================== */

setTimeout(function(){

    systemStatus.textContent =
        "SYSTEM ONLINE";

},800);

</script>

</body>
</html>
