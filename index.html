<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#020708">

<title>J.A.R.V.I.S. — KARAHAN INC.</title>

<style>

/* =====================================================
   TEMEL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;
    min-height: 100%;

    overflow: hidden;

    background: #020708 !important;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {

    color: #dffcff;

    background:
        radial-gradient(
            circle at 50% 35%,
            #071b20 0%,
            #020708 55%,
            #000000 100%
        ) !important;
}


/* =====================================================
   ANA UYGULAMA
===================================================== */

.app {

    width: 100%;
    height: 100dvh;
    min-height: 100dvh;

    display: flex;
    flex-direction: column;

    position: relative;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(0, 238, 255, 0.025),
            transparent 45%
        ),
        #020708;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    height: 75px;
    min-height: 75px;

    display: flex;
    align-items: center;

    padding: 0 18px;

    border-bottom:
        1px solid
        rgba(0, 238, 255, 0.18);

    background:
        rgba(2, 7, 8, 0.97) !important;

    backdrop-filter: blur(15px);

    -webkit-backdrop-filter: blur(15px);

    z-index: 20;

    color: #dffcff;
}


.menu-btn {

    width: 42px;
    height: 42px;

    border-radius: 12px;

    border:
        1px solid
        rgba(0, 238, 255, 0.3);

    background:
        rgba(0, 238, 255, 0.05);

    color: #00eaff;

    font-size: 22px;

    cursor: pointer;
}


.brand {

    margin-left: 14px;

    display: flex;
    flex-direction: column;
}


.brand-main {

    font-size: 20px;

    font-weight: 700;

    letter-spacing: 4px;

    color: #eaffff;

    text-shadow:
        0 0 14px
        rgba(0, 238, 255, 0.55);
}


.brand-sub {

    font-size: 8px;

    letter-spacing: 4px;

    margin-top: 2px;

    color: #00eaff;
}


.status {

    margin-left: auto;

    display: flex;
    align-items: center;

    gap: 7px;

    font-size: 10px;

    color: #7bdde7;
}


.status-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #00ffcc;

    box-shadow:
        0 0 10px #00ffcc;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {

    position: fixed;

    left: -290px;
    top: 0;

    width: 290px;
    height: 100dvh;

    background:
        linear-gradient(
            180deg,
            #061317 0%,
            #020708 100%
        ) !important;

    border-right:
        1px solid
        rgba(0, 238, 255, 0.25);

    z-index: 100;

    padding: 24px 18px;

    transition:
        left .28s ease;

    box-shadow:
        10px 0 40px
        rgba(0, 0, 0, .55);
}


.sidebar.open {
    left: 0;
}


.sidebar-title {

    font-size: 11px;

    letter-spacing: 3px;

    color: #00eaff;

    margin-bottom: 22px;
}


.sidebar-item {

    width: 100%;

    border: 0;

    background:
        rgba(0, 238, 255, 0.035);

    border:
        1px solid
        rgba(0, 238, 255, 0.12);

    color: #d9fbff;

    padding: 14px;

    border-radius: 13px;

    margin-bottom: 10px;

    text-align: left;

    font-size: 14px;

    cursor: pointer;
}


.sidebar-item:active {
    transform: scale(.98);
}


.sidebar-item .icon {
    margin-right: 10px;
}


.sidebar-bottom {

    position: absolute;

    left: 18px;
    right: 18px;
    bottom: 20px;

    font-size: 9px;

    color: #4e777c;

    text-align: center;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(0, 0, 0, .65);

    z-index: 90;

    display: none;
}


.overlay.active {
    display: block;
}


/* =====================================================
   ANA EKRAN
===================================================== */

.main {

    flex: 1;

    display: flex;
    flex-direction: column;

    min-height: 0;

    background:
        transparent !important;
}


.hero {

    padding:
        24px
        20px
        12px;

    text-align: center;

    background: transparent !important;
}


.logo {

    width: 100px;
    height: 100px;

    margin:
        4px
        auto
        15px;

    border-radius: 50%;

    border:
        1px solid
        rgba(0, 238, 255, .75);

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    color: #00eaff;

    font-size: 42px;

    font-weight: 800;

    text-shadow:
        0 0 20px #00eaff;

    box-shadow:
        0 0 30px
        rgba(0, 238, 255, .18),

        inset 0 0 30px
        rgba(0, 238, 255, .1);
}


.logo::before,
.logo::after {

    content: "";

    position: absolute;

    inset: -8px;

    border-radius: 50%;

    border:
        1px solid
        rgba(0, 238, 255, .3);

    animation:
        rotate 8s linear infinite;
}


.logo::after {

    inset: -16px;

    border-style: dashed;

    animation-direction:
        reverse;

    animation-duration: 12s;
}


@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


.hero h1 {

    margin: 0;

    font-size: 22px;

    letter-spacing: 2px;

    color: #eaffff;
}


.hero p {

    margin:
        7px 0 0;

    color: #67949a;

    font-size: 12px;
}


/* =====================================================
   CHAT
===================================================== */

.chat {

    flex: 1;

    overflow-y: auto;

    padding:
        10px
        16px
        12px;

    scroll-behavior: smooth;

    background: transparent !important;

    -webkit-overflow-scrolling: touch;
}


.message {

    max-width: 88%;

    padding:
        12px
        14px;

    margin-bottom: 12px;

    border-radius: 15px;

    font-size: 14px;

    line-height: 1.55;

    white-space: pre-wrap;

    word-break: break-word;
}


.message.user {

    margin-left: auto;

    background:
        rgba(0, 238, 255, .09);

    border:
        1px solid
        rgba(0, 238, 255, .2);

    color: #e8feff;
}


.message.assistant {

    margin-right: auto;

    background:
        rgba(255, 255, 255, .035);

    border:
        1px solid
        rgba(255, 255, 255, .08);

    color: #d4edef;
}


.message.error {

    border:
        1px solid
        rgba(255, 75, 75, .5);

    background:
        rgba(255, 45, 45, .07);

    color: #ffb8b8;
}


/* =====================================================
   INPUT
===================================================== */

.input-area {

    padding:
        10px
        12px
        calc(
            10px +
            env(safe-area-inset-bottom)
        );

    display: flex;

    gap: 8px;

    border-top:
        1px solid
        rgba(0, 238, 255, .14);

    background:
        rgba(2, 7, 8, .98) !important;

    position: relative;

    z-index: 10;
}


.input {

    flex: 1;

    min-width: 0;

    height: 48px;

    border-radius: 14px;

    border:
        1px solid
        rgba(0, 238, 255, .2);

    background:
        rgba(255, 255, 255, .035) !important;

    color: white;

    padding:
        0 14px;

    outline: none;

    font-size: 16px;
}


.input::placeholder {
    color: #527277;
}


.send {

    width: 50px;

    border: 0;

    border-radius: 14px;

    background:
        #00d9eb;

    color: #001014;

    font-size: 19px;

    font-weight: 800;

    cursor: pointer;
}


/* =====================================================
   MODAL
===================================================== */

.modal {

    position: fixed;

    inset: 0;

    background:
        rgba(0, 0, 0, .78);

    z-index: 200;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;
}


.modal.active {
    display: flex;
}


.modal-box {

    width: 100%;

    max-width: 430px;

    max-height: 82dvh;

    overflow-y: auto;

    background:
        #071215 !important;

    border:
        1px solid
        rgba(0, 238, 255, .25);

    border-radius: 20px;

    padding: 22px;

    box-shadow:
        0 20px 70px
        rgba(0, 0, 0, .65);

    color: #dffcff;
}


.modal-title {

    font-size: 16px;

    font-weight: 700;

    letter-spacing: 1px;

    margin-bottom: 18px;

    color: #00eaff;
}


.close-btn {

    float: right;

    border: 0;

    background: transparent;

    color: #78969b;

    font-size: 20px;

    cursor: pointer;
}


/* =====================================================
   HATA KARTLARI
===================================================== */

.error-card {

    border:
        1px solid
        rgba(255, 90, 90, .22);

    background:
        rgba(255, 60, 60, .045);

    border-radius: 14px;

    padding: 13px;

    margin-bottom: 10px;
}


.error-top {

    display: flex;

    justify-content: space-between;

    gap: 8px;

    margin-bottom: 7px;
}


.error-provider {

    color: #ff8f8f;

    font-size: 12px;

    font-weight: 700;
}


.error-time {

    color: #60787d;

    font-size: 9px;
}


.error-type {

    display: inline-block;

    padding:
        3px 7px;

    border-radius: 6px;

    background:
        rgba(255, 90, 90, .12);

    color: #ff9f9f;

    font-size: 9px;

    margin-bottom: 8px;
}


.error-text {

    font-family:
        monospace;

    font-size: 11px;

    line-height: 1.5;

    color: #d6bebe;

    white-space: pre-wrap;

    word-break: break-word;
}


.clear-errors {

    width: 100%;

    padding: 13px;

    border-radius: 12px;

    border:
        1px solid
        rgba(255, 80, 80, .3);

    background:
        rgba(255, 60, 60, .08);

    color: #ff9b9b;

    margin-bottom: 15px;

    cursor: pointer;
}


/* =====================================================
   PEMBE SİNEM TEMASI
===================================================== */

body.sinem-theme {

    background:
        radial-gradient(
            circle at 50% 35%,
            #270c1c 0%,
            #090208 55%,
            #000 100%
        ) !important;
}


body.sinem-theme .app {

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(255, 100, 190, .035),
            transparent 45%
        ),
        #090208;
}


body.sinem-theme .header {

    background:
        rgba(9, 2, 8, .97) !important;

    border-bottom-color:
        rgba(255, 90, 180, .22);
}


body.sinem-theme .brand-main,
body.sinem-theme .brand-sub,
body.sinem-theme .hero h1 {

    color: #ff8bc7;

    text-shadow:
        0 0 14px
        rgba(255, 80, 170, .4);
}


body.sinem-theme .logo {

    color: #ff72bd;

    border-color:
        rgba(255, 100, 190, .8);

    box-shadow:
        0 0 35px
        rgba(255, 70, 170, .2);
}


body.sinem-theme .logo::before,
body.sinem-theme .logo::after {

    border-color:
        rgba(255, 100, 190, .35);
}


body.sinem-theme .input-area {

    background:
        rgba(9, 2, 8, .98) !important;

    border-top-color:
        rgba(255, 90, 180, .18);
}


body.sinem-theme .send {

    background: #ff72bd;

    color: #240716;
}


/* =====================================================
   MOBİL
===================================================== */

@media (max-width: 480px) {

    .header {
        height: 70px;
        min-height: 70px;
    }

    .brand-main {
        font-size: 18px;
        letter-spacing: 3px;
    }

    .hero {
        padding-top: 20px;
    }

    .logo {
        width: 88px;
        height: 88px;
        font-size: 36px;
    }

    .hero h1 {
        font-size: 20px;
    }

    .message {
        max-width: 92%;
    }
}


/* =====================================================
   MASAÜSTÜ
===================================================== */

@media (min-width: 700px) {

    .chat {

        width: 100%;

        max-width: 720px;

        margin: auto;
    }

    .input-area {

        max-width: 720px;

        width: 100%;

        margin: auto;
    }
}

</style>

</head>


<body>

<div class="app">


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-title">
            J.A.R.V.I.S. SYSTEM
        </div>


        <button
            class="sidebar-item"
            onclick="newChat()"
        >
            <span class="icon">＋</span>
            Yeni Sohbet
        </button>


        <button
            class="sidebar-item"
            onclick="openErrors()"
        >
            <span class="icon">⚠️</span>
            Hatalar
        </button>


        <button
            class="sidebar-item"
            onclick="openProfile()"
        >
            <span class="icon">👤</span>
            Profil Değiştir
        </button>


        <button
            class="sidebar-item"
            onclick="toggleFunMode()"
        >
            <span class="icon">⚡</span>
            Eğlence Modu
        </button>


        <div class="sidebar-bottom">

            KARAHAN INC.<br>

            J.A.R.V.I.S. v18.0.0

        </div>

    </aside>


    <div
        class="overlay"
        id="overlay"
        onclick="closeSidebar()"
    ></div>


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="header">

        <button
            class="menu-btn"
            onclick="openSidebar()"
        >
            ☰
        </button>


        <div class="brand">

            <div class="brand-main">
                J.A.R.V.I.S.
            </div>

            <div class="brand-sub">
                KARAHAN INC.
            </div>

        </div>


        <div class="status">

            <span class="status-dot"></span>

            ONLINE

        </div>

    </header>


    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="main">


        <section class="hero">

            <div class="logo">
                K
            </div>


            <h1 id="greeting">
                Merhaba efendim
            </h1>


            <p id="subtitle">
                JARVIS sizin için hazır.
            </p>

        </section>


        <section
            class="chat"
            id="chat"
        ></section>


        <div class="input-area">

            <input
                id="messageInput"
                class="input"
                type="text"
                autocomplete="off"
                placeholder="JARVIS'e bir şey sorun..."
            >


            <button
                class="send"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

    </main>

</div>


<!-- =====================================================
     PROFİL MODAL
===================================================== -->

<div
    class="modal"
    id="profileModal"
>

    <div class="modal-box">

        <button
            class="close-btn"
            onclick="closeModal('profileModal')"
        >
            ×
        </button>


        <div class="modal-title">
            PROFİL DEĞİŞTİR
        </div>


        <input
            id="profileUsername"
            class="input"
            placeholder="Kullanıcı adı"
            style="
                width:100%;
                margin-bottom:10px;
            "
        >


        <input
            id="profilePassword"
            class="input"
            type="password"
            placeholder="Şifre"
            style="
                width:100%;
                margin-bottom:10px;
            "
        >


        <button
            class="send"
            style="
                width:100%;
                height:48px;
            "
            onclick="loginProfile()"
        >
            GİRİŞ YAP
        </button>


        <div
            id="loginError"
            style="
                color:#ff8d8d;
                font-size:12px;
                margin-top:12px;
            "
        ></div>

    </div>

</div>


<!-- =====================================================
     HATA MODAL
===================================================== -->

<div
    class="modal"
    id="errorsModal"
>

    <div class="modal-box">

        <button
            class="close-btn"
            onclick="closeModal('errorsModal')"
        >
            ×
        </button>


        <div class="modal-title">
            ⚠️ HATA KAYITLARI
        </div>


        <button
            class="clear-errors"
            onclick="clearErrors()"
        >
            🗑 TÜM HATALARI TEMİZLE
        </button>


        <div id="errorList">

            <div
                style="
                    color:#617d82;
                    font-size:12px;
                    text-align:center;
                "
            >
                Hatalar yükleniyor...
            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   DEĞİŞKENLER
===================================================== */

let currentUser =
    localStorage.getItem(
        "jarvis_user"
    ) || "karahan";


let funMode = false;


/* =====================================================
   ELEMENTLER
===================================================== */

const chat =
    document.getElementById(
        "chat"
    );


const input =
    document.getElementById(
        "messageInput"
    );


/* =====================================================
   SIDEBAR
===================================================== */

function openSidebar() {

    document
        .getElementById("sidebar")
        .classList
        .add("open");

    document
        .getElementById("overlay")
        .classList
        .add("active");
}


function closeSidebar() {

    document
        .getElementById("sidebar")
        .classList
        .remove("open");

    document
        .getElementById("overlay")
        .classList
        .remove("active");
}


/* =====================================================
   MODAL
===================================================== */

function closeModal(id) {

    document
        .getElementById(id)
        .classList
        .remove("active");
}


function openProfile() {

    closeSidebar();

    document
        .getElementById(
            "profileModal"
        )
        .classList
        .add("active");
}


/* =====================================================
   MESAJ
===================================================== */

function addMessage(
    text,
    type = "assistant"
) {

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "message " + type;

    element.textContent =
        text;

    chat.appendChild(
        element
    );

    chat.scrollTop =
        chat.scrollHeight;

    return element;
}


/* =====================================================
   BEKLEME MESAJLARI
===================================================== */

function waitingMessage() {

    if (
        currentUser === "sinem"
    ) {

        const messages = [

            "Bir saniye prenses, düşünüyorum... ❤️",

            "Hemen bakıyorum prenses... 🌸",

            "Bir dakika prenses, JARVIS çalışıyor...",

            "Tamam prenses, cevabı hazırlıyorum... ❤️"

        ];

        return messages[
            Math.floor(
                Math.random() *
                messages.length
            )
        ];
    }


    if (
        currentUser === "betul"
    ) {

        const messages = [

            "Aşko bir saniye, beynimi çalıştırıyorum... 🧠😂",

            "Dur kız, bunu da hemen bilmemi bekleme. 😂",

            "Tamam tamam, düşünüyorum kız. 😂",

            "Bir dakika aşko, işlemcim çalışıyor..."

        ];

        return messages[
            Math.floor(
                Math.random() *
                messages.length
            )
        ];
    }


    return "Efendim, işlem yapıyorum...";
}


/* =====================================================
   CHAT
===================================================== */

async function sendMessage() {

    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    addMessage(
        message,
        "user"
    );


    input.value = "";


    const waiting =
        addMessage(
            waitingMessage(),
            "assistant"
        );


    try {

        const response =
            await fetch(
                "/chat",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message:
                            message,

                        username:
                            currentUser

                    })

                }
            );


        const data =
            await response.json();


        waiting.remove();


        if (!response.ok) {

            const errorText =
                data.error ||
                data.detail ||
                data.message ||
                "Bilinmeyen hata.";


            addMessage(

                "⚠️ J.A.R.V.I.S. HATA\n\n" +
                errorText +
                "\n\n" +
                "Hata kaydı Hatalar bölümüne kaydedildi.",

                "error"
            );

            return;
        }


        addMessage(
            data.answer,
            "assistant"
        );


    } catch (error) {

        waiting.remove();


        addMessage(

            "⚠️ BAĞLANTI HATASI\n\n" +
            error.message +
            "\n\n" +
            "Sunucuya ulaşılamıyor.",

            "error"
        );

    }

}


/* =====================================================
   ENTER
===================================================== */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);


/* =====================================================
   HATALAR
===================================================== */

async function openErrors() {

    closeSidebar();


    document
        .getElementById(
            "errorsModal"
        )
        .classList
        .add("active");


    await loadErrors();
}


async function loadErrors() {

    const list =
        document.getElementById(
            "errorList"
        );


    list.innerHTML =
        `
        <div style="
            color:#617d82;
            text-align:center;
            font-size:12px;
            padding:20px;
        ">
            Hatalar yükleniyor...
        </div>
        `;


    try {

        const response =
            await fetch(
                "/errors"
            );


        const data =
            await response.json();


        if (
            !data.errors ||
            data.errors.length === 0
        ) {

            list.innerHTML =
                `
                <div style="
                    text-align:center;
                    color:#617d82;
                    padding:25px;
                    font-size:12px;
                ">
                    ✓ Henüz kayıtlı hata yok.
                </div>
                `;

            return;
        }


        list.innerHTML = "";


        data.errors.forEach(
            error => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "error-card";


                card.innerHTML = `

                    <div class="error-top">

                        <div class="error-provider">

                            ${escapeHtml(
                                error.provider
                            )}

                        </div>

                        <div class="error-time">

                            ${escapeHtml(
                                error.time
                            )}

                        </div>

                    </div>


                    <div class="error-type">

                        ${escapeHtml(
                            error.type
                        )}

                    </div>


                    <div class="error-text">

                        ${escapeHtml(
                            error.error
                        )}

                    </div>

                `;


                list.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        list.innerHTML =
            `
            <div style="
                color:#ff8d8d;
                font-size:12px;
            ">
                Hatalar yüklenemedi:
                ${escapeHtml(
                    error.message
                )}
            </div>
            `;
    }
}


/* =====================================================
   HATALARI TEMİZLE
===================================================== */

async function clearErrors() {

    const confirmed =
        confirm(
            "Tüm hata kayıtları silinsin mi?"
        );


    if (!confirmed) {
        return;
    }


    try {

        await fetch(
            "/errors",
            {
                method: "DELETE"
            }
        );


        await loadErrors();


    } catch (error) {

        alert(
            "Hatalar temizlenemedi: " +
            error.message
        );
    }
}


/* =====================================================
   HTML GÜVENLİĞİ
===================================================== */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(text ?? "");

    return div.innerHTML;
}


/* =====================================================
   YENİ SOHBET
===================================================== */

async function newChat() {

    closeSidebar();


    chat.innerHTML = "";


    addMessage(

        currentUser === "sinem"
            ? "Yeni sohbet hazır prenses. ❤️"
            : currentUser === "betul"
                ? "Tamam kız, yeni sohbet açtım. 😂"
                : "Yeni sohbet hazır efendim.",

    );


    try {

        await fetch(

            "/new-chat?username=" +

                currentUser
            ),

            {
                method: "POST"
            }

        );

    } catch (error) {

        console.log(
            "Yeni sohbet hatası:",
            error
        );
    }
}


/* =====================================================
   PROFİL GİRİŞ
===================================================== */

async function loginProfile() {

    const username =
        document
            .getElementById(
                "profileUsername"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "profilePassword"
            )
            .value;


    const loginError =
        document
            .getElementById(
                "loginError"
            );


    loginError.textContent = "";


    if (!username) {

        loginError.textContent =
            "Kullanıcı adı girin.";

        return;
    }


    try {

        const response =
            await fetch(
                "/profile-login",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        username:
                            username,

                        password:
                            password

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            loginError.textContent =
                data.error ||
                data.detail ||
                "Giriş başarısız.";

            return;
        }


        currentUser =
            data.username;


        localStorage.setItem(
            "jarvis_user",
            currentUser
        );


        applyUserTheme();


        closeModal(
            "profileModal"
        );


        chat.innerHTML = "";


        if (
            currentUser === "sinem"
        ) {

            addMessage(
                "Hoş geldiniz prenses. ❤️ JARVIS hazır. Bugün size nasıl yardımcı olabilirim?",
                "assistant"
            );

        } else if (
            currentUser === "betul"
        ) {

            addMessage(
                "Hoş geldin Betül. Tamam kız, yine geldin. 😂",
                "assistant"
            );

        } else {

            addMessage(
                "Tekrar hoş geldiniz efendim. JARVIS tüm sistemleri hazır durumda.",
                "assistant"
            );

        }


    } catch (error) {

        loginError.textContent =
            error.message;
    }
}


/* =====================================================
   TEMA
===================================================== */

function applyUserTheme() {

    const body =
        document.body;


    body.classList.remove(
        "sinem-theme"
    );


    const greeting =
        document.getElementById(
            "greeting"
        );


    const subtitle =
        document.getElementById(
            "subtitle"
        );


    if (
        currentUser === "sinem"
    ) {

        body.classList.add(
            "sinem-theme"
        );


        greeting.textContent =
            "Hoş geldiniz prenses";


        subtitle.textContent =
            "JARVIS sizin için hazır. ❤️";


    } else if (
        currentUser === "betul"
    ) {

        greeting.textContent =
            "Merhaba Betül";


        subtitle.textContent =
            "JARVIS hazır.";


    } else {

        greeting.textContent =
            "Merhaba efendim";


        subtitle.textContent =
            "JARVIS sizin için hazır.";
    }
}


/* =====================================================
   EĞLENCE MODU
===================================================== */

function toggleFunMode() {

    funMode =
        !funMode;


    closeSidebar();


    if (
        currentUser === "karahan"
    ) {

        addMessage(

            funMode
                ? "Eğlence modu açıldı efendim. Ancak profesyonel JARVIS protokolü korunuyor."
                : "Eğlence modu kapatıldı efendim.",

            "assistant"
        );

        return;
    }


    addMessage(

        funMode
            ? "Eğlence modu aktif. 😄"
            : "Eğlence modu kapatıldı.",

        "assistant"
    );
}

   BAŞLANGIÇ
===================================================== */

function initialize() {

    applyUserTheme();


    addMessage(

        currentUser === "sinem"
            ? "Hoş geldiniz prenses. ❤️ JARVIS hazır."
            : currentUser === "betul"
                ? "Hoş geldin Betül. JARVIS hazır. 😂"
                : "Merhaba efendim. JARVIS tüm sistemleri hazır durumda.",

        "assistant"
    );
}


initialize();
