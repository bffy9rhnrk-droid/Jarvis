<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>
<meta name="theme-color" content="#050b10">

<title>J.A.R.V.I.S. — KARAHAN INC.</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(0, 238, 255, 0.09),
            transparent 35%
        ),
        #03070a;

    color: #dffcff;

    overflow: hidden;

    transition:
        background 0.3s,
        color 0.3s;
}


/* ============================================================
   BACKGROUND
   ============================================================ */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(0, 220, 255, 0.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0, 220, 255, 0.025) 1px,
            transparent 1px
        );

    background-size: 35px 35px;

    opacity: 0.5;
}


/* ============================================================
   APP
   ============================================================ */

.app {

    position: relative;

    width: 100%;
    height: 100dvh;

    display: flex;
    flex-direction: column;
}


/* ============================================================
   HEADER
   ============================================================ */

.header {

    height: 75px;

    display: flex;
    align-items: center;

    padding: 0 18px;

    border-bottom:
        1px solid rgba(0, 238, 255, 0.15);

    background:
        rgba(3, 10, 14, 0.88);

    backdrop-filter: blur(16px);

    z-index: 20;
}

.menu-button {

    width: 45px;
    height: 45px;

    border:
        1px solid rgba(0, 238, 255, 0.3);

    border-radius: 12px;

    background:
        rgba(0, 238, 255, 0.05);

    color: #00eaff;

    font-size: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.brand {

    margin-left: 14px;
}

.brand-main {

    font-size: 19px;

    letter-spacing: 4px;

    font-weight: 700;

    color: #e9fdff;
}

.brand-sub {

    margin-top: 3px;

    font-size: 9px;

    letter-spacing: 3px;

    color: #00eaff;

    opacity: 0.8;
}

.status {

    margin-left: auto;

    display: flex;

    align-items: center;

    gap: 7px;

    font-size: 10px;

    letter-spacing: 1px;

    color: #72ffb2;
}

.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #72ffb2;

    box-shadow:
        0 0 10px #72ffb2;
}


/* ============================================================
   MAIN
   ============================================================ */

.main {

    flex: 1;

    position: relative;

    overflow: hidden;

    display: flex;
    flex-direction: column;
}


/* ============================================================
   HUD
   ============================================================ */

.hud {

    height: 260px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}

.hud-circle {

    position: relative;

    width: 180px;
    height: 180px;

    border-radius: 50%;

    border:
        1px solid rgba(0, 238, 255, 0.35);

    box-shadow:
        0 0 35px rgba(0, 238, 255, 0.08),
        inset 0 0 30px rgba(0, 238, 255, 0.04);

    display: flex;

    align-items: center;
    justify-content: center;

    animation:
        hudPulse 4s ease-in-out infinite;
}

.hud-circle::before {

    content: "";

    position: absolute;

    inset: 13px;

    border-radius: 50%;

    border:
        1px dashed rgba(0, 238, 255, 0.45);

    animation:
        rotateHud 18s linear infinite;
}

.hud-circle::after {

    content: "";

    position: absolute;

    inset: 30px;

    border-radius: 50%;

    border:
        1px solid rgba(0, 238, 255, 0.18);
}

.k-logo {

    position: relative;

    z-index: 2;

    font-size: 64px;

    font-weight: 800;

    color: #00eaff;

    text-shadow:
        0 0 10px rgba(0, 238, 255, 0.8),
        0 0 35px rgba(0, 238, 255, 0.35);
}

@keyframes rotateHud {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes hudPulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.025);
    }
}


/* ============================================================
   CHAT
   ============================================================ */

.chat {

    flex: 1;

    overflow-y: auto;

    padding:
        5px 15px 15px;

    scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {

    width: 4px;
}

.chat::-webkit-scrollbar-thumb {

    background:
        rgba(0, 238, 255, 0.25);

    border-radius: 10px;
}


/* ============================================================
   MESSAGE
   ============================================================ */

.message {

    max-width: 88%;

    margin-bottom: 13px;

    padding: 13px 15px;

    border-radius: 15px;

    font-size: 14px;

    line-height: 1.55;

    white-space: pre-wrap;

    word-break: break-word;

    animation:
        messageIn 0.25s ease;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(7px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.user {

    margin-left: auto;

    background:
        rgba(0, 238, 255, 0.10);

    border:
        1px solid rgba(0, 238, 255, 0.18);

    color: #e9fdff;
}

.message.jarvis {

    margin-right: auto;

    background:
        rgba(255, 255, 255, 0.035);

    border:
        1px solid rgba(255, 255, 255, 0.08);

    color: #dffcff;
}

.message.error {

    margin-right: auto;

    background:
        rgba(255, 55, 75, 0.08);

    border:
        1px solid rgba(255, 55, 75, 0.5);

    color: #ff9ca8;

    box-shadow:
        0 0 20px rgba(255, 55, 75, 0.08);
}


/* ============================================================
   INPUT
   ============================================================ */

.input-area {

    padding:
        10px 12px calc(12px + env(safe-area-inset-bottom));

    border-top:
        1px solid rgba(0, 238, 255, 0.12);

    background:
        rgba(3, 10, 14, 0.94);

    backdrop-filter: blur(16px);

    display: flex;

    gap: 9px;

    z-index: 10;
}

.input {

    flex: 1;

    min-width: 0;

    height: 48px;

    padding: 0 15px;

    border:
        1px solid rgba(0, 238, 255, 0.2);

    border-radius: 14px;

    outline: none;

    background:
        rgba(0, 238, 255, 0.04);

    color: white;

    font-size: 16px;

    -webkit-appearance: none;
}

.input::placeholder {

    color:
        rgba(220, 250, 255, 0.38);
}

.input:focus {

    border-color:
        rgba(0, 238, 255, 0.55);

    box-shadow:
        0 0 18px rgba(0, 238, 255, 0.08);
}

.send {

    width: 48px;
    height: 48px;

    flex-shrink: 0;

    border: none;

    border-radius: 14px;

    background:
        #00dff5;

    color: #001014;

    font-size: 19px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 0 18px rgba(0, 238, 255, 0.18);
}

.send:disabled {

    opacity: 0.45;

    cursor: default;
}


/* ============================================================
   SIDEBAR
   ============================================================ */

.sidebar {

    position: fixed;

    top: 0;
    left: 0;

    width: 285px;
    height: 100dvh;

    z-index: 100;

    transform:
        translateX(-105%);

    transition:
        transform 0.3s ease;

    background:
        rgba(4, 12, 17, 0.97);

    border-right:
        1px solid rgba(0, 238, 255, 0.2);

    backdrop-filter: blur(20px);

    padding: 25px 18px;
}

.sidebar.open {

    transform:
        translateX(0);
}

.sidebar-title {

    font-size: 11px;

    letter-spacing: 3px;

    color: #00eaff;

    margin-bottom: 25px;
}

.sidebar-item {

    width: 100%;

    padding: 14px;

    margin-bottom: 9px;

    border:
        1px solid rgba(0, 238, 255, 0.1);

    border-radius: 12px;

    background:
        rgba(0, 238, 255, 0.035);

    color: #dffcff;

    text-align: left;

    font-size: 13px;

    cursor: pointer;
}

.sidebar-item:hover {

    border-color:
        rgba(0, 238, 255, 0.4);
}

.overlay {

    position: fixed;

    inset: 0;

    z-index: 90;

    background:
        rgba(0, 0, 0, 0.55);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.3s;
}

.overlay.show {

    opacity: 1;

    pointer-events: auto;
}


/* ============================================================
   LIGHT MODE
   ============================================================ */

body.light {

    background:
        #eef7f9;

    color: #092027;
}

body.light .header {

    background:
        rgba(245, 252, 253, 0.92);
}

body.light .brand-main {

    color: #092027;
}

body.light .message.jarvis {

    color: #092027;

    background:
        rgba(0, 0, 0, 0.04);
}

body.light .input-area {

    background:
        rgba(245, 252, 253, 0.95);
}

body.light .input {

    color: #092027;

    background:
        rgba(0, 0, 0, 0.03);
}

body.light .sidebar {

    background:
        rgba(245, 252, 253, 0.98);

    color: #092027;
}


/* ============================================================
   THINKING
   ============================================================ */

.thinking {

    display: inline-flex;

    gap: 5px;

    align-items: center;
}

.thinking span {

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #00eaff;

    animation:
        thinking 1.2s infinite;
}

.thinking span:nth-child(2) {

    animation-delay: 0.15s;
}

.thinking span:nth-child(3) {

    animation-delay: 0.3s;
}

@keyframes thinking {

    0%,
    70%,
    100% {
        opacity: 0.25;
        transform: translateY(0);
    }

    35% {
        opacity: 1;
        transform: translateY(-3px);
    }
}

</style>
</head>


<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside
        id="sidebar"
        class="sidebar"
    >

        <div class="sidebar-title">
            SİSTEM AĞI
        </div>

        <button
            class="sidebar-item"
            onclick="showMemory()"
        >
            🧠 Bellek
        </button>

        <button
            class="sidebar-item"
            onclick="checkHealth()"
        >
            ◉ Sistem Durumu
        </button>

        <button
            class="sidebar-item"
            onclick="toggleTheme()"
        >
            ◐ Gece / Gündüz
        </button>

        <button
            class="sidebar-item"
            onclick="clearChat()"
        >
            × Sohbeti Temizle
        </button>

    </aside>

    <div
        id="overlay"
        class="overlay"
        onclick="closeMenu()"
    ></div>


    <!-- HEADER -->

    <header class="header">

        <button
            class="menu-button"
            onclick="toggleMenu()"
        >
            ☰
        </button>

        <div class="brand">

            <div class="brand-main">
                J.A.R.V.I.S.
            </div>

            <div class="brand-sub">
                KARAHAN INC. OS v9.0
            </div>

        </div>

        <div class="status">

            <span class="status-dot" id="statusDot"></span>

            <span id="statusText">
                ONLINE
            </span>

        </div>

    </header>


    <!-- MAIN -->

    <main class="main">

        <section class="hud">

            <div class="hud-circle">

                <div class="k-logo">
                    K
                </div>

            </div>

        </section>


        <!-- CHAT -->

        <section
            id="chat"
            class="chat"
        >

            <div class="message jarvis">
                Merhaba efendim. Ben J.A.R.V.I.S. Nasıl yardımcı olabilirim?
            </div>

        </section>


        <!-- INPUT -->

        <div class="input-area">

            <input
                id="messageInput"
                class="input"
                type="text"
                autocomplete="off"
                autocorrect="on"
                spellcheck="true"
                placeholder="J.A.R.V.I.S.'e bir şey sorun..."
                onkeydown="handleKey(event)"
            >

            <button
                id="sendButton"
                class="send"
                onclick="sendMessage()"
            >
                ↑
            </button>

        </div>

    </main>

</div>


<script>

/* ============================================================
   ELEMENTS
   ============================================================ */

const chat = document.getElementById("chat");

const input = document.getElementById(
    "messageInput"
);

const sendButton = document.getElementById(
    "sendButton"
);

const sidebar = document.getElementById(
    "sidebar"
);

const overlay = document.getElementById(
    "overlay"
);

const statusText = document.getElementById(
    "statusText"
);

const statusDot = document.getElementById(
    "statusDot"
);

let isSending = false;


/* ============================================================
   MENU
   ============================================================ */

function toggleMenu() {

    sidebar.classList.toggle("open");

    overlay.classList.toggle(
        "show"
    );
}

function closeMenu() {

    sidebar.classList.remove(
        "open"
    );

    overlay.classList.remove(
        "show"
    );
}


/* ============================================================
   MESSAGE
   ============================================================ */

function addMessage(
    text,
    type = "jarvis"
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;

    return message;
}


/* ============================================================
   THINKING
   ============================================================ */

function addThinking() {

    const message =
        document.createElement("div");

    message.className =
        "message jarvis";

    message.id =
        "thinkingMessage";

    message.innerHTML = `
        <div class="thinking">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


function removeThinking() {

    const thinking =
        document.getElementById(
            "thinkingMessage"
        );

    if (thinking) {
        thinking.remove();
    }
}


/* ============================================================
   STATUS
   ============================================================ */

function setOnline() {

    statusText.textContent =
        "ONLINE";

    statusDot.style.background =
        "#72ffb2";

    statusDot.style.boxShadow =
        "0 0 10px #72ffb2";
}


function setOffline() {

    statusText.textContent =
        "ERROR";

    statusDot.style.background =
        "#ff566b";

    statusDot.style.boxShadow =
        "0 0 10px #ff566b";
}


/* ============================================================
   SEND
   ============================================================ */

async function sendMessage() {

    if (isSending) {
        return;
    }

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    isSending = true;

    sendButton.disabled = true;

    addMessage(
        message,
        "user"
    );

    input.value = "";

    addThinking();

    try {

        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })
                }
            );

        removeThinking();


        /* ====================================================
           HTTP ERROR
           ==================================================== */

        if (!response.ok) {

            let errorData = null;

            try {
                errorData =
                    await response.json();
            } catch (_) {
                errorData = null;
            }

            let errorText =
                "⚠️ J.A.R.V.I.S. HATA\n\n";

            errorText +=
                "HTTP Hata Kodu: " +
                response.status +
                "\n\n";

            if (
                errorData &&
                errorData.response
            ) {

                errorText +=
                    errorData.response;

            } else {

                errorText +=
                    "Sunucu HTTP " +
                    response.status +
                    " hatası döndürdü.";
            }

            addMessage(
                errorText,
                "error"
            );

            setOffline();

            return;
        }


        /* ====================================================
           JSON
           ==================================================== */

        let data;

        try {

            data =
                await response.json();

        } catch (error) {

            addMessage(
                "⚠️ J.A.R.V.I.S. HATA\n\n" +
                "Hata kodu: INVALID_JSON\n\n" +
                "Sunucudan geçerli JSON alınamadı.\n\n" +
                "Detay: " +
                error.message,
                "error"
            );

            setOffline();

            return;
        }


        /* ====================================================
           BACKEND ERROR
           ==================================================== */

        if (
            data.status === "error"
        ) {

            let errorText =
                data.response ||
                "⚠️ J.A.R.V.I.S. HATA";

            /*
             * Backend zaten hata kodunu gönderiyorsa
             * aynen göster.
             */

            if (
                data.error_code &&
                !errorText.includes(
                    data.error_code
                )
            ) {

                errorText +=
                    "\n\nHata kodu: " +
                    data.error_code;
            }

            if (
                data.error_detail &&
                !errorText.includes(
                    data.error_detail
                )
            ) {

                errorText +=
                    "\n\nTeknik detay:\n" +
                    data.error_detail;
            }

            addMessage(
                errorText,
                "error"
            );

            setOffline();

            return;
        }


        /* ====================================================
           SUCCESS
           ==================================================== */

        if (
            typeof data.response !==
            "string"
        ) {

            addMessage(
                "⚠️ J.A.R.V.I.S. HATA\n\n" +
                "Hata kodu: INVALID_RESPONSE\n\n" +
                "Sunucu geçerli bir cevap göndermedi.",
                "error"
            );

            setOffline();

            return;
        }

        addMessage(
            data.response,
            "jarvis"
        );

        setOnline();

    } catch (error) {

        removeThinking();

        /*
         * FETCH gerçekten başarısız olduysa
         * gerçek JavaScript hata bilgisini göster.
         */

        addMessage(
            "⚠️ J.A.R.V.I.S. HATA\n\n" +
            "Hata kodu: FRONTEND_FETCH_ERROR\n\n" +
            "Detay:\n" +
            error.message,
            "error"
        );

        setOffline();

        console.error(
            "JARVIS FETCH ERROR:",
            error
        );

    } finally {

        isSending = false;

        sendButton.disabled =
            false;

        input.focus();
    }
}


/* ============================================================
   ENTER
   ============================================================ */

function handleKey(event) {

    if (
        event.key === "Enter"
        && !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();
    }
}


/* ============================================================
   HEALTH
   ============================================================ */

async function checkHealth() {

    closeMenu();

    try {

        const response =
            await fetch("/health");

        const data =
            await response.json();

        if (
            data.status === "online"
        ) {

            addMessage(
                "🟢 SİSTEM DURUMU\n\n" +
                "Sunucu: ONLINE\n" +
                "J.A.R.V.I.S. sürümü: " +
                data.version +
                "\n" +
                "Model: " +
                data.model +
                "\n" +
                "Groq API: " +
                (
                    data.groq_configured
                    ? "BAĞLI"
                    : "BAĞLI DEĞİL"
                ),
                "jarvis"
            );

            setOnline();

        } else {

            addMessage(
                "⚠️ J.A.R.V.I.S. HATA\n\n" +
                "Health endpoint beklenmeyen cevap verdi:\n" +
                JSON.stringify(data),
                "error"
            );

            setOffline();
        }

    } catch (error) {

        addMessage(
            "⚠️ J.A.R.V.I.S. HATA\n\n" +
            "Hata kodu: HEALTH_CHECK_ERROR\n\n" +
            "Detay:\n" +
            error.message,
            "error"
        );

        setOffline();
    }
}


/* ============================================================
   MEMORY
   ============================================================ */

async function showMemory() {

    closeMenu();

    try {

        const response =
            await fetch("/memory");

        const data =
            await response.json();

        if (
            data.status !== "success"
        ) {

            throw new Error(
                JSON.stringify(data)
            );
        }

        const memory =
            data.memory || {};

        addMessage(
            "🧠 J.A.R.V.I.S. BELLEĞİ\n\n" +
            JSON.stringify(
                memory,
                null,
                2
            ),
            "jarvis"
        );

    } catch (error) {

        addMessage(
            "⚠️ J.A.R.V.I.S. HATA\n\n" +
            "Hata kodu: MEMORY_ERROR\n\n" +
            "Detay:\n" +
            error.message,
            "error"
        );
    }
}


/* ============================================================
   CLEAR CHAT
   ============================================================ */

function clearChat() {

    closeMenu();

    chat.innerHTML = "";

    addMessage(
        "Sohbet ekranı temizlendi efendim.",
        "jarvis"
    );
}


/* ============================================================
   THEME
   ============================================================ */

function toggleTheme() {

    document.body.classList.toggle(
        "light"
    );

    const light =
        document.body.classList.contains(
            "light"
        );

    localStorage.setItem(
        "jarvis-theme",
        light
            ? "light"
            : "dark"
    );

    closeMenu();
}


function loadTheme() {

    const theme =
        localStorage.getItem(
            "jarvis-theme"
        );

    if (theme === "light") {

        document.body.classList.add(
            "light"
        );
    }
}


/* ============================================================
   INITIAL HEALTH CHECK
   ============================================================ */

async function initialHealthCheck() {

    try {

        const response =
            await fetch(
                "/health",
                {
                    cache: "no-store"
                }
            );

        if (response.ok) {

            const data =
                await response.json();

            if (
                data.status === "online"
            ) {

                setOnline();

                return;
            }
        }

    } catch (_) {}

    setOffline();
}


/* ============================================================
   START
   ============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadTheme();

        initialHealthCheck();

        input.focus();
    }
);

</script>

</body>
</html>
