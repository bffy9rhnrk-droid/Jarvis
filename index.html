<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    name="theme-color"
    content="#020708"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<meta
    name="apple-mobile-web-app-title"
    content="K.A.R.V.I.S."
>

<link
    rel="apple-touch-icon"
    href="/icon.png"
>

<link
    rel="icon"
    type="image/png"
    href="/icon.png"
>

<title>
K.A.R.V.I.S. - KARAHAN INC.
</title>


<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #020708 !important;

    color: #e9ffff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


body {
    overflow: hidden;
}


button,
input {
    font: inherit;
}


button {
    cursor: pointer;
}


/* ============================================================
   APP
   ============================================================ */

.app {

    width: 100%;

    height: 100vh;
    height: 100dvh;

    display: flex;
    flex-direction: column;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(0,255,255,.08),
            transparent 35%
        ),
        #020708 !important;
}


/* ============================================================
   HEADER
   ============================================================ */

.header {

    height: 70px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 18px;

    background:
        rgba(2,7,8,.98) !important;

    border-bottom:
        1px solid rgba(0,255,255,.15);

    z-index: 10;
}


.brand {

    display: flex;

    align-items: center;

    gap: 12px;
}


.logo-mini {

    width: 42px;
    height: 42px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    border:
        1px solid #00ffff;

    color: #00ffff;

    box-shadow:
        0 0 10px rgba(0,255,255,.35),
        inset 0 0 12px rgba(0,255,255,.1);

    font-weight: 800;

    font-size: 18px;
}


.brand-title {

    font-size: 16px;

    font-weight: 800;

    letter-spacing: 2px;
}


.brand-subtitle {

    margin-top: 2px;

    font-size: 9px;

    letter-spacing: 3px;

    color: #6a9295;
}


.header-right {

    display: flex;

    align-items: center;

    gap: 8px;
}


.status {

    font-size: 9px;

    letter-spacing: 1px;

    color: #54ffb1;
}


.menu-button {

    width: 42px;
    height: 42px;

    border:
        1px solid rgba(0,255,255,.25);

    border-radius: 12px;

    background:
        rgba(0,255,255,.04);

    color: #00ffff;

    font-size: 20px;
}


/* ============================================================
   MAIN
   ============================================================ */

.main {

    position: relative;

    flex: 1;

    overflow: hidden;

    background:
        #020708 !important;
}


.hero {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    padding-top: 45px;

    overflow-y: auto;

    padding-bottom: 140px;

    background:
        #020708 !important;
}


/* ============================================================
   KARVIS CORE
   ============================================================ */

.jarvis-orb {

    position: relative;

    width: 190px;
    height: 190px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 24px;
}


.ring {

    position: absolute;

    border-radius: 50%;

    border:
        1px solid rgba(0,255,255,.45);
}


.ring.one {

    width: 190px;
    height: 190px;

    animation:
        spin 15s linear infinite;
}


.ring.two {

    width: 160px;
    height: 160px;

    border-style: dashed;

    animation:
        spinReverse 11s linear infinite;
}


.ring.three {

    width: 125px;
    height: 125px;

    box-shadow:
        0 0 25px rgba(0,255,255,.3),
        inset 0 0 25px rgba(0,255,255,.15);
}


.core {

    width: 70px;
    height: 70px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    border:
        2px solid #00ffff;

    color: #00ffff;

    font-size: 28px;

    font-weight: 900;

    box-shadow:
        0 0 25px rgba(0,255,255,.45),
        inset 0 0 20px rgba(0,255,255,.15);

    animation:
        pulse 2.5s infinite;
}


.hero-title {

    font-size: 26px;

    font-weight: 800;

    letter-spacing: 5px;

    margin-bottom: 4px;
}


.hero-subtitle {

    font-size: 9px;

    letter-spacing: 4px;

    color: #63878a;
}


/* ============================================================
   CHAT
   ============================================================ */

.chat {

    width:
        min(720px, 92%);

    margin-top: 25px;

    display: flex;

    flex-direction: column;

    gap: 12px;
}


.message {

    padding:
        14px 16px;

    border-radius: 15px;

    max-width: 92%;

    line-height: 1.55;

    font-size: 14px;

    white-space: pre-wrap;
}


.message.jarvis {

    align-self: flex-start;

    border:
        1px solid rgba(0,255,255,.15);

    background:
        rgba(0,255,255,.035);

    color: #d9ffff;
}


.message.user {

    align-self: flex-end;

    background:
        rgba(255,255,255,.06);

    border:
        1px solid rgba(255,255,255,.08);

    color: white;
}


/* ============================================================
   INPUT
   ============================================================ */

.input-area {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 12px;

    background:
        linear-gradient(
            to top,
            #020708 75%,
            transparent
        ) !important;

    z-index: 5;
}


.input-box {

    width:
        min(720px, 100%);

    margin: auto;

    display: flex;

    gap: 8px;

    padding: 8px;

    border:
        1px solid rgba(0,255,255,.22);

    border-radius: 17px;

    background:
        rgba(3,12,14,.98) !important;

    box-shadow:
        0 0 20px rgba(0,255,255,.05);
}


.input-box input {

    flex: 1;

    min-width: 0;

    border: none;

    outline: none;

    background: transparent;

    color: white;

    padding: 12px;

    font-size: 16px;
}


.send-button {

    width: 48px;
    height: 48px;

    flex-shrink: 0;

    border: none;

    border-radius: 13px;

    background:
        #00d9d9;

    color:
        #001010;

    font-weight: 900;
}


.send-button:disabled {
    opacity: .35;
}


/* ============================================================
   SIDEBAR
   ============================================================ */

.sidebar {

    position: fixed;

    top: 0;

    left: -290px;

    width: 280px;

    height: 100vh;

    padding: 22px;

    background:
        #030a0c !important;

    border-right:
        1px solid rgba(0,255,255,.18);

    z-index: 100;

    transition:
        left .25s ease;
}


.sidebar.open {
    left: 0;
}


.sidebar-title {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;
}


.sidebar-title strong {

    letter-spacing: 3px;
}


.close-sidebar {

    border: none;

    background: transparent;

    color: #00ffff;

    font-size: 22px;
}


.menu-item {

    width: 100%;

    padding: 14px;

    margin-bottom: 9px;

    text-align: left;

    border:
        1px solid rgba(0,255,255,.1);

    border-radius: 12px;

    background:
        rgba(0,255,255,.025);

    color: #d9ffff;

    font-size: 13px;
}


.menu-item:hover {

    border-color:
        rgba(0,255,255,.35);
}


/* ============================================================
   MODAL
   ============================================================ */

.modal {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 18px;

    background:
        rgba(0,0,0,.72);

    z-index: 200;
}


.modal.show {
    display: flex;
}


.modal-box {

    width:
        min(600px, 100%);

    max-height: 85vh;

    overflow-y: auto;

    padding: 20px;

    border:
        1px solid rgba(0,255,255,.2);

    border-radius: 20px;

    background:
        #041012 !important;
}


.modal-title {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 18px;
}


.modal-title h2 {

    margin: 0;

    font-size: 17px;

    letter-spacing: 2px;
}


.modal-close {

    border: none;

    background: transparent;

    color: #00ffff;

    font-size: 22px;
}


.modal input {

    width: 100%;

    padding: 13px;

    margin-bottom: 10px;

    border:
        1px solid rgba(0,255,255,.18);

    border-radius: 10px;

    background:
        #020708 !important;

    color: white;

    outline: none;
}


.modal-action {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 10px;

    background:
        #00d9d9;

    color:
        #001010;

    font-weight: 800;
}


/* ============================================================
   ERROR
   ============================================================ */

.error-card {

    padding: 13px;

    margin-bottom: 10px;

    border-radius: 12px;

    background:
        rgba(255,70,70,.04);

    border:
        1px solid rgba(255,80,80,.16);
}


.error-top {

    display: flex;

    justify-content: space-between;

    gap: 8px;

    font-size: 10px;

    margin-bottom: 7px;
}


.error-provider {

    color: #ff7373;

    font-weight: 800;
}


.error-type {

    color: #ffbd6b;
}


.error-time {

    color: #668487;
}


.error-message {

    color: #d7eeee;

    font-size: 12px;

    margin-bottom: 7px;
}


.error-detail {

    color: #80999b;

    font-size: 10px;

    word-break: break-word;
}


.clear-errors {

    width: 100%;

    padding: 12px;

    margin-top: 8px;

    border:
        1px solid rgba(255,70,70,.3);

    border-radius: 10px;

    background:
        rgba(255,70,70,.06);

    color:
        #ff8a8a;
}


/* ============================================================
   SINEM
   ============================================================ */

body.sinem-mode .core,
body.sinem-mode .ring {

    border-color:
        #ff6fae;
}


body.sinem-mode .core {

    color:
        #ff6fae;

    box-shadow:
        0 0 30px rgba(255,105,170,.45);
}


body.sinem-mode .ring {

    border-color:
        rgba(255,105,170,.5);
}


body.sinem-mode .send-button {

    background:
        #ff72b2;
}


/* ============================================================
   EĞLENCE
   ============================================================ */

body.fun-mode .core,
body.fun-mode .ring {

    border-color:
        #ff3030;
}


body.fun-mode .core {

    color:
        #ff3030;

    box-shadow:
        0 0 30px rgba(255,40,40,.5);
}


body.fun-mode .ring {

    border-color:
        rgba(255,40,40,.55);
}


/* ============================================================
   ANIMASYON
   ============================================================ */

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


@keyframes spinReverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}


@keyframes pulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }
}

</style>

</head>

<script>


const API = "";


let currentUser = "karahan";


let funMode = false;


let sending = false;


/* ============================================================
   SIDEBAR
============================================================ */

function openSidebar() {

    document
        .getElementById("sidebar")
        .classList
        .add("open");
}


function closeSidebar() {

    document
        .getElementById("sidebar")
        .classList
        .remove("open");
}


/* ============================================================
   MESAJ
============================================================ */

function addMessage(
    text,
    type
) {

    const chat =
        document.getElementById("chat");


    const div =
        document.createElement("div");


    div.className =
        "message " + type;


    div.textContent =
        text;


    chat.appendChild(div);


    const hero =
        document.querySelector(".hero");


    hero.scrollTop =
        hero.scrollHeight;
}


/* ============================================================
   MESAJ GÖNDER
============================================================ */

async function sendMessage() {

    if (sending) {
        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    sending = true;

    button.disabled = true;


    input.value = "";


    addMessage(
        message,
        "user"
    );


    let waitingMessages = [

        "Bir saniye efendim...",

        "Tamam, bir bakıyorum...",

        "Dur, bunu birlikte çözelim...",

        "Bir dakika, düşünüyorum...",

        "Tamam, hemen ilgileniyorum..."

    ];


    if (currentUser === "betul") {

        waitingMessages = [

            "Aşko bir saniye, beynimi çalıştırıyorum... 🧠😂",

            "Dur kız, düşünüyorum. 😂",

            "Tamam tamam, bakıyorum.",

            "Bir dakika aşko, işlemciyi çalıştırıyorum..."

        ];
    }


    if (currentUser === "sinem") {

        waitingMessages = [

            "Bir saniye prenses, hemen bakıyorum... 💗",

            "Tamam prenses, düşünüyorum...",

            "Bir dakika, hemen ilgileniyorum. 💗"

        ];
    }


    const waiting =
        document.createElement("div");


    waiting.className =
        "message jarvis";


    waiting.textContent =
        waitingMessages[
            Math.floor(
                Math.random()
                * waitingMessages.length
            )
        ];


    document
        .getElementById("chat")
        .appendChild(waiting);


    try {

        const response =
            await fetch(
                API + "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message,
                        username: currentUser
                    })
                }
            );


        const data =
            await response.json();


        waiting.remove();


        if (!response.ok) {

            let errorText =
                "Bilinmeyen hata.";

            let errorType =
                "";


            if (
                data
                && data.detail
            ) {

                if (
                    typeof data.detail === "string"
                ) {

                    errorText =
                        data.detail;

                } else {

                    errorText =
                        data.detail.error
                        || data.detail.message
                        || errorText;

                    errorType =
                        data.detail.type
                        || "";
                }
            }


            addMessage(
                "⚠️ K.A.R.V.I.S. HATA\n\n"
                + errorText
                + (
                    errorType
                        ? "\n\nHata tipi: "
                          + errorType
                        : ""
                )
                + "\n\nHata kaydı Hatalar bölümüne kaydedildi.",
                "jarvis"
            );


            return;
        }


        /*
         * Burada özellikle provider göstermiyoruz.
         *
         * Arka planda hangi AI cevap verirse versin
         * kullanıcı sadece K.A.R.V.I.S. ile konuşuyor.
         */

        addMessage(
            data.answer,
            "jarvis"
        );


        document
            .getElementById("statusText")
            .textContent =
            "ONLINE";


    } catch (error) {

        waiting.remove();


        addMessage(
            "⚠️ K.A.R.V.I.S.\n\n"
            + "Sunucuya bağlanırken bir sorun oluştu.\n\n"
            + error.message,
            "jarvis"
        );


    } finally {

        sending = false;

        button.disabled = false;

        input.focus();
    }
}


/* ============================================================
   ENTER
============================================================ */

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
                && !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );


/* ============================================================
   YENI SOHBET
============================================================ */

async function newChat() {

    closeSidebar();


    try {

        await fetch(
            API
            + "/new-chat?username="
            + encodeURIComponent(
                currentUser
            ),
            {
                method: "POST"
            }
        );

    } catch (error) {
    }


    document
        .getElementById("chat")
        .innerHTML = "";


    showGreeting();
}


/* ============================================================
   GREETING
============================================================ */

function showGreeting() {

    const chat =
        document.getElementById("chat");


    if (
        chat.children.length > 0
    ) {
        return;
    }


    let greeting =
        "Merhaba efendim. K.A.R.V.I.S. hazır.";


    if (currentUser === "betul") {

        greeting =
            "Merhaba Betül. 😏 K.A.R.V.I.S. hazır.";
    }


    if (currentUser === "sinem") {

        greeting =
            "Hoş geldiniz prenses. 💗 K.A.R.V.I.S. hazır.";
    }


    addMessage(
        greeting,
        "jarvis"
    );
}


/* ============================================================
   HATALAR
============================================================ */

async function openErrors() {

    closeSidebar();


    document
        .getElementById("errorModal")
        .classList
        .add("show");


    await loadErrors();
}


function closeErrors() {

    document
        .getElementById("errorModal")
        .classList
        .remove("show");
}


async function loadErrors() {

    const list =
        document.getElementById(
            "errorList"
        );


    list.innerHTML =
        "Yükleniyor...";


    try {

        const response =
            await fetch(
                API + "/errors"
            );


        const data =
            await response.json();


        const errors =
            data.errors || [];


        if (
            errors.length === 0
        ) {

            list.innerHTML =
                "<div style='color:#6d8b8e;font-size:13px;'>Henüz hata kaydı yok.</div>";

            return;
        }


        list.innerHTML = "";


        [...errors]
            .reverse()
            .forEach(
                error => {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "error-card";


                    card.innerHTML = `

                        <div class="error-top">

                            <span class="error-provider">
                                ${escapeHtml(
                                    error.provider
                                )}
                            </span>

                            <span class="error-type">
                                ${escapeHtml(
                                    error.type
                                )}
                            </span>

                            <span class="error-time">
                                ${escapeHtml(
                                    error.time
                                )}
                            </span>

                        </div>

                        <div class="error-message">
                            ${escapeHtml(
                                error.message || ""
                            )}
                        </div>

                        <div class="error-detail">
                            ${escapeHtml(
                                error.error || ""
                            )}
                        </div>

                    `;


                    list.appendChild(
                        card
                    );
                }
            );


    } catch (error) {

        list.innerHTML =
            "Hatalar yüklenemedi.";
    }
}


async function clearErrors() {

    if (
        !confirm(
            "Tüm hata kayıtları silinsin mi?"
        )
    ) {
        return;
    }


    try {

        await fetch(
            API + "/errors",
            {
                method: "DELETE"
            }
        );


        await loadErrors();


    } catch (error) {

        alert(
            "Hatalar temizlenemedi."
        );
    }
}


/* ============================================================
   PROFIL
============================================================ */

function openProfile() {

    closeSidebar();


    document
        .getElementById("profileModal")
        .classList
        .add("show");
}


function closeProfile() {

    document
        .getElementById("profileModal")
        .classList
        .remove("show");
}


async function loginProfile() {

    const usernameInput =
        document.getElementById(
            "profileUsername"
        );


    const passwordInput =
        document.getElementById(
            "profilePassword"
        );


    const errorBox =
        document.getElementById(
            "profileError"
        );


    let username =
        usernameInput.value
            .trim()
            .toLowerCase();


    if (
        username === "betül"
    ) {
        username = "betul";
    }


    const password =
        passwordInput.value;


    errorBox.textContent =
        "";


    try {

        const response =
            await fetch(
                API + "/profile-login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            errorBox.textContent =
                data.detail
                || "Giriş başarısız.";

            return;
        }


        currentUser =
            data.username;


        localStorage.setItem(
            "karvis_user",
            currentUser
        );


        applyUserTheme();


        document
            .getElementById("chat")
            .innerHTML = "";


        closeProfile();


        showGreeting();


    } catch (error) {

        errorBox.textContent =
            "Sunucu bağlantı hatası.";
    }
}


/* ============================================================
   TEMA
============================================================ */

function applyUserTheme() {

    document.body
        .classList
        .remove(
            "sinem-mode"
        );


    if (
        currentUser === "sinem"
    ) {

        document.body
            .classList
            .add("sinem-mode");
    }
}


/* ============================================================
   EGLENCE
============================================================ */

function toggleFunMode() {

    closeSidebar();


    funMode =
        !funMode;


    document.body
        .classList
        .toggle(
            "fun-mode",
            funMode
        );


    if (funMode) {

        addMessage(
            "Eğlence modu aktif. K.A.R.V.I.S. biraz daha rahat takılabilir. 😈",
            "jarvis"
        );


    } else {

        addMessage(
            "Eğlence modu kapatıldı. Standart K.A.R.V.I.S. sistemine dönüldü.",
            "jarvis"
        );
    }
}


/* ============================================================
   GUVENLIK
============================================================ */

function escapeHtml(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* ============================================================
   BASLANGIC
============================================================ */

function initialize() {

    const savedUser =
        localStorage.getItem(
            "karvis_user"
        );


    if (
        savedUser
        && (
            savedUser === "karahan"
            || savedUser === "betul"
            || savedUser === "sinem"
        )
    ) {

        currentUser =
            savedUser;
    }


    applyUserTheme();

    showGreeting();
}


initialize();

</script>
