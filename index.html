<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>
J.A.R.V.I.S. — KARAHAN INC.
</title>


<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}


html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #02060a;

    color: #ffffff;
}


body.light {

    background: #eef5f8;

    color: #111111;
}


button,
input,
textarea {

    font-family: inherit;
}


button {

    cursor: pointer;
}


.app {

    position: relative;

    width: 100%;

    height: 100%;

    overflow: hidden;
}


/* =====================================================
BACKGROUND
===================================================== */

.background {

    position: absolute;

    inset: 0;

    pointer-events: none;

    overflow: hidden;
}


.grid {

    position: absolute;

    inset: -50%;

    background-image:

        linear-gradient(
            rgba(0,220,255,.035) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,220,255,.035) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    transform:
        perspective(500px)
        rotateX(55deg);
}


.glow {

    position: absolute;

    width: 450px;

    height: 450px;

    left: 50%;

    top: 40%;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background:
        rgba(0,210,255,.08);

    filter: blur(90px);
}


/* =====================================================
HEADER
===================================================== */

.header {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 82px;

    z-index: 20;

    display: flex;

    align-items: center;

    padding: 15px 18px;

    border-bottom:
        1px solid
        rgba(0,220,255,.12);

    background:
        rgba(2,7,11,.72);

    backdrop-filter:
        blur(18px);
}


body.light .header {

    background:
        rgba(240,248,250,.85);
}


.menu-btn {

    width: 48px;

    height: 48px;

    border:
        1px solid
        rgba(0,220,255,.28);

    background:
        rgba(0,220,255,.05);

    color: #00d9ff;

    border-radius: 15px;

    font-size: 23px;
}


.brand {

    margin-left: 14px;

    line-height: 1;
}


.brand-title {

    font-size: 22px;

    font-weight: 700;

    letter-spacing: 2px;
}


.brand-subtitle {

    margin-top: 6px;

    font-size: 9px;

    letter-spacing: 3px;

    color: #00d9ff;
}


.user-mini {

    margin-left: auto;

    display: flex;

    align-items: center;

    gap: 8px;
}


.user-dot {

    width: 9px;

    height: 9px;

    border-radius: 50%;

    background: #00e5ff;

    box-shadow:
        0 0 12px #00e5ff;
}


.user-mini-name {

    max-width: 115px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 11px;

    color: #8ca4ad;
}


/* =====================================================
MAIN
===================================================== */

.main {

    position: relative;

    z-index: 2;

    width: 100%;

    height: 100%;

    padding-top: 82px;

    padding-bottom: 94px;

    display: flex;

    flex-direction: column;

    align-items: center;
}


.logo-area {

    flex: 0 0 auto;

    margin-top: 42px;

    text-align: center;
}


.logo {

    position: relative;

    width: 145px;

    height: 145px;

    margin: auto;

    display: flex;

    justify-content: center;

    align-items: center;
}


.logo-core {

    width: 76px;

    height: 76px;

    border:
        2px solid #00ddff;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #00ddff;

    font-size: 35px;

    font-weight: 700;

    box-shadow:
        0 0 15px rgba(0,220,255,.6),

        inset 0 0 18px
        rgba(0,220,255,.15);

    animation:
        pulse 2.6s infinite;
}


.ring {

    position: absolute;

    border:
        1px solid
        rgba(0,220,255,.35);

    border-radius: 50%;
}


.ring1 {

    inset: 18px;

    animation:
        spin 8s linear infinite;
}


.ring2 {

    inset: 4px;

    border-style: dashed;

    animation:
        spinReverse 12s linear infinite;
}


.ring3 {

    inset: -10px;

    border-color:
        rgba(0,220,255,.12);
}


@keyframes pulse {

    0%,
    100% {

        box-shadow:
            0 0 15px
            rgba(0,220,255,.45),

            inset 0 0 18px
            rgba(0,220,255,.1);
    }

    50% {

        box-shadow:
            0 0 35px
            rgba(0,220,255,.8),

            inset 0 0 25px
            rgba(0,220,255,.2);
    }
}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }
}


@keyframes spinReverse {

    to {
        transform: rotate(-360deg);
    }
}


.status {

    margin-top: 23px;

    font-size: 10px;

    letter-spacing: 3px;

    color: #00d9ff;
}


.greeting {

    margin-top: 8px;

    font-size: 18px;

    font-weight: 500;
}


/* =====================================================
CHAT
===================================================== */

.chat {

    width: 100%;

    max-width: 850px;

    flex: 1;

    overflow-y: auto;

    padding:
        20px 18px;

    scroll-behavior: smooth;
}


.chat::-webkit-scrollbar {

    width: 3px;
}


.chat::-webkit-scrollbar-thumb {

    background:
        rgba(0,220,255,.3);
}


.message {

    max-width: 86%;

    margin-bottom: 14px;

    padding:
        13px 16px;

    border-radius: 18px;

    line-height: 1.5;

    font-size: 14px;

    white-space: pre-wrap;

    word-break: break-word;
}


.message.jarvis {

    margin-right: auto;

    border:
        1px solid
        rgba(0,220,255,.14);

    background:
        rgba(0,220,255,.055);

    color: #d7faff;
}


.message.user {

    margin-left: auto;

    background:
        rgba(0,220,255,.12);

    border:
        1px solid
        rgba(0,220,255,.2);
}


/* =====================================================
INPUT
===================================================== */

.input-area {

    position: absolute;

    bottom: 15px;

    left: 12px;

    right: 12px;

    z-index: 10;

    max-width: 850px;

    margin: auto;
}


.input-box {

    min-height: 62px;

    display: flex;

    align-items: center;

    gap: 8px;

    padding:
        8px 9px
        8px 17px;

    border:
        1px solid
        rgba(0,220,255,.22);

    border-radius: 22px;

    background:
        rgba(5,13,18,.88);

    backdrop-filter:
        blur(18px);
}


#messageInput {

    flex: 1;

    min-width: 0;

    border: none;

    outline: none;

    resize: none;

    background: transparent;

    color: inherit;

    font-size: 16px;

    line-height: 1.4;

    max-height: 100px;
}


#messageInput::placeholder {

    color: #6d8088;
}


.send-btn {

    width: 46px;

    height: 46px;

    flex-shrink: 0;

    border: none;

    border-radius: 15px;

    background: #00d9ff;

    color: #001015;

    font-size: 20px;

    font-weight: 700;
}


/* =====================================================
SIDEBAR
===================================================== */

.overlay {

    position: fixed;

    inset: 0;

    z-index: 50;

    background:
        rgba(0,0,0,.55);

    backdrop-filter:
        blur(3px);

    display: none;
}


.overlay.active {

    display: block;
}


.sidebar {

    position: fixed;

    top: 0;

    left: 0;

    z-index: 60;

    width:
        min(320px,88vw);

    height: 100%;

    padding: 25px 18px;

    transform:
        translateX(-105%);

    transition:
        transform .3s ease;

    background:
        rgba(3,10,14,.97);

    border-right:
        1px solid
        rgba(0,220,255,.16);

    backdrop-filter:
        blur(25px);
}


.sidebar.active {

    transform:
        translateX(0);
}


.sidebar-head {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 30px;
}


.sidebar-title {

    font-size: 18px;

    letter-spacing: 2px;
}


.close-btn {

    width: 40px;

    height: 40px;

    border:
        1px solid
        rgba(0,220,255,.18);

    background: transparent;

    color: #00d9ff;

    border-radius: 12px;

    font-size: 20px;
}


.profile-card {

    padding: 16px;

    border:
        1px solid
        rgba(0,220,255,.13);

    border-radius: 17px;

    background:
        rgba(0,220,255,.04);

    margin-bottom: 20px;
}


.profile-name {

    font-weight: 600;
}


.profile-role {

    margin-top: 5px;

    color: #71878e;

    font-size: 12px;
}


.menu-item {

    width: 100%;

    padding: 15px;

    margin-bottom: 10px;

    text-align: left;

    border:
        1px solid
        rgba(0,220,255,.11);

    border-radius: 16px;

    background:
        rgba(255,255,255,.025);

    color: #ffffff;
}


.menu-item-title {

    font-size: 14px;
}


.menu-item-sub {

    margin-top: 5px;

    color: #72868d;

    font-size: 11px;
}


.settings {

    margin-top: 25px;

    padding-top: 20px;

    border-top:
        1px solid
        rgba(0,220,255,.1);
}


.setting-title {

    margin-bottom: 12px;

    font-size: 11px;

    letter-spacing: 2px;

    color: #00d9ff;
}


.setting-row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 13px;

    font-size: 13px;
}


.toggle {

    width: 48px;

    height: 27px;

    border-radius: 20px;

    border:
        1px solid
        rgba(0,220,255,.2);

    background: #172126;

    position: relative;
}


.toggle span {

    position: absolute;

    width: 21px;

    height: 21px;

    border-radius: 50%;

    top: 2px;

    left: 3px;

    background: #68787d;

    transition: .25s;
}


.toggle.active {

    background:
        rgba(0,220,255,.2);
}


.toggle.active span {

    left: 22px;

    background: #00d9ff;

    box-shadow:
        0 0 10px
        rgba(0,220,255,.7);
}


/* =====================================================
MODAL
===================================================== */

.modal {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    justify-content: center;

    align-items: center;

    padding: 20px;

    background:
        rgba(0,0,0,.7);

    backdrop-filter:
        blur(12px);
}


.modal.active {

    display: flex;
}


.modal-box {

    width:
        min(390px,100%);

    padding: 28px 22px;

    border-radius: 25px;

    border:
        1px solid
        rgba(0,220,255,.22);

    background: #071116;
}


.modal-logo {

    width: 60px;

    height: 60px;

    margin:
        0 auto 18px;

    border-radius: 50%;

    border:
        1px solid
        #00d9ff;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #00d9ff;

    font-size: 25px;
}


.modal-title {

    text-align: center;

    font-size: 19px;

    letter-spacing: 1px;
}


.modal-subtitle {

    margin-top: 8px;

    margin-bottom: 25px;

    text-align: center;

    color: #71858d;

    font-size: 12px;
}


.field {

    margin-bottom: 13px;
}


.field label {

    display: block;

    margin-bottom: 7px;

    color: #7c929a;

    font-size: 11px;
}


.field input {

    width: 100%;

    height: 49px;

    padding:
        0 14px;

    border-radius: 14px;

    outline: none;

    border:
        1px solid
        rgba(0,220,255,.16);

    background:
        rgba(255,255,255,.04);

    color: #fff;

    font-size: 16px;
}


.login-btn {

    width: 100%;

    height: 50px;

    margin-top: 8px;

    border: none;

    border-radius: 15px;

    background: #00d9ff;

    color: #001015;

    font-weight: 700;
}


.modal-error {

    min-height: 18px;

    margin-top: 12px;

    text-align: center;

    color: #ff6674;

    font-size: 12px;
}


/* =====================================================
BETÜL
===================================================== */

body.betul-mode .logo-core {

    color: #ff5275;

    border-color: #ff5275;

    box-shadow:
        0 0 30px
        rgba(255,82,117,.7);
}


body.betul-mode .status {

    color: #ff5275;
}


body.betul-mode .ring {

    border-color:
        rgba(255,82,117,.4);
}


/* =====================================================
RESPONSIVE
===================================================== */

@media (max-height: 700px) {

    .logo-area {

        margin-top: 12px;
    }


    .logo {

        width: 115px;

        height: 115px;
    }


    .logo-core {

    }


    .ring1 {

        inset: 14px;
    }


    .ring2 {

    }


    .ring3 {

    }

}

</style>

</head>


<body>

<div class="app">


<div class="background">

    <div class="grid"></div>

</div>


<!-- =====================================================

    </div>

></textarea>

    onclick="sendMessage()"
>

</main>

OVERLAY

>

    </div>

    <button
        class="close-btn"
        onclick="closeSidebar()"
    >
        ×
    </button>

</div>


<div class="profile-card">

        class="profile-name"
        id="sideProfileName"
    >

    <div
        class="profile-role"

</div>

    class="menu-item"
    onclick="openProfileModal()"
>

    </div>

    </div>

</button>

</div>

PROFILE MODAL

>

    id="usernameInput"

>

    id="passwordInput"

    autocomplete="current-password"
>

</div>

<script>

/* =====================================================
STATE
===================================================== */

let currentUser = {

    username: "karahan",

    name: "KARAHAN INC.",

    role: "Ana Kullanıcı"

};


let funMode = false;

let waitingTimer = null;


/* =====================================================
BETÜL WAITING
===================================================== */

const betulWaitingMessages = [

    "Aşko bir saniye, beynimi çalıştırıyorum... 🧠😂",

    "Dur kız, bunu da hemen bilmemi bekleme. 😂",

    "Bir dakika aşko, işlemcim çalışıyor...",

    "Tamam tamam, düşünüyorum kız. 😂",

    "Aşko bekle, J.A.R.V.I.S. şu an düşünüyor...",

    "Bir saniye canım, bunu da çözüyorum. 😂",

    "Dur kız, her şeyi ben mi bileceğim? 😭",

    "Aşko bu soruyu beklemiyordum. Bir toparlanayım. 😂",

    "Düşünüyorum kız, üstüme gelme. 😂",

    "Tamam aşko, fanlar çalışıyor..."
];


/* =====================================================
ELEMENTS
===================================================== */

const chat =
    document.getElementById("chat");


const input =
    document.getElementById(
        "messageInput"
    );


const sidebar =
    document.getElementById(
        "sidebar"
    );


const overlay =
    document.getElementById(
        "overlay"
    );


const profileModal =
    document.getElementById(
        "profileModal"
    );


const modalError =
    document.getElementById(
        "modalError"
    );


const greeting =
    document.getElementById(
        "greeting"
    );


const miniUserName =
    document.getElementById(
        "miniUserName"
    );


const sideProfileName =
    document.getElementById(
        "sideProfileName"
    );


const sideProfileRole =
    document.getElementById(
        "sideProfileRole"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


/* =====================================================
START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        updateUserInterface();

        addMessage(
            "jarvis",
            "Merhaba efendim. J.A.R.V.I.S. hazır."
        );

        input.focus();

    }
);


/* =====================================================
SIDEBAR
===================================================== */

function openSidebar() {

    sidebar.classList.add(
        "active"
    );

    overlay.classList.add(
        "active"
    );
}


function closeSidebar() {

    sidebar.classList.remove(
        "active"
    );

    overlay.classList.remove(
        "active"
    );
}


/* =====================================================
PROFILE MODAL
===================================================== */

function openProfileModal() {

    closeSidebar();

    document.getElementById(
        "usernameInput"
    ).value = "";

    document.getElementById(
        "passwordInput"
    ).value = "";

    modalError.textContent = "";

    profileModal.classList.add(
        "active"
    );
}


function closeProfileModal() {

    profileModal.classList.remove(
        "active"
    );
}


/* =====================================================
LOGIN
===================================================== */

async function loginProfile() {

    const username =
        document.getElementById(
            "usernameInput"
        ).value.trim();


    const password =
        document.getElementById(
            "passwordInput"
        ).value;


    modalError.textContent =
        "Kontrol ediliyor...";


    try {

        const response =
            await fetch(
                "/profile-login",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            password:
                                password

                        })

                }
            );


        const data =
            await response.json();


        if (!data.success) {

            modalError.textContent =
                data.message ||
                "Kullanıcı adı veya şifre hatalı.";

            return;
        }


        currentUser =
            data.user;


        closeProfileModal();


        updateUserInterface();


        clearChat();


        if (
            currentUser.username ===
            "betul"
        ) {

            addMessage(
                "jarvis",
                "Aaa Betül geldi. Hoş geldin aşko. 😂"
            );

        } else {

            addMessage(
                "jarvis",
                "Tekrar hoş geldiniz efendim."
            );
        }


    } catch (error) {

        modalError.textContent =
            "Sunucuya bağlanılamadı.";
    }

}


/* =====================================================
UPDATE UI
===================================================== */

function updateUserInterface() {

    miniUserName.textContent =
        currentUser.name;


    sideProfileName.textContent =
        currentUser.name;


    sideProfileRole.textContent =
        currentUser.role;


    if (
        currentUser.username ===
        "betul"
    ) {

        document.body.classList.add(
            "betul-mode"
        );


        greeting.textContent =
            "Hoş geldin Betül 😏";


        statusText.textContent =
            "BETÜL MODE";


    } else {

        document.body.classList.remove(
            "betul-mode"
        );


        greeting.textContent =
            "Merhaba efendim";


        statusText.textContent =
            "SYSTEM ONLINE";
    }

}


/* =====================================================
MESSAGE
===================================================== */

function addMessage(
    type,
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message " + type;


    div.textContent =
        text;


    chat.appendChild(
        div
    );


    chat.scrollTop =
        chat.scrollHeight;
}


/* =====================================================
CLEAR CHAT
===================================================== */

function clearChat() {

    stopWaitingMessage();

    chat.innerHTML = "";
}


/* =====================================================
WAITING
===================================================== */

function startWaitingMessage() {

    stopWaitingMessage();


    /*
     * Sadece Betül için özel
     * bekleme mesajları.
     */

    if (
        currentUser.username !==
        "betul"
    ) {

        return;
    }


    let index =
        Math.floor(
            Math.random()
            * betulWaitingMessages.length
        );


    addMessage(
        "jarvis",
        betulWaitingMessages[index]
    );


    waitingTimer =
        setInterval(
            function() {

                if (
                    currentUser.username !==
                    "betul"
                ) {

                    return;
                }


                index =
                    Math.floor(
                        Math.random()
                        * betulWaitingMessages.length
                    );


                addMessage(
                    "jarvis",
                    betulWaitingMessages[index]
                );

            },
            2600
        );
}


function stopWaitingMessage() {

    if (waitingTimer) {

        clearInterval(
            waitingTimer
        );

        waitingTimer = null;
    }
}


/* =====================================================
SEND MESSAGE
===================================================== */

async function sendMessage() {

    const message =
        input.value.trim();


    if (!message) {

        return;
    }


    addMessage(
        "user",
        message
    );


    input.value = "";

    input.style.height =
        "auto";


    startWaitingMessage();


    try {

        const response =
            await fetch(
                "/chat",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            username:
                                currentUser.username

                        })

                }
            );


        const data =
            await response.json();


        stopWaitingMessage();


        if (!data.success) {

            addMessage(
                "jarvis",
                data.message ||
                "Şu anda cevap oluşturamadım."
            );

            return;
        }


        addMessage(
            "jarvis",
            data.answer
        );


    } catch (error) {

        stopWaitingMessage();


        addMessage(
            "jarvis",
            "Sunucuya bağlanırken bir problem oluştu."
        );
    }

}


/* =====================================================
ENTER
===================================================== */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
            &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);


/* =====================================================
TEXTAREA
===================================================== */

input.addEventListener(
    "input",
    function() {

        this.style.height =
            "auto";


        this.style.height =
            Math.min(
                this.scrollHeight,
                100
            ) + "px";
    }
);


/* =====================================================
THEME
===================================================== */

function toggleTheme() {

    document.body.classList.toggle(
        "light"
    );


    document
        .getElementById(
            "themeToggle"
        )
        .classList.toggle(
            "active"
        );
}


/* =====================================================
FUN MODE
===================================================== */

function toggleFunMode() {

    funMode =
        !funMode;


    document
        .getElementById(
            "funToggle"
        )
        .classList.toggle(
            "active"
        );


    /*
     * KARAHAN INC.:
     *
     * Bu ayar sadece arayüzü etkiler.
     * AI karakteri profesyonel kalır.
     */

    if (
        currentUser.username ===
        "karahan"
    ) {

        addMessage(
            "jarvis",

            funMode

                ? "Eğlence arayüzü aktif efendim. Yanıt karakterim profesyonel kalacaktır."

                : "Profesyonel moda geri dönüldü."
        );


        return;
    }


    /*
     * BETÜL
     */

    if (
        currentUser.username ===
        "betul"
    ) {

        addMessage(
            "jarvis",

            funMode

                ? "Tamam aşko, eğlenceyi açtık. 😂"

                : "Tamam kız, biraz ciddileşiyoruz."
        );
    }

}


/* =====================================================
ESC
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            closeSidebar();

            closeProfileModal();
        }

    }
);

</script>
