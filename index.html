<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050914">
<title>J.A.R.V.I.S. | Karahan Inc.</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #050914;
    --bg2: #08111f;
    --panel: rgba(10, 20, 35, 0.88);
    --panel2: rgba(15, 28, 48, 0.92);
    --text: #f4f8ff;
    --muted: #8291a8;
    --line: rgba(100, 180, 255, 0.16);
    --accent: #38bdf8;
    --accent2: #2563eb;
    --user: #12365a;
    --ai: rgba(12, 27, 45, 0.95);
    --shadow: 0 0 40px rgba(0, 150, 255, 0.12);
}

body.light {
    --bg: #eef4fa;
    --bg2: #dce8f5;
    --panel: rgba(255,255,255,.88);
    --panel2: rgba(255,255,255,.96);
    --text: #0b1728;
    --muted: #617086;
    --line: rgba(20,80,130,.15);
    --accent: #0284c7;
    --accent2: #2563eb;
    --user: #d7ecff;
    --ai: #ffffff;
    --shadow: 0 0 35px rgba(0,100,180,.10);
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 50% 35%, rgba(0,140,255,.13), transparent 28%),
        radial-gradient(circle at 10% 90%, rgba(37,99,235,.08), transparent 25%),
        linear-gradient(145deg, var(--bg), var(--bg2));
    transition: background .3s, color .3s;
}

/* BACKGROUND */

.grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .18;
    background-image:
        linear-gradient(rgba(56,189,248,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,189,248,.08) 1px, transparent 1px);
    background-size: 45px 45px;
    mask-image: linear-gradient(to bottom, transparent, black, transparent);
}

/* HEADER */

.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    z-index: 50;
    background: linear-gradient(
        to bottom,
        rgba(4,10,20,.92),
        rgba(4,10,20,.35),
        transparent
    );
}

body.light .header {
    background: linear-gradient(
        to bottom,
        rgba(238,244,250,.95),
        rgba(238,244,250,.45),
        transparent
    );
}

.menu-btn {
    width: 48px;
    height: 48px;
    border: 1px solid var(--line);
    border-radius: 15px;
    background: var(--panel);
    color: var(--text);
    font-size: 23px;
    cursor: pointer;
    backdrop-filter: blur(15px);
    box-shadow: var(--shadow);
}

.menu-btn:active {
    transform: scale(.94);
}

.brand {
    text-align: right;
}

.brand-main {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 4px;
}

.brand-sub {
    margin-top: 3px;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--accent);
}

/* SIDE MENU */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    backdrop-filter: blur(4px);
    z-index: 80;
    display: none;
}

.overlay.active {
    display: block;
}

.side-menu {
    position: fixed;
    top: 0;
    left: 0;
    width: 290px;
    max-width: 85%;
    height: 100%;
    background: var(--panel2);
    border-right: 1px solid var(--line);
    backdrop-filter: blur(25px);
    z-index: 100;
    transform: translateX(-105%);
    transition: transform .3s ease;
    padding: 28px 20px;
}

.side-menu.active {
    transform: translateX(0);
}

.menu-title {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--accent);
    margin-bottom: 8px;
}

.menu-logo {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 35px;
}

.menu-item {
    width: 100%;
    border: 1px solid var(--line);
    background: rgba(50,100,150,.08);
    color: var(--text);
    border-radius: 14px;
    padding: 16px;
    text-align: left;
    font-size: 15px;
    margin-bottom: 10px;
    cursor: pointer;
}

.menu-item:active {
    transform: scale(.98);
}

.close-menu {
    position: absolute;
    top: 20px;
    right: 20px;
    background: transparent;
    border: 0;
    color: var(--muted);
    font-size: 24px;
}

/* MAIN */

.main {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 85px 18px 125px;
}

/* JARVIS CORE */

.core-area {
    position: relative;
    width: 260px;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 15px;
}

.core-ring {
    position: absolute;
    width: 210px;
    height: 210px;
    border-radius: 50%;
    border: 1px solid rgba(56,189,248,.25);
    box-shadow:
        0 0 20px rgba(56,189,248,.12),
        inset 0 0 25px rgba(56,189,248,.08);
    animation: rotate 14s linear infinite;
}

.core-ring::before,
.core-ring::after {
    content: "";
    position: absolute;
    inset: 14px;
    border-radius: 50%;
    border: 1px dashed rgba(56,189,248,.25);
}

.core-ring::after {
    inset: 30px;
    border-style: solid;
    border-color: rgba(56,189,248,.18);
    animation: rotateReverse 8s linear infinite;
}

.core-ring-2 {
    position: absolute;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--accent);
    border-bottom-color: rgba(37,99,235,.4);
    animation: rotateReverse 5s linear infinite;
}

.core-center {
    width: 105px;
    height: 105px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle, rgba(56,189,248,.25), rgba(4,12,25,.95) 65%);
    border: 1px solid rgba(56,189,248,.55);
    box-shadow:
        0 0 35px rgba(56,189,248,.22),
        inset 0 0 30px rgba(56,189,248,.13);
}

.core-letter {
    font-size: 52px;
    font-weight: 800;
    color: #eaf8ff;
    text-shadow: 0 0 25px rgba(56,189,248,.8);
}

.status {
    position: absolute;
    bottom: 5px;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

@keyframes rotateReverse {
    to { transform: rotate(-360deg); }
}

/* CHAT */

.chat-container {
    width: min(700px, 100%);
    height: 280px;
    overflow-y: auto;
    padding: 5px 3px 15px;
    scrollbar-width: thin;
    scrollbar-color: var(--accent) transparent;
}

.message {
    width: fit-content;
    max-width: 88%;
    padding: 12px 15px;
    border-radius: 16px;
    margin: 8px 0;
    line-height: 1.45;
    font-size: 14px;
    animation: messageIn .25s ease;
    word-wrap: break-word;
}

.message.ai {
    background: var(--ai);
    border: 1px solid var(--line);
    margin-right: auto;
    border-bottom-left-radius: 4px;
}

.message.user {
    background: var(--user);
    border: 1px solid rgba(56,189,248,.2);
    margin-left: auto;
    border-bottom-right-radius: 4px;
}

.message-label {
    font-size: 8px;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 5px;
}

.message-text {
    color: var(--text);
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* INPUT */

.input-area {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    width: min(700px, calc(100% - 30px));
    z-index: 40;
}

.input-box {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
}

#messageInput {
    flex: 1;
    min-width: 0;
    height: 45px;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--text);
    padding: 0 12px;
    font-size: 15px;
}

#messageInput::placeholder {
    color: var(--muted);
}

.action-btn {
    width: 45px;
    height: 45px;
    flex-shrink: 0;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(56,189,248,.08);
    color: var(--text);
    cursor: pointer;
    font-size: 18px;
}

.send-btn {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: white;
    border: 0;
}

.action-btn:active {
    transform: scale(.92);
}

/* SETTINGS */

.settings {
    position: fixed;
    inset: 0;
    z-index: 120;
    background: var(--bg);
    display: none;
    overflow-y: auto;
    padding: 25px 20px 40px;
}

.settings.active {
    display: block;
}

.settings-header {
    max-width: 700px;
    margin: 0 auto 35px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.settings-title {
    font-size: 26px;
    font-weight: 700;
}

.back-btn {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    border-radius: 13px;
    padding: 11px 15px;
    cursor: pointer;
}

.setting-card {
    max-width: 700px;
    margin: 0 auto 15px;
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
}

.setting-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 7px;
}

.setting-description {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 15px;
}

.theme-buttons {
    display: flex;
    gap: 10px;
}

.theme-btn,
.address-btn {
    flex: 1;
    padding: 13px 10px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    cursor: pointer;
}

.theme-btn.active,
.address-btn.active {
    border-color: var(--accent);
    background: rgba(56,189,248,.1);
    color: var(--accent);
}

.custom-address {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.custom-address input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: transparent;
    color: var(--text);
    padding: 13px;
    outline: none;
}

.save-address {
    border: 0;
    border-radius: 12px;
    background: var(--accent2);
    color: white;
    padding: 0 17px;
}

/* LOADING */

.typing {
    display: inline-flex;
    gap: 4px;
    align-items: center;
}

.typing span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    animation: typing 1s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {
    0%, 60%, 100% {
        transform: translateY(0);
        opacity: .4;
    }
    30% {
        transform: translateY(-4px);
        opacity: 1;
    }
}

/* MOBILE */

@media (max-width: 600px) {

    .header {
        height: 68px;
        padding: 0 14px;
    }

    .brand-main {
        font-size: 16px;
        letter-spacing: 3px;
    }

    .brand-sub {
        font-size: 7px;
    }

    .menu-btn {
        width: 44px;
        height: 44px;
    }

    .main {
        padding-top: 70px;
        padding-bottom: 115px;
    }

    .core-area {
        width: 220px;
        height: 220px;
        margin-bottom: 0;
    }

    .core-ring {
        width: 180px;
        height: 180px;
    }

    .core-ring-2 {
        width: 140px;
        height: 140px;
    }

    .core-center {
        width: 90px;
        height: 90px;
    }

    .core-letter {
        font-size: 44px;
    }

    .chat-container {
        height: 300px;
    }

    .message {
        font-size: 13px;
        max-width: 92%;
    }

    .input-area {
        bottom: 12px;
        width: calc(100% - 20px);
    }

    .input-box {
        border-radius: 17px;
    }

    #messageInput {
        font-size: 14px;
    }

    .side-menu {
        width: 280px;
    }

    .theme-buttons,
    .address-buttons {
        flex-direction: column;
    }

    .custom-address {
        flex-direction: column;
    }

    .save-address {
        height: 45px;
    }
}
</style>
</head>

<body>

<div class="grid"></div>

<!-- HEADER -->
<header class="header">

    <button class="menu-btn" onclick="openMenu()">☰</button>

    <div class="brand">
        <div class="brand-main">J.A.R.V.I.S.</div>
        <div class="brand-sub">KARAHAN INC.</div>
    </div>

</header>

<!-- SIDE MENU -->
<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<aside class="side-menu" id="sideMenu">

    <button class="close-menu" onclick="closeMenu()">×</button>

    <div class="menu-title">KARAHAN INC.</div>
    <div class="menu-logo">JARVIS</div>

    <button class="menu-item" onclick="openSettings()">
        ⚙️ &nbsp; Ayarlar
    </button>

    <button class="menu-item" onclick="goHome()">
        ◉ &nbsp; Ana Ekran
    </button>

</aside>

<!-- MAIN -->
<main class="main" id="main">

    <!-- CORE -->
    <section class="core-area">

        <div class="core-ring"></div>
        <div class="core-ring-2"></div>

        <div class="core-center">
            <div class="core-letter">K</div>
        </div>

        <div class="status">
            SYSTEM ONLINE
        </div>

    </section>

    <!-- CHAT -->
    <section class="chat-container" id="messages">

        <!-- AÇILIŞ MESAJI -->
        <div class="message ai">
            <div class="message-label">J.A.R.V.I.S.</div>
            <div class="message-text">
                Merhaba Efendim, nasıl yardımcı olabilirim?
            </div>
        </div>

    </section>

</main>

<!-- INPUT -->
<div class="input-area">

    <div class="input-box">

        <input
            id="messageInput"
            type="text"
            placeholder="JARVIS'e bir şey sorun..."
            autocomplete="off"
        >

        <button
            class="action-btn send-btn"
            onclick="sendMessage()"
            id="sendButton"
        >
            ➤
        </button>

    </div>

</div>

<!-- SETTINGS -->
<section class="settings" id="settings">

    <div class="settings-header">

        <div class="settings-title">
            Ayarlar
        </div>

        <button class="back-btn" onclick="closeSettings()">
            ← Geri
        </button>

    </div>

    <!-- TEMA -->
    <div class="setting-card">

        <div class="setting-title">
            Görünüm
        </div>

        <div class="setting-description">
            JARVIS'in görünümünü gece veya gündüz moduna ayarlayın.
        </div>

        <div class="theme-buttons">

            <button
                class="theme-btn"
                id="darkBtn"
                onclick="setTheme('dark')"
            >
                🌙 Gece
            </button>

            <button
                class="theme-btn"
                id="lightBtn"
                onclick="setTheme('light')"
            >
                ☀️ Gündüz
            </button>

        </div>

    </div>

    <!-- HİTAP -->
    <div class="setting-card">

        <div class="setting-title">
            Hitap şekli
        </div>

        <div class="setting-description">
            JARVIS'in size nasıl hitap edeceğini belirleyin.
            Varsayılan hitap şekli "Efendim"dir.
        </div>

        <div class="theme-buttons">

            <button
                class="address-btn"
                onclick="setAddress('Efendim')"
                id="addressEfendim"
            >
                Efendim
            </button>

            <button
                class="address-btn"
                onclick="setAddress('Komutanım')"
                id="addressKomutan"
            >
                Komutanım
            </button>

            <button
                class="address-btn"
                onclick="setAddress('Patron')"
                id="addressPatron"
            >
                Patron
            </button>

        </div>

        <div class="custom-address">

            <input
                id="customAddress"
                type="text"
                placeholder="Özel hitap yazın..."
            >

            <button
                class="save-address"
                onclick="saveCustomAddress()"
            >
                Kaydet
            </button>

        </div>

    </div>

</section>

<script>

/* =========================
   DEĞİŞKENLER
========================= */

const messages = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");

let address = localStorage.getItem("jarvis_address") || "Efendim";
let theme = localStorage.getItem("jarvis_theme") || "dark";


/* =========================
   SAYFA AÇILIŞI
========================= */

applyTheme(theme);
updateAddressButtons();


/* =========================
   MENÜ
========================= */

function openMenu() {
    document.getElementById("sideMenu").classList.add("active");
    document.getElementById("overlay").classList.add("active");
}

function closeMenu() {
    document.getElementById("sideMenu").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");
}

function goHome() {
    closeMenu();
    closeSettings();
}


/* =========================
   AYARLAR
========================= */

function openSettings() {

    closeMenu();

    document.getElementById("settings").classList.add("active");

    updateAddressButtons();
}

function closeSettings() {

    document.getElementById("settings").classList.remove("active");
}


/* =========================
   TEMA
========================= */

function setTheme(selectedTheme) {

    theme = selectedTheme;

    localStorage.setItem("jarvis_theme", theme);

    applyTheme(theme);
}

function applyTheme(selectedTheme) {

    if (selectedTheme === "light") {
        document.body.classList.add("light");
    } else {
        document.body.classList.remove("light");
    }

    document.getElementById("darkBtn").classList.toggle(
        "active",
        selectedTheme === "dark"
    );

    document.getElementById("lightBtn").classList.toggle(
        "active",
        selectedTheme === "light"
    );
}


/* =========================
   HİTAP
========================= */

function setAddress(newAddress) {

    address = newAddress;

    localStorage.setItem(
        "jarvis_address",
        address
    );

    updateAddressButtons();
}

function saveCustomAddress() {

    const value = document
        .getElementById("customAddress")
        .value
        .trim();

    if (!value) return;

    setAddress(value);

    document.getElementById("customAddress").value = "";
}

function updateAddressButtons() {

    document
        .getElementById("addressEfendim")
        .classList.toggle(
            "active",
            address === "Efendim"
        );

    document
        .getElementById("addressKomutan")
        .classList.toggle(
            "active",
            address === "Komutanım"
        );

    document
        .getElementById("addressPatron")
        .classList.toggle(
            "active",
            address === "Patron"
        );
}


/* =========================
   MESAJ EKLE
========================= */

function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    if (type === "ai") {

        message.innerHTML = `
            <div class="message-label">J.A.R.V.I.S.</div>
            <div class="message-text"></div>
        `;

    } else {

        message.innerHTML = `
            <div class="message-text"></div>
        `;
    }

    message.querySelector(".message-text").textContent = text;

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;

    return message;
}


/* =========================
   YAZIYOR ANİMASYONU
========================= */

function addTyping() {

    const message = document.createElement("div");

    message.className = "message ai";

    message.id = "typingMessage";

    message.innerHTML = `
        <div class="message-label">J.A.R.V.I.S.</div>

        <div class="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;
}


/* =========================
   CHAT
========================= */

async function sendMessage() {

    const message = input.value.trim();

    if (!message) return;

    addMessage(message, "user");

    input.value = "";

    sendButton.disabled = true;

    addTyping();

    try {

        /*
         * MEVCUT AI BAĞLANTIN KORUNUYOR.
         * /chat endpointine mesaj gönderiliyor.
         */

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                message: message,

                /*
                 * JARVIS'e tercih edilen hitap şeklini
                 * de gönderiyoruz.
                 */

                address: address

            })

        });

        if (!response.ok) {
            throw new Error("Sunucu hatası");
        }

        const data = await response.json();

        const typing = document.getElementById("typingMessage");

        if (typing) {
            typing.remove();
        }

        /*
         * Mevcut backend'in:
         *
         * data.response
         *
         * yapısını koruyoruz.
         */

        const reply =
            data.response ||
            "Üzgünüm Efendim, şu anda yanıt oluşturamadım.";

        addMessage(reply, "ai");

    } catch (error) {

        console.error(error);

        const typing = document.getElementById("typingMessage");

        if (typing) {
            typing.remove();
        }

        addMessage(
            "Bağlantıda bir sorun oluştu Efendim.",
            "ai"
        );

    } finally {

        sendButton.disabled = false;

        input.focus();
    }
}


/* =========================
   ENTER İLE GÖNDER
========================= */
