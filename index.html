<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>K.A.R.V.I.S. - KARAHAN INC.</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #02070a;
    color: white;
}

body {
    background:
        radial-gradient(
            circle at center,
            rgba(0, 229, 255, 0.09),
            transparent 38%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(0, 229, 255, 0.035),
            transparent 45%
        ),
        #02070a;

    transition:
        background 0.3s ease;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
    -webkit-appearance: none;
}

button:active {
    transform: scale(0.97);
}


/* =====================================================
   HEADER
===================================================== */

.header {
    height: 72px;

    display: flex;
    align-items: center;

    padding: 0 16px;

    border-bottom:
        1px solid rgba(0, 229, 255, 0.15);

    background:
        rgba(2, 7, 10, 0.92);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    position: relative;
    z-index: 10;
}

.logo-small {
    width: 44px;
    height: 44px;

    border-radius: 50%;

    border:
        2px solid #00e5ff;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #00e5ff;

    font-size: 21px;
    font-weight: 800;

    box-shadow:
        0 0 12px rgba(0, 229, 255, 0.5),
        inset 0 0 12px rgba(0, 229, 255, 0.12);

    animation:
        logoPulse 3s ease-in-out infinite;
}

.brand {
    margin-left: 12px;
}

.brand-title {
    font-size: 18px;
    font-weight: 800;

    letter-spacing: 2px;
}

.brand-subtitle {
    color:
        rgba(255, 255, 255, 0.5);

    font-size: 9px;

    letter-spacing: 3px;

    margin-top: 2px;
}

.online {
    margin-left: 10px;

    font-size: 9px;

    color: #00e5ff;

    letter-spacing: 0.5px;
}

.menu-button {
    margin-left: auto;

    width: 44px;
    height: 44px;

    border:
        1px solid rgba(0, 229, 255, 0.25);

    border-radius: 14px;

    background:
        rgba(0, 229, 255, 0.05);

    color: #00e5ff;

    font-size: 22px;

    transition:
        0.2s ease;
}

.menu-button:hover {
    background:
        rgba(0, 229, 255, 0.12);
}


/* =====================================================
   MAIN
===================================================== */

.main {
    height:
        calc(100vh - 72px);

    display: flex;
    flex-direction: column;

    position: relative;
}

.hud {
    flex: 1;

    position: relative;

    overflow: hidden;
}


/* =====================================================
   HUD CORE
===================================================== */

.hud-core {
    position: absolute;

    left: 50%;
    top: 38%;

    transform:
        translate(-50%, -50%);

    width: 210px;
    height: 210px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;
}

.ring {
    position: absolute;

    border-radius: 50%;

    border:
        1px solid rgba(0, 229, 255, 0.35);

    animation:
        spin 9s linear infinite;
}

.ring.one {
    width: 210px;
    height: 210px;
}

.ring.two {
    width: 170px;
    height: 170px;

    border-style: dashed;

    animation-duration: 6s;
    animation-direction: reverse;
}

.ring.three {
    width: 130px;
    height: 130px;

    border-color:
        rgba(0, 229, 255, 0.7);

    animation-duration: 4s;
}

.core {
    width: 82px;
    height: 82px;

    border-radius: 50%;

    border:
        2px solid #00e5ff;

    color: #00e5ff;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 38px;
    font-weight: 900;

    box-shadow:
        0 0 25px rgba(0, 229, 255, 0.7),
        inset 0 0 20px rgba(0, 229, 255, 0.2);

    z-index: 2;

    transition:
        0.3s ease;
}

.status {
    position: absolute;

    top:
        calc(38% + 120px);

    left: 50%;

    transform:
        translateX(-50%);

    color:
        rgba(255, 255, 255, 0.5);

    font-size: 10px;

    letter-spacing: 2px;

    white-space: nowrap;

    text-align: center;

    transition:
        0.2s ease;
}

.status.busy {
    color: #00e5ff;

    text-shadow:
        0 0 10px rgba(0, 229, 255, 0.5);
}


/* =====================================================
   CHAT
===================================================== */

.chat {
    position: absolute;

    left: 12px;
    right: 12px;

    bottom: 100px;

    max-height: 38%;

    overflow-y: auto;

    display: flex;
    flex-direction: column;

    gap: 8px;

    padding-bottom: 4px;

    scrollbar-width: none;
}

.chat::-webkit-scrollbar {
    display: none;
}

.message {
    max-width: 86%;

    padding:
        11px 14px;

    border-radius: 15px;

    font-size: 14px;

    line-height: 1.45;

    white-space: pre-wrap;

    word-break: break-word;

    animation:
        messageIn 0.2s ease;
}

.message.ai {
    align-self: flex-start;

    background:
        rgba(0, 229, 255, 0.08);

    border:
        1px solid rgba(0, 229, 255, 0.16);
}

.message.user {
    align-self: flex-end;

    background:
        rgba(255, 255, 255, 0.07);

    border:
        1px solid rgba(255, 255, 255, 0.1);
}

.message a {
    color: #00e5ff;
    text-decoration: none;
}

.message a:hover {
    text-decoration: underline;
}


/* =====================================================
   WAITING MESSAGE
===================================================== */

.waiting-message {
    min-width: 170px;
}

.waiting-title {
    color: #00e5ff;

    font-weight: 700;

    margin-bottom: 4px;
}

.waiting-detail {
    color:
        rgba(255, 255, 255, 0.55);

    font-size: 11px;
}


/* =====================================================
   INPUT
===================================================== */

.input-area {
    position: absolute;

    left: 12px;
    right: 12px;

    bottom: 15px;

    height: 58px;

    display: flex;

    gap: 8px;
}

.input {
    min-width: 0;

    flex: 1;

    border:
        1px solid rgba(0, 229, 255, 0.22);

    border-radius: 18px;

    background:
        rgba(5, 15, 20, 0.95);

    color: white;

    padding:
        0 17px;

    outline: none;

    /*
    16px özellikle iPhone'da
    otomatik zoom'u engeller.
    */
    font-size: 16px;

    box-shadow:
        inset 0 0 12px
        rgba(0, 229, 255, 0.025);
}

.input::placeholder {
    color:
        rgba(255, 255, 255, 0.38);
}

.input:focus {
    border-color:
        rgba(0, 229, 255, 0.65);

    box-shadow:
        0 0 14px
        rgba(0, 229, 255, 0.08);
}

.send {
    width: 58px;

    border: 0;

    border-radius: 18px;

    background: #00e5ff;

    color: #001014;

    font-size: 22px;

    font-weight: 900;

    box-shadow:
        0 0 15px
        rgba(0, 229, 255, 0.25);

    transition:
        0.2s ease;
}

.send:disabled {
    opacity: 0.45;
    cursor: default;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
    position: fixed;

    left: 0;
    top: 0;
    bottom: 0;

    width:
        min(330px, 88vw);

    background:
        rgba(2, 7, 10, 0.98);

    border-right:
        1px solid rgba(0, 229, 255, 0.2);

    z-index: 100;

    transform:
        translateX(-105%);

    transition:
        transform 0.25s ease;

    padding:
        22px 15px;

    overflow-y: auto;

    box-shadow:
        10px 0 40px
        rgba(0, 0, 0, 0.35);
}

.sidebar.open {
    transform:
        translateX(0);
}

.sidebar-title {
    color: #00e5ff;

    font-size: 16px;

    font-weight: 800;

    letter-spacing: 2px;

    margin-bottom: 20px;
}

.menu-item {
    width: 100%;

    min-height: 48px;

    border:
        1px solid rgba(255, 255, 255, 0.08);

    border-radius: 14px;

    background:
        rgba(255, 255, 255, 0.035);

    color: white;

    text-align: left;

    padding:
        12px 14px;

    margin-bottom: 8px;

    transition:
        0.2s ease;
}

.menu-item:hover,
.menu-item.active {
    border-color:
        rgba(0, 229, 255, 0.45);

    background:
        rgba(0, 229, 255, 0.08);

    color: #00e5ff;
}

.academic-title {
    margin:
        22px 5px 10px;

    font-size: 10px;

    letter-spacing: 2px;

    color:
        rgba(255, 255, 255, 0.4);
}

.close-sidebar {
    position: absolute;

    right: 14px;
    top: 15px;

    border: 0;

    background: transparent;

    color: #00e5ff;

    font-size: 24px;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay {
    position: fixed;

    inset: 0;

    background:
        rgba(0, 0, 0, 0.5);

    backdrop-filter:
        blur(2px);

    -webkit-backdrop-filter:
        blur(2px);

    z-index: 90;

    display: none;
}

.overlay.show {
    display: block;
}


/* =====================================================
   MODAL
===================================================== */

.modal {
    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width:
        min(92vw, 440px);

    max-height: 85vh;

    overflow-y: auto;

    background:
        #071116;

    border:
        1px solid rgba(0, 229, 255, 0.25);

    border-radius: 22px;

    z-index: 200;

    padding: 22px;

    display: none;

    box-shadow:
        0 20px 80px
        rgba(0, 0, 0, 0.55);
}

.modal.show {
    display: block;
}

.modal h2 {
    margin-top: 0;

    color: #00e5ff;
}

.modal input {
    width: 100%;

    height: 48px;

    margin-bottom: 10px;

    border-radius: 12px;

    border:
        1px solid rgba(255, 255, 255, 0.12);

    background:
        rgba(255, 255, 255, 0.05);

    color: white;

    padding:
        0 12px;

    font-size: 16px;

    outline: none;
}

.modal input:focus {
    border-color:
        rgba(0, 229, 255, 0.6);
}

.modal-button {
    width: 100%;

    height: 46px;

    border: 0;

    border-radius: 12px;

    background: #00e5ff;

    color: #001014;

    font-weight: 800;
}

.secondary-button {
    margin-top: 8px;

    background:
        rgba(255, 255, 255, 0.08);

    color: white;
}


/* =====================================================
   PRESENTATION PROGRESS
===================================================== */

.presentation-progress {
    margin-top: 2px;

    padding: 12px;

    border:
        1px solid rgba(0, 229, 255, 0.16);

    border-radius: 13px;

    background:
        rgba(0, 229, 255, 0.035);
}

.presentation-stage {
    color: #00e5ff;

    font-weight: 700;

    font-size: 13px;
}

.presentation-sub {
    margin-top: 5px;

    color:
        rgba(255, 255, 255, 0.5);

    font-size: 10px;
}

.progress-bar {
    width: 100%;

    height: 3px;

    margin-top: 10px;

    overflow: hidden;

    border-radius: 99px;

    background:
        rgba(255, 255, 255, 0.08);
}

.progress-bar-inner {
    width: 20%;

    height: 100%;

    background:
        #00e5ff;

    border-radius: 99px;

    animation:
        progressMove 1.1s ease-in-out infinite;
}


/* =====================================================
   ERROR
===================================================== */

.error-list {
    max-height: 50vh;

    overflow-y: auto;
}

.error-item {
    padding: 10px;

    margin-bottom: 8px;

    border-radius: 10px;

    background:
        rgba(255, 70, 70, 0.06);

    border:
        1px solid rgba(255, 70, 70, 0.12);

    color:
        rgba(255, 255, 255, 0.8);

    font-size: 12px;

    white-space: pre-wrap;

    word-break: break-word;
}


/* =====================================================
   FUN / SINEM
===================================================== */

body.sinem-mode .ring {
    border-color:
        rgba(255, 80, 180, 0.45);
}

body.sinem-mode .core {
    color: #ff5ab4;

    border-color: #ff5ab4;

    box-shadow:
        0 0 25px rgba(255, 90, 180, 0.55),
        inset 0 0 20px rgba(255, 90, 180, 0.15);
}

body.fun-mode .ring {
    border-color:
        rgba(255, 50, 50, 0.6);
}

body.fun-mode .core {
    color: #ff4444;

    border-color: #ff4444;

    box-shadow:
        0 0 25px rgba(255, 50, 50, 0.6),
        inset 0 0 20px rgba(255, 50, 50, 0.15);
}

body.fun-mode .status {
    color: #ff4444;
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes spin {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }
}

@keyframes logoPulse {

    0%,
    100% {
        box-shadow:
            0 0 12px rgba(0, 229, 255, 0.5),
            inset 0 0 12px rgba(0, 229, 255, 0.12);
    }

    50% {
        box-shadow:
            0 0 22px rgba(0, 229, 255, 0.75),
            inset 0 0 16px rgba(0, 229, 255, 0.18);
    }
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform:
            translateY(5px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}

@keyframes progressMove {

    0% {
        transform:
            translateX(-130%);
    }

    100% {
        transform:
            translateX(550%);
    }
}

</style>
</head>


<body>

    </div>

<script>

/* =====================================================
   CONFIG
===================================================== */

const API = "";

let currentUser = "karahan";

let currentMode = "normal";

let funMode = false;

let sending = false;

let presentationPolling = null;

let dotsTimer = null;

let progressTimer = null;


/* =====================================================
   WAIT MESSAGES
===================================================== */

const waitMessages = [

    "Bir saniye efendim...",

    "Tamam, bir bakıyorum...",

    "Dur, bunu birlikte çözelim...",

    "Bir dakika, düşünüyorum...",

    "Tamam, hemen ilgileniyorum..."

];


/* =====================================================
   HELPER
===================================================== */

function $(id) {

    return document.getElementById(id);

}


/* =====================================================
   SAFE TEXT
===================================================== */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =====================================================
   FORMAT MESSAGE
===================================================== */

function formatText(text) {

    let safe =
        escapeHTML(text);

    safe = safe.replace(
        /(https?:\/\/[^\s<]+)/g,
        '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
    );

    return safe;
}


/* =====================================================
   CHAT MESSAGE
===================================================== */

function addMessage(
    text,
    type = "ai"
) {

    const chat =
        $("chat");

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "message " + type;

    div.innerHTML =
        formatText(text);

    chat.appendChild(
        div
    );

    chat.scrollTop =
        chat.scrollHeight;

    return div;
}


/* =====================================================
   SIDEBAR
===================================================== */

function openSidebar() {

    $("sidebar")
        .classList.add("open");

    $("overlay")
        .classList.add("show");
}


function closeSidebar() {

    $("sidebar")
        .classList.remove("open");

    $("overlay")
        .classList.remove("show");
}


/* =====================================================
   MODALS
===================================================== */

function closeModals() {

    document
        .querySelectorAll(".modal")
        .forEach(
            function(modal) {

                modal.classList.remove(
                    "show"
                );

            }
        );

}


function openProfile() {

    closeSidebar();

    $("profileModal")
        .classList.add("show");

    setTimeout(
        function() {

            $("usernameInput")
                .focus();

        },
        100
    );
}


function handleLoginKey(event) {

    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        login();

    }

}


/* =====================================================
   LOGIN
===================================================== */

async function login() {

    const username =
        $("usernameInput")
            .value
            .trim()
            .toLowerCase();

    const password =
        $("passwordInput")
            .value;

    if (!username) {

        alert(
            "Kullanıcı adı girin."
        );

        $("usernameInput")
            .focus();

        return;
    }


    try {

        const response =
            await fetch(
                API +
                "/profile-login",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            username:
                                username,
                            password:
                                password
                        })

                }
            );


        let data;

        try {

            data =
                await response.json();

        } catch {

            throw new Error(
                "Sunucudan geçersiz yanıt geldi."
            );

        }


        if (
            !response.ok ||
            data.success !== true
        ) {

            alert(
                data.detail ||
                data.message ||
                "Kullanıcı adı veya şifre hatalı."
            );

            return;
        }


        currentUser =
            String(
                data.username ||
                username
            )
            .trim()
            .toLowerCase();


        if (
            currentUser === "ilknur"
        ) {

            currentMode =
                localStorage.getItem(
                    "karvis_mode"
                ) ||
                "lesson";

        } else {

            currentMode =
                "normal";

        }


        localStorage.setItem(
            "karvis_user",
            currentUser
        );

        localStorage.setItem(
            "karvis_mode",
            currentMode
        );


        $("usernameInput")
            .value = "";

        $("passwordInput")
            .value = "";


        closeModals();

        applyUserTheme();

        updateSidebar();

        showGreeting();


        if (
            currentUser === "ilknur"
        ) {

            $("status")
                .textContent =
                "AKADEMİK ASİSTAN HAZIR";

        } else {

            $("status")
                .textContent =
                "K.A.R.V.I.S. HAZIR";

        }


    } catch (error) {

        console.error(
            "Profil giriş hatası:",
            error
        );

        alert(
            "Sunucuya bağlanılamadı.\n\n" +
            error.message
        );

    }

}

/* =====================================================
   NORMAL CHAT
===================================================== */

async function sendMessage() {

    if (sending) {
        return;
    }


    const input =
        $("messageInput");

    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    sending = true;

    setBusy(true);

    input.value = "";


    addMessage(
        message,
        "user"
    );


    const waiting =
        document.createElement(
            "div"
        );

    waiting.className =
        "message ai";

    waiting.textContent =
        getWaitingMessage();

    $("chat").appendChild(
        waiting
    );


    $("chat").scrollTop =
        $("chat").scrollHeight;


    try {

        if (
            currentUser === "ilknur" &&
            currentMode === "presentation"
        ) {

            await createPresentation(
                message,
                waiting
            );

        } else {

            const response =
                await fetch(
                    API + "/chat",
                    {

                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                message:
                                    message,

                                username:
                                    currentUser,

                                mode:
                                    currentMode

                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    data.message ||
                    "Yanıt alınamadı."
                );

            }


            waiting.remove();


            addMessage(
                data.reply ||
                data.answer ||
                "Yanıt alınamadı.",
                "ai"
            );

        }


    } catch (error) {

        waiting.remove();

        addMessage(
            "Bir sorun oluştu: " +
            error.message,
            "ai"
        );


    } finally {

        sending = false;

        setBusy(false);

        input.focus();

    }

}


/* =====================================================
   PRESENTATION
===================================================== */

async function createPresentation(
    topic,
    waiting
) {

    stopPresentationAnimation();


    /*
    İlk mesaj:
    İçerik hazırlanıyor
    */

    const progressMessage =
        document.createElement(
            "div"
        );

    progressMessage.className =
        "message ai waiting-message";


    progressMessage.innerHTML = `

        <div
            id="presentationStage"
            class="waiting-title"
        >
            İçerik hazırlanıyor
            <span id="presentationDots"></span>
        </div>

        <div
            id="presentationDetail"
            class="waiting-detail"
        >
            K.A.R.V.I.S. sunum içeriğini hazırlıyor...
        </div>

        <div class="progress-bar">

            <div
                class="progress-bar-inner"
            ></div>

        </div>
    `;


    waiting.remove();


    $("chat").appendChild(
        progressMessage
    );


    $("chat").scrollTop =
        $("chat").scrollHeight;


    startPresentationAnimation();


    try {

        /*
        YENİ MAIN.PY
        hemen job_id döndürüyor.
        */

        const response =
            await fetch(
                API + "/presentation",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            topic:
                                topic,

                            username:
                                currentUser,

                            slide_count:
                                7

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                data.message ||
                "Sunum başlatılamadı."
            );

        }


        if (
            !data.job_id
        ) {

            throw new Error(
                "Sunum işi başlatıldı fakat job_id alınamadı."
            );

        }


        await pollPresentation(
            data.job_id,
            progressMessage
        );


    } catch (error) {

        stopPresentationAnimation();

        progressMessage.remove();

        addMessage(
            "❌ Sunum oluşturulurken bir sorun oluştu:\n" +
            error.message,
            "ai"
        );

    }

}


/* =====================================================
   PRESENTATION POLLING
===================================================== */

async function pollPresentation(
    jobId,
    progressElement
) {

    return new Promise(
        function(resolve, reject) {

            let attempts = 0;

            const maxAttempts =
                600;


            presentationPolling =
                setInterval(
                    async function() {

                        attempts++;


                        if (
                            attempts >
                            maxAttempts
                        ) {

                            clearInterval(
                                presentationPolling
                            );

                            presentationPolling =
                                null;

                            reject(
                                new Error(
                                    "Sunum oluşturma zaman aşımına uğradı."
                                )
                            );

                            return;
                        }


                        try {

                            const response =
                                await fetch(
                                    API +
                                    "/presentation-status/" +
                                    encodeURIComponent(
                                        jobId
                                    )
                                );


                            if (
                                !response.ok
                            ) {

                                throw new Error(
                                    "Sunum durumu alınamadı."
                                );

                            }


                            const data =
                                await response.json();


                            updatePresentationUI(
                                data,
                                progressElement
                            );


                            if (
                                data.completed
                            ) {

                                clearInterval(
                                    presentationPolling
                                );

                                presentationPolling =
                                    null;


                                stopPresentationAnimation();


                                if (
                                    data.success &&
                                    data.file_url
                                ) {

                                    progressElement.remove();

                                    showPresentationResult(
                                        data.file_url
                                    );

                                    resolve();

                                } else {

                                    progressElement.remove();

                                    reject(
                                        new Error(
                                            data.error ||
                                            "Sunum oluşturulamadı."
                                        )
                                    );

                                }

                            }


                        } catch (error) {

                            clearInterval(
                                presentationPolling
                            );

                            presentationPolling =
                                null;

                            reject(error);

                        }

                    },
                    600
                );

        }
    );

}


/* =====================================================
   PRESENTATION UI
===================================================== */

function updatePresentationUI(
    data,
    progressElement
) {

    if (!progressElement) {
        return;
    }


    const stage =
        progressElement.querySelector(
            "#presentationStage"
        );

    const detail =
        progressElement.querySelector(
            "#presentationDetail"
        );


    if (!stage) {
        return;
    }


    let title =
        "İçerik hazırlanıyor";


    let detailText =
        "K.A.R.V.I.S. sunum içeriğini hazırlıyor...";


    if (
        data.stage === "content"
    ) {

        title =
            "İçerik hazırlanıyor";

        detailText =
            "Sunum içeriği hazırlanıyor...";

    }


    else if (
        data.stage === "visuals"
    ) {

        title =
            "Görseller aranıyor";

        if (
            data.total
        ) {

            detailText =
                "Görseller aranıyor " +
                data.progress +
                " / " +
                data.total;

        } else {

            detailText =
                "Sunuma uygun görseller aranıyor...";

        }

    }


    else if (
        data.stage === "pdf"
    ) {

        title =
            "PDF oluşturuluyor";

        if (
            data.total
        ) {

            detailText =
                "PDF sayfaları hazırlanıyor " +
                data.progress +
                " / " +
                data.total;

        } else {

            detailText =
                "PDF dosyası hazırlanıyor...";

        }

    }


    else if (
        data.stage === "completed"
    ) {

        title =
            "Sunum hazır";

        detailText =
            "PDF başarıyla oluşturuldu.";

    }


    else if (
        data.stage === "error"
    ) {

        title =
            "Sunum oluşturulamadı";

        detailText =
            data.error ||
            "Bilinmeyen bir hata oluştu.";

    }


    stage.innerHTML =
        escapeHTML(title) +
        ' <span id="presentationDots"></span>';


    if (detail) {

        detail.textContent =
            detailText;

    }

}


/* =====================================================
   DOT ANIMATION
===================================================== */

function startPresentationAnimation() {

    stopPresentationAnimation();


    let dotState = 0;


    const updateDots =
        function() {

            const dots =
                document.getElementById(
                    "presentationDots"
                );


            if (!dots) {
                return;
            }


            dotState++;


            if (
                dotState > 3
            ) {

                dotState = 1;

            }


            dots.textContent =
                ".".repeat(
                    dotState
                );

        };


    updateDots();


    dotsTimer =
        setInterval(
            updateDots,
            450
        );

}


/* =====================================================
   STOP DOT ANIMATION
===================================================== */

function stopPresentationAnimation() {

    if (
        dotsTimer
    ) {

        clearInterval(
            dotsTimer
        );

        dotsTimer =
            null;

    }


    if (
        presentationPolling
    ) {

        clearInterval(
            presentationPolling
        );

        presentationPolling =
            null;

    }

}

/* =====================================================
   ERRORS
===================================================== */

async function openErrors() {

    closeSidebar();


    $("errorModal")
        .classList.add("show");


    $("errorContent").textContent =
        "Yükleniyor...";


    try {

        const response =
            await fetch(
                API + "/errors"
            );


        const data =
            await response.json();


        const errors =
            data.errors || [];


        if (
            !errors.length
        ) {

            $("errorContent").textContent =
                "Kayıtlı hata bulunmuyor.";

            return;

        }


        const wrapper =
            document.createElement(
                "div"
            );

        wrapper.className =
            "error-list";


        errors
            .slice()
            .reverse()
            .forEach(
                function(item) {

                    const div =
                        document.createElement(
                            "div"
                        );

                    div.className =
                        "error-item";


                    div.textContent =
                        (
                            item.time
                                ? item.time +
                                  "\n"
                                : ""
                        ) +
                        (
                            item.error ||
                            item.message ||
                            "Bilinmeyen hata."
                        );


                    wrapper.appendChild(
                        div
                    );

                }
            );


        $("errorContent")
            .innerHTML = "";

        $("errorContent")
            .appendChild(
                wrapper
            );


    } catch (error) {

        $("errorContent").textContent =
            "Hatalar alınamadı:\n" +
            error.message;

    }

}
